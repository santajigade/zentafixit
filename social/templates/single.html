<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- One-guide promo video. Data from ../work/data.js (window.DATA.guide). Hash #v = vertical 1080x1920, #gif = static grid. -->
<style>
@font-face{font-family:"OS";src:url("../fonts/open-sans-wdth.woff2") format("woff2");font-weight:300 800;font-stretch:75% 100%;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#0F2240;font-family:"OS",sans-serif;color:#fff}
.abs{position:absolute}
.scene{left:0;top:0;width:1080px;height:100%}
#grid{inset:0;background-image:linear-gradient(rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(rgba(120,170,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.07) 1px,transparent 1px);background-size:180px 180px,180px 180px,36px 36px,36px 36px}
#glow{inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,210,63,.14),rgba(15,34,64,0) 55%)}
.cond{font-stretch:75%;font-weight:800;letter-spacing:-1px}
.y{color:#FFD23F}
.logo{background:#FFD23F;border-radius:22%}
.logo svg{width:100%;height:100%;display:block}
.center{left:0;width:1080px;text-align:center}
#h1,#h2,#title,#kt,.ck .tx,#sbox .hd,#sbox .tx,#c1,#c3{text-wrap:balance}
.pilltag{display:inline-block;background:#FFD23F;color:#0F2240;font-weight:800;border-radius:12px;text-transform:uppercase;letter-spacing:1px}
#hdr{left:60px;top:48px;display:flex;align-items:center;gap:18px}
#hdr .logo{width:64px;height:64px}
#hdr .wm{font-size:46px}
/* hook */
#h0{top:250px} #h0 .pilltag{font-size:36px;padding:6px 24px 8px}
#h1{top:360px;font-size:150px;line-height:.95;padding:0 50px}
#h2{top:800px;font-size:60px;font-weight:700}
/* card */
.tag{left:60px;top:160px;font-size:34px;padding:6px 22px 8px}
#imgbox{left:60px;top:240px;width:960px;height:504px;border-radius:22px;overflow:hidden;border:3px solid rgba(255,210,63,.55);box-shadow:0 20px 50px rgba(0,0,0,.4)}
#imgbox img{width:100%;height:100%;display:block}
#title{left:60px;top:775px;width:960px;font-size:84px;line-height:1.02}
/* checks */
#kt{left:60px;top:160px;width:960px;font-size:70px;line-height:1}
#ks{left:60px;top:248px;font-size:40px;font-weight:700;color:rgba(255,255,255,.8)}
.ck{left:60px;width:960px;height:150px;border-radius:22px;background:rgba(23,48,90,.92);border:2px solid rgba(255,210,63,.4);display:flex;align-items:center;gap:30px;padding:0 30px}
.ck .n{flex:none;width:90px;height:90px;border-radius:50%;background:#FFD23F;color:#0F2240;display:flex;align-items:center;justify-content:center;font-size:56px}
.ck .tx{font-size:46px;font-weight:700;line-height:1.15}
/* safety */
#sbox{left:90px;top:300px;width:900px;border-radius:28px;border:4px solid #FFD23F;background:rgba(23,48,90,.92);padding:50px 56px;text-align:center}
#sbox .ic{width:120px;height:120px;margin:0 auto 24px}
#sbox .hd{font-size:80px;line-height:1}
#sbox .tx{margin-top:26px;font-size:46px;font-weight:600;line-height:1.25}
/* end */
#endlogo{left:420px;top:150px;width:240px;height:240px}
#c1{top:440px;font-size:64px;font-weight:700}
#c2{top:530px;font-size:130px;line-height:1}
#cta{left:0;top:700px;width:1080px;display:flex;justify-content:center}
#pill{background:#FFD23F;color:#0F2240;border-radius:60px;padding:14px 46px 18px;font-size:92px;line-height:1.05}
#c3{top:880px;font-size:44px;font-weight:600;color:rgba(255,255,255,.88)}
#fade{inset:0;background:#0F2240}
/* vertical */
html.v,body.v{height:1920px}
body.v #glow{background:radial-gradient(circle at 50% 45%,rgba(255,210,63,.16),rgba(15,34,64,0) 50%)}
body.v #hdr{top:170px} body.v #hdr .logo{width:84px;height:84px} body.v #hdr .wm{font-size:60px}
body.v #h0{top:520px} body.v #h0 .pilltag{font-size:46px;padding:8px 28px 10px}
body.v #h1{top:650px;font-size:190px;padding:0 40px}
body.v #h2{top:1260px;font-size:72px}
body.v .tag{top:360px;font-size:46px;padding:8px 26px 10px}
body.v #imgbox{top:450px;left:40px;width:1000px;height:525px}
body.v #title{left:40px;top:1040px;width:1000px;font-size:104px}
body.v #kt{left:40px;top:360px;width:1000px;font-size:96px}
body.v #ks{left:40px;top:480px;font-size:50px}
body.v .ck{left:40px;width:1000px;height:190px}
body.v .ck .n{width:110px;height:110px;font-size:68px}
body.v .ck .tx{font-size:54px}
body.v #sbox{left:60px;top:560px;width:960px;padding:70px 60px}
body.v #sbox .ic{width:150px;height:150px}
body.v #sbox .hd{font-size:100px}
body.v #sbox .tx{font-size:56px}
body.v #endlogo{top:380px}
body.v #c1{top:700px;font-size:74px}
body.v #c2{top:800px;font-size:150px}
body.v #cta{top:1020px}
body.v #pill{font-size:118px}
body.v #c3{top:1240px;font-size:54px}
</style></head><body>
<script>if(location.hash.includes("v")){document.body.classList.add("v");document.documentElement.classList.add("v");}</script>
<script src="../work/data.js"></script>
<div id="grid" class="abs"></div><div id="glow" class="abs"></div>
<div id="hdr" class="abs"><div class="logo"><svg viewBox="0 0 260 260"><path d="M72 78 H188 L72 182 H188" fill="none" stroke="#0F2240" stroke-width="40" stroke-linecap="square"/></svg></div><div class="wm cond">Zenta<span class="y">Fixit</span></div></div>
<div id="sHook" class="abs scene">
 <div id="h0" class="abs center"><span class="pilltag" id="tag0"></span></div>
 <div id="h1" class="abs center cond"></div>
 <div id="h2" class="abs center y"></div>
</div>
<div id="sCard" class="abs scene">
 <div class="tag abs pilltag" id="tag1"></div>
 <div id="imgbox" class="abs"><img id="img"></div>
 <div id="title" class="abs cond"></div>
</div>
<div id="sChecks" class="abs scene">
 <div id="kt" class="abs cond"></div>
 <div id="ks" class="abs">Quick checks first</div>
 <div id="cks"></div>
</div>
<div id="sSafe" class="abs scene">
 <div id="sbox" class="abs"><svg class="ic" viewBox="0 0 120 120"><path d="M60 10 L112 104 H8 Z" fill="#FFD23F" stroke="#FFD23F" stroke-width="8" stroke-linejoin="round"/><rect x="54" y="42" width="12" height="36" rx="5" fill="#0F2240"/><circle cx="60" cy="90" r="7" fill="#0F2240"/></svg><div class="hd cond y" id="shd">Safety first</div><div class="tx" id="stx"></div></div>
</div>
<div id="sEnd" class="abs scene">
 <div id="endlogo" class="abs logo"><svg viewBox="0 0 260 260"><path d="M72 78 H188 L72 182 H188" fill="none" stroke="#0F2240" stroke-width="40" stroke-linecap="square"/></svg></div>
 <div id="c1" class="abs center">Every step, with diagrams.</div>
 <div id="c2" class="abs center cond">Full guide <span class="y">free</span></div>
 <div id="cta" class="abs"><div id="pill" class="cond">zentafixit.com</div></div>
 <div id="c3" class="abs center">New guides every day. Follow for more.</div>
</div>
<div id="fade" class="abs"></div>
<script>
const g=window.DATA.guide, V=document.body.classList.contains('v');
const esc=s=>s.replace(/&(?!amp;)/g,'&amp;').replace(/(\w)-(\w)/g,'$1\u2011$2');
const $=id=>document.getElementById(id);
$('tag0').innerHTML=$('tag1').innerHTML=esc(g.tag);
$('h1').innerHTML=esc(g.hook);
$('h2').textContent=g.hookSub||"Try these fixes first";
$('img').src=`../../design/featured/${g.slug}.svg`;
const t=(V&&g.titleVertical)?g.titleVertical:g.title;
$('title').innerHTML=`${esc(t[0])}<br><span class="y">${esc(t[1])}</span>`;
$('kt').innerHTML=esc(g.checksTitle||t[0]);
if(g.checksSub)$('ks').textContent=g.checksSub;
const NC=g.checks.length;
const top0=V?600:330, step=V?230:172;
$('cks').innerHTML=g.checks.map((c,i)=>`<div class="ck abs" style="top:${top0+i*step}px"><div class="n cond">${i+1}</div><div class="tx">${esc(c)}</div></div>`).join('');
$('stx').innerHTML=esc(g.safety||'');
if(g.safetyTitle)$("shd").textContent=g.safetyTitle;
// timeline (keep in sync with build.py)
const TL={hook:[0,3.6],card:[3.6,7.8]}; TL.checks=[7.8,7.8+1.0+NC*2.2];
TL.safe=g.safety?[TL.checks[1],TL.checks[1]+3.2]:[TL.checks[1],TL.checks[1]];
TL.end=[TL.safe[1],TL.safe[1]+4.2]; const DUR=TL.end[1];
window.DUR=DUR; window.TL=TL;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function show(el,o,x=0,y=0,s=1){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s})`;}
function scene(id,[a,b],t,first,last){const el=$(id);const vis=t>a-0.1&&t<b+0.05&&b>a;el.style.display=vis?'block':'none';
 const inn=first?1:eio(p(t,a-0.05,a+0.45)),out=last?0:eio(p(t,b-0.45,b));el.style.transform=`translateX(${1080*(1-inn)-1080*out}px)`;return vis;}
window.fitTitles=function(){const el=$('title');let fs=parseFloat(getComputedStyle(el).fontSize);const s=$('sCard'),d=s.style.display;s.style.display='block';
 while(el.scrollHeight>fs*1.02*2.2&&fs>50){fs-=2;el.style.fontSize=fs+'px';}s.style.display=d;
 const h=$('h1');let hs=parseFloat(getComputedStyle(h).fontSize);const sh=$('sHook'),dh=sh.style.display;sh.style.display='block';
 const maxH=V?560:420;while(h.scrollHeight>maxH&&hs>70){hs-=4;h.style.fontSize=hs+'px';}sh.style.display=dh;};
window.render=function(t){
 if(!location.hash.includes('gif'))$('grid').style.backgroundPosition=`${-t*12}px ${-t*8}px`;
 $('fade').style.opacity=1-p(t,0,0.4)+p(t,DUR-0.45,DUR);
 const h=eo(p(t,0.1,0.6));show($('hdr'),h,0,-30*(1-h));
 let a;
 if(scene('sHook',TL.hook,t,true,false)){a=TL.hook[0];
  const q0=p(t,a+0.2,a+0.7);show($('h0'),eo(q0),0,-20*(1-eo(q0)));
  const q1=p(t,a+0.4,a+1.0);show($('h1'),eo(q1),0,0,0.8+0.2*back(q1));
  const q2=eo(p(t,a+1.2,a+1.7));show($('h2'),q2,0,30*(1-q2));}
 if(scene('sCard',TL.card,t)){a=TL.card[0];
  $('img').style.transform=`scale(${1+0.08*p(t,a,TL.card[1])})`;
  const q=eo(p(t,a+0.3,a+0.7));show($('tag1'),q,0,-20*(1-q));
  const q2=eo(p(t,a+0.5,a+1.0));show($('title'),q2,0,40*(1-q2));}
 if(scene('sChecks',TL.checks,t)){a=TL.checks[0];
  const q=eo(p(t,a+0.2,a+0.6));show($('kt'),q,0,-20*(1-q));show($('ks'),eo(p(t,a+0.4,a+0.8)));
  document.querySelectorAll('.ck').forEach((el,i)=>{const s=a+1.0+i*2.2;const r=p(t,s,s+0.45);
   el.style.opacity=eo(r);el.style.transform=`translateX(${-60*(1-eo(r))}px)`;
   el.querySelector('.n').style.transform=`scale(${back(p(t,s+0.1,s+0.55))})`;});}
 if(scene('sSafe',TL.safe,t)){a=TL.safe[0];const q=p(t,a+0.2,a+0.8);show($('sbox'),eo(q),0,0,0.85+0.15*back(q));}
 if(scene('sEnd',TL.end,t,false,true)){a=TL.end[0];
  const el=p(t,a,a+0.6);show($('endlogo'),eo(el),0,0,back(el));
  const e=p(t,a+0.1,a+0.6);show($('c1'),eo(e),0,30*(1-eo(e)));
  const e2=p(t,a+0.35,a+0.9);show($('c2'),eo(e2),0,0,0.8+0.2*back(e2));
  const e3=p(t,a+0.8,a+1.4);show($('cta'),eo(e3),0,0,(0.6+0.4*back(e3))*(t>a+1.7?1+0.03*Math.sin((t-a-1.7)*5):1));
  const e4=eo(p(t,a+1.3,a+1.8));show($('c3'),e4,0,24*(1-e4));}
};
render(0);
</script></body></html>
