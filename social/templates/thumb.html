<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Thumbnail template. #s = 1080x1080, #v = 1080x1920. Data from ../work/data.js -->
<style>
@font-face{font-family:"OS";src:url("../fonts/open-sans-wdth.woff2") format("woff2");font-weight:300 800;font-stretch:75% 100%;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F2240;font-family:"OS",sans-serif;color:#fff;overflow:hidden;position:relative;width:1080px}
body.s{height:1080px} body.v{height:1920px}
.bg{position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(rgba(120,170,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.07) 1px,transparent 1px);background-size:180px 180px,180px 180px,36px 36px,36px 36px}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,210,63,.2),rgba(15,34,64,0) 50%)}
.cond{font-stretch:75%;font-weight:800;letter-spacing:-1px}
.y{color:#FFD23F}
.abs{position:absolute}
.logo{background:#FFD23F;border-radius:22%}
.logo svg{width:100%;height:100%;display:block}
.hdr{display:flex;align-items:center;gap:18px}
.head{text-align:center;width:1080px;line-height:.9;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tile{border-radius:20px;overflow:hidden;border:3px solid rgba(255,210,63,.6);background:#0F2240;position:relative}
.tile img{width:100%;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;background:#FFD23F;color:#0F2240;text-align:center;font-stretch:75%;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pill{background:#FFD23F;color:#0F2240;border-radius:60px;display:inline-block}
.foot{width:1080px;text-align:center}
.s .hdr{left:60px;top:44px} .s .hdr .logo{width:70px;height:70px} .s .hdr .wm{font-size:50px}
.s .date{right:60px;top:60px;font-size:36px;font-weight:700;color:rgba(255,255,255,.8)}
.s .head{top:135px;font-size:136px}
.s .grid{left:60px;top:405px;width:960px}
.s .tile span{font-size:34px;padding:2px 0 6px}
.s .foot{top:948px}
.s .pill{font-size:54px;padding:4px 32px 10px}
.s .sub{display:none}
.v .hdr{left:60px;top:170px} .v .hdr .logo{width:90px;height:90px} .v .hdr .wm{font-size:64px}
.v .date{right:60px;top:192px;font-size:44px;font-weight:700;color:rgba(255,255,255,.8)}
.v .head{top:330px;font-size:190px}
.v .grid{left:40px;top:740px;width:1000px;gap:22px}
.v .tile span{position:static;display:block;font-size:42px;padding:6px 0 10px}
.v .sub{top:1470px;width:1080px;text-align:center;font-size:56px;font-weight:700}
.v .foot{top:1575px}
.v .pill{font-size:80px;padding:8px 44px 14px}
/* 1 or 3+ rows: shrink tiles */
.many.s .grid{grid-template-columns:1fr 1fr 1fr;gap:18px}
.many.s .tile span{font-size:26px}
.many.v .grid{gap:18px}
.many.v .tile span{font-size:34px}
</style></head><body>
<script>document.body.className=location.hash.slice(1)||'s';</script>
<script src="../work/data.js"></script>
<div class="bg"></div><div class="glow"></div>
<div class="hdr abs"><div class="logo"><svg viewBox="0 0 260 260"><path d="M72 78 H188 L72 182 H188" fill="none" stroke="#0F2240" stroke-width="40" stroke-linecap="square"/></svg></div><div class="wm cond">Zenta<span class="y">Fixit</span></div></div>
<div class="date abs cond" id="date"></div>
<div class="head abs cond" id="head"></div>
<div class="grid abs" id="grid"></div>
<div class="sub abs">Step-by-step guides, safety first</div>
<div class="foot abs"><span class="pill cond">zentafixit.com</span></div>
<script>
const D=window.DATA,G=D.guides,N=G.length;
document.getElementById('date').textContent=D.dateLabel.toUpperCase();
document.getElementById('head').innerHTML=`<span class="y">${N} new</span><br>${N==1?'home fix':'home fixes'}`;
if(N>4)document.body.classList.add('many');
document.getElementById('grid').innerHTML=G.map(g=>`<div class="tile"><img src="../../design/featured/${g.slug}.svg"><span>${g.short.replace(/&/g,'&amp;')}</span></div>`).join('');
</script>
</body></html>
