<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- One-guide thumbnail. #s = 1080x1080, #v = 1080x1920. Data from ../work/data.js -->
<style>
@font-face{font-family:"OS";src:url("../fonts/open-sans-wdth.woff2") format("woff2");font-weight:300 800;font-stretch:75% 100%;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F2240;font-family:"OS",sans-serif;color:#fff;overflow:hidden;position:relative;width:1080px}
body.s{height:1080px} body.v{height:1920px}
.bg{position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(120,170,230,.16) 2px,transparent 2px),linear-gradient(rgba(120,170,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.07) 1px,transparent 1px);background-size:180px 180px,180px 180px,36px 36px,36px 36px}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,210,63,.2),rgba(15,34,64,0) 50%)}
.cond{font-stretch:75%;font-weight:800;letter-spacing:-1px}
.y{color:#FFD23F}
.abs{position:absolute}
.logo{background:#FFD23F;border-radius:22%}
.logo svg{width:100%;height:100%;display:block}
.hdr{display:flex;align-items:center;gap:18px}
.tag{display:inline-block;background:#FFD23F;color:#0F2240;font-weight:800;border-radius:12px;text-transform:uppercase;letter-spacing:1px}
.img{border-radius:22px;overflow:hidden;border:4px solid #FFD23F;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.img img{width:100%;height:100%;display:block}
.head{text-transform:uppercase;line-height:.92;text-wrap:balance}
.pill{background:#FFD23F;color:#0F2240;border-radius:60px;display:inline-block}
.s .hdr{left:60px;top:44px} .s .hdr .logo{width:70px;height:70px} .s .hdr .wm{font-size:50px}
.s .tagw{right:60px;top:56px} .s .tag{font-size:32px;padding:6px 20px 8px}
.s .img{left:60px;top:150px;width:960px;height:504px}
.s .head{left:60px;top:690px;width:960px;font-size:118px}
.s .foot{left:60px;top:960px}
.s .pill{font-size:50px;padding:4px 30px 10px}
.v .hdr{left:60px;top:170px} .v .hdr .logo{width:90px;height:90px} .v .hdr .wm{font-size:64px}
.v .tagw{left:0;width:1080px;text-align:center;top:360px} .v .tag{font-size:46px;padding:8px 28px 10px}
.v .img{left:40px;top:460px;width:1000px;height:525px}
.v .head{left:40px;top:1040px;width:1000px;font-size:150px;text-align:center}
.v .foot{left:0;width:1080px;text-align:center;top:1500px}
.v .pill{font-size:80px;padding:8px 44px 14px}
</style></head><body>
<script>document.body.className=location.hash.slice(1)||'s';</script>
<script src="../work/data.js"></script>
<div class="bg"></div><div class="glow"></div>
<div class="hdr abs"><div class="logo"><svg viewBox="0 0 260 260"><path d="M72 78 H188 L72 182 H188" fill="none" stroke="#0F2240" stroke-width="40" stroke-linecap="square"/></svg></div><div class="wm cond">Zenta<span class="y">Fixit</span></div></div>
<div class="tagw abs"><span class="tag" id="tag"></span></div>
<div class="img abs"><img id="img"></div>
<div class="head abs cond" id="head"></div>
<div class="foot abs"><span class="pill cond">zentafixit.com</span></div>
<script>
const g=window.DATA.guide, esc=s=>s.replace(/&(?!amp;)/g,'&amp;').replace(/(\w)-(\w)/g,'$1\u2011$2');
document.getElementById('tag').innerHTML=esc(g.tag);
document.getElementById('img').src=`../../design/featured/${g.slug}.svg`;
const th=g.thumbTitle||[g.short,"Easy fix"];
document.getElementById('head').innerHTML=`${esc(th[0])}<br><span class="y">${esc(th[1])}</span>`;
window.fit=function(){const h=document.getElementById('head');let fs=parseFloat(getComputedStyle(h).fontSize);
 const max=document.body.classList.contains('v')?400:250;while(h.scrollHeight>max&&fs>60){fs-=4;h.style.fontSize=fs+'px';}};
</script>
</body></html>
