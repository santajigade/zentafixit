<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="sra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a smart home routine works</text>
  <text x="24" y="54" font-size="13" fill="#566475">Every routine has three parts. Any one of them can stop it.</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="70" width="176" height="180" rx="8"/><rect x="232" y="70" width="176" height="180" rx="8"/><rect x="440" y="70" width="176" height="180" rx="8"/>
  </g>
  <g fill="#dfe9f7"><rect x="25" y="71" width="174" height="38" rx="7"/><rect x="233" y="71" width="174" height="38" rx="7"/><rect x="441" y="71" width="174" height="38" rx="7"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#sra)"><path d="M202 160h28"/><path d="M410 160h28"/></g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="112" y="96">1. Trigger</text><text x="320" y="96">2. Conditions</text><text x="528" y="96">3. Actions</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="112" y="134">A set time</text><text x="112" y="156">Sunrise or sunset</text><text x="112" y="178">Motion or door sensor</text><text x="112" y="200">Voice command</text><text x="112" y="222">Arrive or leave home</text>
    <text x="320" y="134">Only after sunset</text><text x="320" y="156">Only if nobody home</text><text x="320" y="178">Only on weekdays</text><text x="320" y="214" font-size="12" fill="#566475">(optional, all must</text><text x="320" y="230" font-size="12" fill="#566475">be true)</text>
    <text x="528" y="134">Turn on lights</text><text x="528" y="156">Set the thermostat</text><text x="528" y="178">Lock the door</text><text x="528" y="200">Play a message</text>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="264" width="176" height="52" rx="8"/><rect x="232" y="264" width="176" height="52" rx="8"/><rect x="440" y="264" width="176" height="52" rx="8"/>
  </g>
  <g font-size="12" fill="#14202c" text-anchor="middle">
    <text x="112" y="285" font-weight="700">Breaks if: wrong</text><text x="112" y="302">time zone, dead sensor</text>
    <text x="320" y="285" font-weight="700">Breaks if: a condition</text><text x="320" y="302">is never true</text>
    <text x="528" y="285" font-weight="700">Breaks if: device</text><text x="528" y="302">offline or unlinked</text>
  </g>
  <rect x="24" y="330" width="592" height="54" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="352" font-weight="700">Where it runs: on a local hub, or in the maker's cloud.</text>
    <text x="40" y="372">If the hub or the internet is down, the routine can't reach your devices.</text>
  </g>
</svg>
