<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What to check on a portable generator</text>
  <!-- frame -->
  <rect x="210" y="80" width="230" height="270" rx="14" fill="none" stroke="#0f2240" stroke-width="5"/>
  <!-- tank -->
  <rect x="222" y="94" width="206" height="62" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="370" y="80" width="34" height="16" rx="4" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <!-- engine -->
  <rect x="222" y="170" width="114" height="130" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="2"><path d="M240 190h78M240 204h78M240 218h78"/></g>
  <rect x="232" y="236" width="18" height="30" rx="3" fill="#0f2240"/>
  <circle cx="290" cy="270" r="18" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="216" y="262" width="12" height="20" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <rect x="300" y="300" width="22" height="14" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <!-- control panel -->
  <rect x="346" y="170" width="82" height="130" rx="10" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
    <circle cx="387" cy="192" r="9" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <rect x="358" y="214" width="58" height="22" rx="4" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <rect x="358" y="250" width="58" height="36" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><rect x="374" y="258" width="4" height="10"/><rect x="394" y="258" width="4" height="10"/><circle cx="386" cy="277" r="3"/></g>
  <circle cx="338" cy="162" r="6" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <!-- wheels -->
  <circle cx="240" cy="358" r="18" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <circle cx="410" cy="358" r="18" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M370 88H190V96"/><path d="M232 250H190"/><path d="M216 272H190"/><path d="M311 314V340H190"/>
    <path d="M344 162H455"/><path d="M396 192H455"/><path d="M416 231H455"/><path d="M416 280H455"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="92" font-weight="700">Fuel cap</text><text x="24" y="110" font-size="13" fill="#566475">Open the vent if fitted</text>
    <text x="24" y="232" font-weight="700">Spark plug</text><text x="24" y="250" font-size="13" fill="#566475">Under a rubber boot</text>
    <text x="24" y="282" font-weight="700">Recoil handle</text><text x="24" y="300" font-size="13" fill="#566475">Long, steady pulls</text>
    <text x="24" y="336" font-weight="700">Oil fill, dipstick</text><text x="24" y="354" font-size="13" fill="#566475">Low-oil sensor inside</text>
    <text x="462" y="156" font-weight="700">Fuel valve</text><text x="462" y="174" font-size="13" fill="#566475">Turn to ON</text>
    <text x="462" y="238" font-weight="700">Choke lever</text><text x="462" y="256" font-size="13" fill="#566475">Closed for cold start</text>
    <text x="462" y="194" font-weight="700">Engine switch</text><text x="462" y="212" font-size="13" fill="#566475">Must be ON to spark</text>
    <text x="462" y="288" font-weight="700">Outlet panel</text><text x="462" y="306" font-size="13" fill="#566475">Unplug to start</text>
  </g>
  <text x="24" y="400" font-size="12" fill="#566475">Simplified layout. Control positions and labels differ between models.</text>
</svg>
