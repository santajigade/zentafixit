<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs>
    <marker id="cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker>
    <marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside a laptop: how heat gets out</text>
  <rect x="30" y="56" width="400" height="264" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="380" y="100" width="40" height="120" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="1.5"><path d="M380 115h40M380 130h40M380 145h40M380 160h40M380 175h40M380 190h40M380 205h40"/></g>
  <path d="M170 262H400V222" fill="none" stroke="#d9442b" stroke-width="8" stroke-opacity=".7" stroke-linecap="round"/>
  <circle cx="300" cy="160" r="50" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="300" cy="160" r="12" fill="#0f2240"/>
  <g fill="none" stroke="#0f2240" stroke-width="2"><path d="M300 148c10-20 24-28 34-26M312 160c20 10 28 24 26 34M300 172c-10 20-24 28-34 26M288 160c-20-10-28-24-26-34"/></g>
  <rect x="80" y="232" width="90" height="60" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"><circle cx="340" cy="132" r="7"/><circle cx="262" cy="190" r="7"/><circle cx="400" cy="120" r="7"/><circle cx="400" cy="196" r="7"/></g>
  <g fill="none" stroke="#1d5fae" stroke-width="2.5"><path d="M60 140H236" marker-end="url(#cool)"/><path d="M60 180H236" marker-end="url(#cool)"/></g>
  <g fill="none" stroke="#d9442b" stroke-width="2.5"><path d="M434 125h52" marker-end="url(#hot)"/><path d="M434 160h52" marker-end="url(#hot)"/><path d="M434 195h52" marker-end="url(#hot)"/></g>
  <g font-size="14" fill="#14202c">
    <text x="60" y="124" fill="#1d5fae" font-weight="700">Cool air in</text>
    <text x="60" y="204" font-size="12" fill="#566475">intake vents, bottom</text>
    <text x="125" y="267" text-anchor="middle">Processor</text>
    <text x="300" y="232" text-anchor="middle">Fan</text>
    <text x="372" y="88" text-anchor="end">Heat sink fins</text>
    <text x="190" y="286" font-size="12" fill="#566475">Heat pipe carries heat to the fins</text>
    <text x="498" y="156" fill="#d9442b" font-weight="700">Hot air out</text>
    <text x="498" y="174" font-size="12" fill="#566475">exhaust vent</text>
  </g>
  <rect x="30" y="336" width="580" height="50" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="357" font-weight="700">Yellow dots: where dust packs in</text>
    <text x="320" y="375" font-size="12">Fan blades and heat sink fins. Blocked fins mean hot air can't escape.</text>
  </g>
</svg>
