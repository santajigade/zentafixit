<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs>
    <marker id="ew-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker>
    <marker id="ew-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How an extender and a mesh system work</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="52" width="592" height="172" rx="8"/><rect x="24" y="240" width="592" height="180" rx="8"/></g>
  <g font-size="14" font-weight="700" fill="#0f2240"><text x="44" y="78">Wi-Fi extender (repeater)</text><text x="44" y="266">Mesh Wi-Fi system</text></g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="48" y="92" width="120" height="44" rx="8"/><rect x="260" y="92" width="120" height="44" rx="8"/><rect x="472" y="92" width="120" height="44" rx="8"/>
    <rect x="48" y="280" width="120" height="44" rx="8"/><rect x="260" y="280" width="120" height="44" rx="8"/><rect x="472" y="280" width="120" height="44" rx="8"/>
  </g>
  <rect x="260" y="92" width="120" height="44" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="108" y="119">Router</text><text x="320" y="119">Extender</text><text x="532" y="119">Laptop</text>
    <text x="108" y="307">Main node</text><text x="320" y="307">Satellite</text><text x="532" y="307">Laptop</text>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#ew-a)">
    <path d="M170 114h86"/><path d="M382 114h86"/><path d="M382 302h86"/>
  </g>
  <path d="M170 302h86" fill="none" stroke="#1d5fae" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ew-b)"/>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="214" y="106">Wi-Fi</text><text x="426" y="106">Wi-Fi</text><text x="426" y="294">Wi-Fi</text>
  </g>
  <text x="214" y="294" font-size="12" fill="#1d5fae" text-anchor="middle" font-weight="700">backhaul</text>
  <g font-size="12" fill="#14202c">
    <text x="44" y="164">A single-radio extender listens and resends on the same radio,</text>
    <text x="44" y="182">so the two hops share airtime and speed past it often drops a lot.</text>
    <text x="44" y="206" fill="#566475">It may use its own network name (such as Home_EXT) or copy yours.</text>
    <text x="44" y="352">One network name. Devices move between nodes automatically.</text>
    <text x="44" y="370">The link between nodes (backhaul) can use a dedicated radio</text>
    <text x="44" y="388">on many tri-band systems, or an Ethernet cable.</text>
    <text x="44" y="408" fill="#566475">Nodes are designed to work together and are managed in one app.</text>
  </g>
</svg>
