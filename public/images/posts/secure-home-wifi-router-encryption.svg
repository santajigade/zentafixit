<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Wi-Fi security modes, best to worst</text>
  <g stroke-width="2">
    <rect x="24" y="56" width="110" height="46" rx="8" fill="#1f8a5b" stroke="#1f8a5b"/>
    <rect x="24" y="112" width="110" height="46" rx="8" fill="#1f8a5b" stroke="#1f8a5b"/>
    <rect x="24" y="168" width="110" height="46" rx="8" fill="#1d5fae" stroke="#1d5fae"/>
    <rect x="24" y="224" width="110" height="46" rx="8" fill="#d9442b" stroke="#d9442b"/>
    <rect x="24" y="280" width="110" height="46" rx="8" fill="#d9442b" stroke="#d9442b"/>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="146" y="56" width="470" height="46" rx="8"/><rect x="146" y="112" width="470" height="46" rx="8"/><rect x="146" y="168" width="470" height="46" rx="8"/><rect x="146" y="224" width="470" height="46" rx="8"/><rect x="146" y="280" width="470" height="46" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="79" y="84">Best</text><text x="79" y="140">Good</text><text x="79" y="196">OK</text><text x="79" y="252">Avoid</text><text x="79" y="308">Never</text>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c">
    <text x="162" y="76">WPA3-Personal</text>
    <text x="162" y="132">WPA2/WPA3 mixed (transition)</text>
    <text x="162" y="188">WPA2-Personal with AES</text>
    <text x="162" y="244">WPA2 with TKIP, or plain WPA</text>
    <text x="162" y="300">WEP, or an open network</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="162" y="94">Strongest. Most newer devices support it.</text>
    <text x="162" y="150">WPA3 for new devices, WPA2 for older ones</text>
    <text x="162" y="206">Fine if WPA3 isn't offered</text>
    <text x="162" y="262">Outdated and much easier to break</text>
    <text x="162" y="318">No real protection</text>
  </g>
  <text x="24" y="358" font-size="13" fill="#566475">Set the same mode on both the 2.4 GHz and 5 GHz networks.</text>
</svg>
