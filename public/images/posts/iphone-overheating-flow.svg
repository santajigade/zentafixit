<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="ipf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">When does your iPhone get hot?</text>
  <g font-size="13" font-weight="700" fill="#566475" text-anchor="middle"><text x="160" y="66">It gets hot</text><text x="480" y="66">Likely cause and first fix</text></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="80" width="260" height="52" rx="8"/>
    <rect x="30" y="148" width="260" height="52" rx="8"/>
    <rect x="30" y="216" width="260" height="52" rx="8"/>
    <rect x="30" y="284" width="260" height="52" rx="8" stroke="#d9442b"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="350" y="80" width="260" height="52" rx="8"/>
    <rect x="350" y="148" width="260" height="52" rx="8"/>
    <rect x="350" y="216" width="260" height="52" rx="8"/>
  </g>
  <rect x="350" y="284" width="260" height="52" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#ipf)">
    <path d="M292 106h56"/><path d="M292 174h56"/><path d="M292 242h56"/><path d="M292 310h56"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="160" y="111">While charging</text>
    <text x="160" y="179">In the sun or a car</text>
    <text x="160" y="247">Sitting idle</text>
    <text x="160" y="315">Bulging or screen lifting</text>
    <text x="480" y="102" font-weight="700">Charging plus heavy use</text><text x="480" y="121" font-size="12" fill="#566475">unplug, take off the case</text>
    <text x="480" y="170" font-weight="700">Outside heat</text><text x="480" y="189" font-size="12" fill="#566475">move to shade, never a fridge</text>
    <text x="480" y="238" font-weight="700">Background app or update</text><text x="480" y="257" font-size="12" fill="#566475">check Settings &gt; Battery</text>
    <text x="480" y="306" font-weight="700" fill="#d9442b">Swollen battery</text><text x="480" y="325" font-size="12" fill="#566475">stop using it, contact Apple</text>
  </g>
  <rect x="30" y="364" width="580" height="48" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="320" y="393" font-size="13" text-anchor="middle" fill="#14202c">Warm while charging or gaming is normal. Too hot to hold is not.</text>
</svg>
