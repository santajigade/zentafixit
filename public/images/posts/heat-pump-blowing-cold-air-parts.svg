<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Main parts of a heat pump system</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="52" width="240" height="248" rx="8"/><rect x="376" y="52" width="240" height="248" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="144" y="78">Outdoor unit</text><text x="496" y="78">Indoor air handler</text>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="40" y="92" width="208" height="38" rx="8"/><rect x="40" y="140" width="208" height="38" rx="8"/><rect x="40" y="236" width="208" height="38" rx="8"/>
    <rect x="392" y="92" width="208" height="38" rx="8"/><rect x="392" y="140" width="208" height="38" rx="8"/><rect x="392" y="236" width="208" height="38" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="40" y="188" width="208" height="38" rx="8"/><rect x="392" y="188" width="208" height="38" rx="8"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M264 150H376" stroke="#d9442b"/><path d="M264 180H376" stroke="#1d5fae"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="144" y="116">Fan and outdoor coil</text>
    <text x="144" y="164">Compressor</text>
    <text x="144" y="212" font-weight="700">Reversing valve</text>
    <text x="144" y="260">Defrost control</text>
    <text x="496" y="116">Blower</text>
    <text x="496" y="164">Indoor coil</text>
    <text x="496" y="212" font-weight="700">Aux heat strips</text>
    <text x="496" y="260">Air filter</text>
    <text x="320" y="206" font-size="12" fill="#566475">refrigerant</text>
    <text x="320" y="222" font-size="12" fill="#566475">lines</text>
  </g>
  <rect x="24" y="318" width="592" height="88" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="344">Heat mode: the outdoor coil gathers heat, the indoor coil releases it.</text>
    <text x="40" y="368">Defrost: the reversing valve briefly flips to melt frost outside.</text>
    <text x="40" y="392" fill="#566475">Valve, compressor and refrigerant faults are jobs for a technician.</text>
  </g>
</svg>
