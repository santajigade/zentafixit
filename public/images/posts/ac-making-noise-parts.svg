    <text x="340" y="316" font-size="12" fill="#566475">Steady hum is normal, banging is not</text>
    <text x="340" y="362" font-size="14" font-weight="700">Refrigerant lines</text>
    <text x="340" y="380" font-size="12" fill="#566475">Hiss or bubbling (pro only)</text>
