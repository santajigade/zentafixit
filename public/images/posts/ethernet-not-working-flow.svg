<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <defs><marker id="enwf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Start with the port lights</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="180" y="54" width="280" height="44" rx="8"/>
    <rect x="180" y="124" width="280" height="44" rx="8"/>
