    <text x="160" y="390" font-weight="700">Try fixes 1 to 4</text><text x="160" y="406" font-size="12">cable, router port, adapter</text>
    <text x="480" y="390" font-weight="700">Try fixes 4 to 6</text><text x="480" y="406" font-size="12">adapter, driver, IP settings</text>
