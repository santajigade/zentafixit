  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Plug in, wait 10 seconds</text>
    <text x="320" y="151">2. Check the lights on both ends</text>
    <text x="320" y="233" font-weight="700">Link light on?</text>
    <text x="176" y="220" font-size="12" fill="#566475">no</text><text x="466" y="220" font-size="12" fill="#566475">yes</text>
    <text x="160" y="324">Cable, port or adapter</text><text x="160" y="342">is the problem</text>
