<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="hpnhb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why heat pumps fall behind in the cold</text>
  <path d="M100 280L327 200L100 110z" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#hpnhb)">
    <path d="M80 340V64"/><path d="M80 340H604"/>
  </g>
  <path d="M100 280L580 110" fill="none" stroke="#1d5fae" stroke-width="3"/>
  <path d="M100 110L580 300" fill="none" stroke="#d9442b" stroke-width="3"/>
  <path d="M327 200V340" fill="none" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="327" cy="200" r="6" fill="#0f2240"/>
  <text x="56" y="210" font-size="13" fill="#566475" text-anchor="middle" transform="rotate(-90 56 210)">Heat (more is higher)</text>
  <g font-size="14" fill="#14202c">
    <text x="596" y="98" text-anchor="end" font-weight="700" fill="#1d5fae">Heat pump output</text>
    <text x="596" y="322" text-anchor="end" font-weight="700" fill="#d9442b">Home's heat loss</text>
    <text x="176" y="194" text-anchor="middle" font-weight="700">Aux heat fills</text>
    <text x="176" y="212" text-anchor="middle" font-weight="700">this gap</text>
    <text x="327" y="360" text-anchor="middle" font-weight="700">Balance point</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="480" y="198" text-anchor="middle">Heat pump alone</text>
    <text x="480" y="214" text-anchor="middle">keeps up</text>
    <text x="84" y="360">Colder outside</text>
    <text x="600" y="360" text-anchor="end">Warmer outside</text>
    <text x="24" y="388" font-size="12">Not to scale. The balance point is different for every home and heat pump.</text>
  </g>
</svg>
