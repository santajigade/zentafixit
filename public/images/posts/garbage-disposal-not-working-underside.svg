  <rect x="390" y="190" width="36" height="18" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M262 186H378" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
