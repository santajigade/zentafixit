  <g font-size="14" fill="#14202c">
    <text x="24" y="70" font-weight="700">Sink flange</text><text x="24" y="88" font-size="13" fill="#566475">seal leaks show up here</text>
    <text x="24" y="150" font-weight="700">Dishwasher inlet</text><text x="24" y="168" font-size="13" fill="#566475">knockout plug inside</text>
