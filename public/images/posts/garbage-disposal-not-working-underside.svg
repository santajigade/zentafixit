  <g font-size="13" fill="#566475" text-anchor="middle">
    <text x="320" y="150">Grinding</text><text x="320" y="166">chamber</text>
    <text x="320" y="262">Motor</text>
  </g>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M180 66H285"/><path d="M372 96H444"/><path d="M180 146H214"/><path d="M426 199H444"/><path d="M382 315H444"/><path d="M180 355H302L316 338"/>
