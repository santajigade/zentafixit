<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where washer smells usually hide</text>
  <!-- washer body -->
  <rect x="220" y="56" width="200" height="340" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <path d="M220 112H420" stroke="#0f2240" stroke-width="2"/>
  <!-- detergent drawer -->
  <rect x="234" y="70" width="74" height="28" rx="5" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <circle cx="392" cy="84" r="10" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <!-- door: gasket ring and glass -->
  <circle cx="320" cy="230" r="82" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <circle cx="320" cy="230" r="68" fill="none" stroke="#ffd23f" stroke-opacity=".8" stroke-width="12"/>
  <circle cx="320" cy="230" r="58" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M290 250q30 14 60 0" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <!-- bottom access panel -->
  <rect x="372" y="352" width="36" height="28" rx="5" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <circle cx="390" cy="366" r="7" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M234 84H190"/>
    <path d="M252 230H190"/>
    <path d="M360 186L450 150"/>
    <path d="M408 366H450"/>
    <path d="M262 288L190 322"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="80" font-weight="700">Detergent drawer</text>
    <text x="24" y="98" font-size="12" fill="#566475">Pull out, scrub, let dry</text>
    <text x="24" y="226" font-weight="700">Door gasket</text>
    <text x="24" y="244" font-size="12" fill="#566475">Wipe inside the folds</text>
    <text x="24" y="260" font-size="12" fill="#566475">Check for socks and hair</text>
    <text x="24" y="326" font-weight="700">Door left ajar</text>
    <text x="24" y="344" font-size="12" fill="#566475">Lets the drum dry out</text>
    <text x="456" y="146" font-weight="700">Drum and tub</text>
    <text x="456" y="164" font-size="12" fill="#566475">Run a cleaning cycle</text>
    <text x="456" y="180" font-size="12" fill="#566475">as your manual says</text>
    <text x="456" y="362" font-weight="700">Drain pump filter</text>
    <text x="456" y="380" font-size="12" fill="#566475">Behind bottom panel</text>
    <text x="456" y="396" font-size="12" fill="#566475">on most front loaders</text>
  </g>
  <text x="24" y="424" font-size="12" fill="#566475">Highlighted parts trap water, lint and detergent residue.</text>
</svg>
