<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="shs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Setting up a space heater safely</text>
  <rect x="24" y="56" width="276" height="12" fill="#0f2240"/>
  <text x="96" y="86" font-size="12" fill="#566475">wall outlet</text>
  <rect x="60" y="68" width="26" height="16" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="170" cy="200" r="100" fill="#dfe9f7" fill-opacity=".6" stroke="#1d5fae" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M73 84C73 150 100 200 130 200" fill="none" stroke="#14202c" stroke-width="2.5"/>
  <rect x="130" y="176" width="80" height="48" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#d9442b" stroke-width="2"><path d="M146 186v28M158 186v28M170 186v28M182 186v28M194 186v28"/></g>
  <path d="M212 200h56" fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#shs)"/>
  <text x="240" y="192" font-size="13" font-weight="700" fill="#0f2240" text-anchor="middle">3 ft</text>
  <text x="170" y="244" font-size="12" fill="#566475" text-anchor="middle">heater</text>
  <text x="24" y="334" font-size="14" font-weight="700" fill="#14202c">Keep a 3 foot clear zone</text>
  <text x="24" y="354" font-size="13" fill="#566475">Curtains, bedding, furniture, paper</text>
  <text x="24" y="372" font-size="13" fill="#566475">and clothes stay out of the circle.</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="324" y="56" width="292" height="56" rx="8"/>
    <rect x="324" y="122" width="292" height="56" rx="8"/>
    <rect x="324" y="188" width="292" height="56" rx="8"/>
    <rect x="324" y="254" width="292" height="56" rx="8"/>
  </g>
  <rect x="324" y="320" width="292" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#1f8a5b"><circle cx="344" cy="78" r="6"/><circle cx="344" cy="144" r="6"/><circle cx="344" cy="210" r="6"/><circle cx="344" cy="276" r="6"/></g>
  <circle cx="344" cy="342" r="6" fill="#d9442b"/>
  <g font-size="14" fill="#14202c">
    <text x="360" y="83" font-weight="700">Wall outlet only</text><text x="360" y="102" font-size="12" fill="#566475">no extension cord or power strip</text>
    <text x="360" y="149" font-weight="700">Tip-over shutoff</text><text x="360" y="168" font-size="12" fill="#566475">turns off if knocked over</text>
    <text x="360" y="215" font-weight="700">Overheat protection</text><text x="360" y="234" font-size="12" fill="#566475">shuts off if it gets too hot</text>
    <text x="360" y="281" font-weight="700">Safety listing mark</text><text x="360" y="300" font-size="12" fill="#566475">such as UL, ETL or CSA</text>
    <text x="360" y="347" font-weight="700">Off when you leave or sleep</text><text x="360" y="366" font-size="12" fill="#566475">unless the manual says otherwise</text>
  </g>
</svg>
