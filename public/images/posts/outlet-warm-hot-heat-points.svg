<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a warm outlet gets hot</text>
  <!-- yoke -->
  <rect x="304" y="56" width="32" height="316" rx="6" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <!-- body -->
  <rect x="255" y="96" width="130" height="236" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- contacts -->
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="280" y="120" width="18" height="40" rx="3"/><rect x="342" y="120" width="18" height="40" rx="3"/><rect x="280" y="248" width="18" height="40" rx="3"/><rect x="342" y="248" width="18" height="40" rx="3"/></g>
  <!-- backstab holes -->
  <g fill="#0f2240"><rect x="282" y="304" width="10" height="10" rx="2"/><rect x="348" y="304" width="10" height="10" rx="2"/></g>
  <!-- screws -->
  <g stroke="#0f2240" stroke-width="2"><circle cx="255" cy="160" r="11" fill="#ffd23f"/><circle cx="255" cy="250" r="11" fill="#ffd23f"/><circle cx="385" cy="160" r="11" fill="#d5dee8"/><circle cx="385" cy="250" r="11" fill="#d5dee8"/></g>
  <!-- wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round"><path d="M244 160h-20v218" stroke="#14202c"/><path d="M244 250h-8v128" stroke="#14202c"/><path d="M396 160h20v218" stroke="#566475"/><path d="M396 250h8v128" stroke="#566475"/></g>
  <!-- heat marks -->
  <g fill="none" stroke="#d9442b" stroke-width="2" stroke-linecap="round"><path d="M248 136c-6-6 6-10 0-16M262 136c-6-6 6-10 0-16"/></g>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M176 132L242 154"/><path d="M168 296H220"/><path d="M360 140H452"/><path d="M358 309H452"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="122" font-weight="700">Loose terminal screw</text><text x="24" y="140" font-size="13" fill="#566475">Resistance makes heat</text>
    <text x="24" y="292" font-weight="700">Pass-through wiring</text><text x="24" y="310" font-size="13" fill="#566475">Feeds other outlets too</text>
    <text x="460" y="134" font-weight="700">Worn contacts</text><text x="460" y="152" font-size="13" fill="#566475">Plugs fit loosely</text>
    <text x="460" y="303" font-weight="700">Backstab holes</text><text x="460" y="321" font-size="13" fill="#566475">Small springs grip</text><text x="460" y="337" font-size="13" fill="#566475">the wire</text>
  </g>
  <text x="24" y="404" font-size="12" fill="#566475">Shown out of the box for clarity. Never open a live outlet box.</text>
</svg>
