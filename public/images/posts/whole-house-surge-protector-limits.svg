<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What a surge protector can and can't do</text>
  <rect x="24" y="52" width="288" height="36" rx="8" fill="#1f8a5b"/>
  <rect x="328" y="52" width="288" height="36" rx="8" fill="#d9442b"/>
  <g font-size="14" font-weight="700" fill="#fff"><text x="40" y="75">Helps with</text><text x="344" y="75">Does not help with</text></g>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="24" y="104" width="288" height="40" rx="8"/><rect x="24" y="156" width="288" height="40" rx="8"/><rect x="24" y="208" width="288" height="40" rx="8"/><rect x="24" y="260" width="288" height="40" rx="8"/><rect x="24" y="312" width="288" height="40" rx="8"/>
    <rect x="328" y="104" width="288" height="40" rx="8"/><rect x="328" y="156" width="288" height="40" rx="8"/><rect x="328" y="208" width="288" height="40" rx="8"/><rect x="328" y="260" width="288" height="40" rx="8"/><rect x="328" y="312" width="288" height="40" rx="8"/>
  </g>
  <g fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 124l6 6 10-12"/><path d="M38 176l6 6 10-12"/><path d="M38 228l6 6 10-12"/><path d="M38 280l6 6 10-12"/><path d="M38 332l6 6 10-12"/>
  </g>
  <g fill="none" stroke="#d9442b" stroke-width="3" stroke-linecap="round">
    <path d="M342 118l12 12M354 118l-12 12"/><path d="M342 170l12 12M354 170l-12 12"/><path d="M342 222l12 12M354 222l-12 12"/><path d="M342 274l12 12M354 274l-12 12"/><path d="M342 326l12 12M354 326l-12 12"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="64" y="129">Surges from nearby lightning</text>
    <text x="64" y="181">Utility switching surges</text>
    <text x="64" y="233">Motor and compressor surges</text>
    <text x="64" y="285">Hardwired HVAC, appliances</text>
    <text x="64" y="337">Slow wear on electronics</text>
    <text x="368" y="129">Direct lightning strikes</text>
    <text x="368" y="181">Power outages</text>
    <text x="368" y="233">Brownouts and voltage sags</text>
    <text x="368" y="285">Surges on coax, phone, Ethernet</text>
    <text x="368" y="337">Poor or missing grounding</text>
  </g>
  <text x="24" y="380" font-size="12" fill="#566475">Coax, phone and Ethernet lines need their own protection where they enter the house.</text>
</svg>
