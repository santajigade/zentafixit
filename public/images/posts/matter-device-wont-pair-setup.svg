<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="mds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How Matter setup works</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="176" height="64" rx="8"/><rect x="232" y="56" width="176" height="64" rx="8"/><rect x="440" y="56" width="176" height="64" rx="8"/>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"><rect x="24" y="170" width="280" height="84" rx="8"/><rect x="336" y="170" width="280" height="84" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#mds)">
    <path d="M202 88h28"/><path d="M410 88h28"/><path d="M320 140H164v28"/><path d="M320 140H476v28"/>
  </g>
  <path d="M320 120v20" stroke="#0f2240" stroke-width="1.8"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="112" y="84" font-weight="700">Your phone</text><text x="112" y="104" font-size="12" fill="#566475">app open, Bluetooth on</text>
    <text x="320" y="84" font-weight="700">Matter device</text><text x="320" y="104" font-size="12" fill="#566475">in pairing mode</text>
    <text x="528" y="84" font-weight="700">Matter controller</text><text x="528" y="104" font-size="12" fill="#566475">speaker, hub or TV box</text>
    <text x="164" y="196" font-weight="700">Wi-Fi device</text><text x="164" y="218" font-size="13">joins your Wi-Fi through the</text><text x="164" y="236" font-size="13">router, often 2.4 GHz only</text>
    <text x="476" y="196" font-weight="700">Thread device</text><text x="476" y="218" font-size="13">joins Thread through a</text><text x="476" y="236" font-size="13">border router nearby</text>
  </g>
  <rect x="24" y="272" width="592" height="130" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="298">1. Your phone scans the setup code and finds the device over Bluetooth.</text>
    <text x="40" y="322">2. The controller takes over and adds the device to your home.</text>
    <text x="40" y="346">3. The device joins Wi-Fi or Thread, then runs through the controller.</text>
    <text x="40" y="380" font-weight="700">Fails at step 1? Bluetooth, range or code. Fails at step 3? Network.</text>
  </g>
</svg>
