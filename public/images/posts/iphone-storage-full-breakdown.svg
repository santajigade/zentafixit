<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Read the storage bar, then fix the biggest part</text>
  <text x="24" y="58" font-size="12" fill="#566475">Example only. See your own sizes in Settings &gt; General &gt; iPhone Storage.</text>
  <rect x="24" y="76" width="592" height="36" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="26" y="78" width="150" height="32" fill="#1d5fae"/>
  <rect x="176" y="78" width="190" height="32" fill="#ffd23f"/>
  <rect x="366" y="78" width="70" height="32" fill="#1f8a5b"/>
  <rect x="436" y="78" width="70" height="32" fill="#566475"/>
  <rect x="506" y="78" width="70" height="32" fill="#d5dee8"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="140" width="592" height="40" rx="8"/>
    <rect x="24" y="190" width="592" height="40" rx="8"/>
    <rect x="24" y="240" width="592" height="40" rx="8"/>
    <rect x="24" y="290" width="592" height="40" rx="8"/>
    <rect x="24" y="340" width="592" height="40" rx="8"/>
  </g>
  <rect x="40" y="152" width="16" height="16" rx="3" fill="#1d5fae"/>
  <rect x="40" y="202" width="16" height="16" rx="3" fill="#ffd23f" stroke="#c9a10a"/>
  <rect x="40" y="252" width="16" height="16" rx="3" fill="#1f8a5b"/>
  <rect x="40" y="302" width="16" height="16" rx="3" fill="#566475"/>
  <rect x="40" y="352" width="16" height="16" rx="3" fill="#d5dee8" stroke="#566475"/>
  <g font-size="14" fill="#14202c">
    <text x="68" y="165" font-weight="700">Apps</text><text x="200" y="165">Offload unused apps, delete in-app downloads</text>
    <text x="68" y="215" font-weight="700">Photos</text><text x="200" y="215">Optimize storage, empty Recently Deleted</text>
    <text x="68" y="265" font-weight="700">Messages</text><text x="200" y="265">Delete large attachments, keep 1 year</text>
    <text x="68" y="315" font-weight="700">iOS</text><text x="200" y="315">Fixed size, can't be reduced</text>
    <text x="68" y="365" font-weight="700">System Data</text><text x="200" y="365">Restart, update iOS, clear Safari</text>
  </g>
  <text x="24" y="406" font-size="12" fill="#566475">Section names and colors on your iPhone may differ from this diagram.</text>
