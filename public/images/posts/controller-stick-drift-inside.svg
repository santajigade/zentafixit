<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside a thumbstick module</text>
  <!-- module housing -->
  <rect x="200" y="150" width="220" height="150" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- stick and cap -->
  <path d="M296 150V90h28v60" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="250" y="66" width="120" height="28" rx="14" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <!-- gimbal -->
  <path d="M250 150a60 40 0 0 0 120 0" fill="none" stroke="#0f2240" stroke-width="2"/>
  <!-- spring -->
  <path d="M300 230l20-8-20-8 20-8-20-8 20-8" fill="none" stroke="#566475" stroke-width="2"/>
  <!-- potentiometers -->
  <rect x="140" y="200" width="60" height="70" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <rect x="420" y="200" width="60" height="70" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <path d="M152 250a18 18 0 0 1 36 0" fill="none" stroke="#14202c" stroke-width="3"/>
  <path d="M432 250a18 18 0 0 1 36 0" fill="none" stroke="#14202c" stroke-width="3"/>
  <path d="M170 250l10-18M450 250l10-18" stroke="#d9442b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dust specks -->
  <g fill="#566475"><circle cx="186" cy="244" r="2.5"/><circle cx="190" cy="236" r="2"/><circle cx="160" cy="238" r="2"/></g>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M370 80H450"/><path d="M296 104H160"/><path d="M140 235H110V320"/><path d="M480 235H510V320"/><path d="M310 300V340"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="458" y="76" font-weight="700">Thumb cap</text><text x="458" y="94" font-size="12" fill="#566475">what you push</text>
    <text x="24" y="96" font-weight="700">Stick and gimbal</text><text x="24" y="114" font-size="12" fill="#566475">turns both sensors</text>
    <text x="24" y="340" font-weight="700">Sensor 1: left/right</text><text x="24" y="358" font-size="12" fill="#566475">wiper slides on a track</text>
    <text x="420" y="340" font-weight="700">Sensor 2: up/down</text><text x="420" y="358" font-size="12" fill="#566475">same design, other axis</text>
    <text x="230" y="360" font-weight="700">Center spring</text><text x="230" y="378" font-size="12" fill="#566475">returns stick to rest</text>
  </g>
  <rect x="24" y="386" width="592" height="26" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <text x="320" y="404" font-size="13" fill="#14202c" text-anchor="middle">A worn track or dust under the wiper reads as movement at rest: that is drift</text>
</svg>
