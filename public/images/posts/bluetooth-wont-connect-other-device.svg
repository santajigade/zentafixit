<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="360" fill="#f3f6fa"/>
  <defs>
    <marker id="btod1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f8a5b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Already connected somewhere else</text>
  <!-- laptop -->
  <rect x="44" y="90" width="150" height="96" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="24" y="186" width="190" height="16" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- earbuds case -->
  <rect x="258" y="112" width="124" height="80" rx="34" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <line x1="262" y1="140" x2="378" y2="140" stroke="#0f2240" stroke-width="2"/>
  <circle cx="320" cy="168" r="5" fill="#1d5fae"/>
  <!-- phone -->
  <rect x="490" y="70" width="80" height="150" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="500" y="84" width="60" height="118" rx="6" fill="#dfe9f7"/>
  <!-- links -->
  <path d="M252 152H200" stroke="#1f8a5b" stroke-width="2.5" fill="none" marker-end="url(#btod1)"/>
  <path d="M390 152h90" stroke="#d9442b" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <g stroke="#d9442b" stroke-width="3" stroke-linecap="round"><path d="M426 140l18 24M444 140l-18 24"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="119" y="232" font-weight="700">Laptop</text>
    <text x="119" y="250" font-size="13" fill="#566475">connected first</text>
    <text x="320" y="232" font-weight="700">Earbuds</text>
    <text x="320" y="250" font-size="13" fill="#566475">one device at a time</text>
    <text x="530" y="246" font-weight="700">Your phone</text>
    <text x="530" y="264" font-size="13" fill="#566475">can't connect</text>
  </g>
  <rect x="24" y="286" width="592" height="54" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="309" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Fix: turn off Bluetooth on the laptop, or disconnect there,</text>
  <text x="320" y="328" font-size="13" fill="#14202c" text-anchor="middle">then pick the earbuds from your phone's Bluetooth list.</text>
</svg>
