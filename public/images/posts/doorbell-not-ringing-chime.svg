<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside a mechanical chime (cover off)</text>
  <rect x="60" y="60" width="360" height="300" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="90" y="84" width="300" height="20" rx="6" fill="#d5dee8" stroke="#566475" stroke-width="2"/>
  <rect x="90" y="120" width="300" height="20" rx="6" fill="#d5dee8" stroke="#566475" stroke-width="2"/>
  <rect x="130" y="170" width="70" height="90" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="280" y="170" width="70" height="90" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="158" y="148" width="14" height="60" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <rect x="308" y="148" width="14" height="60" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><circle cx="150" cy="320" r="9"/><circle cx="240" cy="320" r="9"/><circle cx="330" cy="320" r="9"/></g>
  <g font-size="12" font-weight="700" fill="#14202c" text-anchor="middle"><text x="150" y="348">FRONT</text><text x="240" y="348">TRANS</text><text x="330" y="348">REAR</text></g>
  <g fill="none" stroke="#566475" stroke-width="1.5"><path d="M165 260v51M315 260v51M200 240h40v71M280 240h-40"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.5">
    <path d="M390 94h50"/><path d="M322 178h118"/><path d="M350 230h90"/><path d="M339 320h101"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="448" y="90" font-weight="700">Tone bars</text><text x="448" y="106" font-size="12" fill="#566475">plungers strike these</text>
    <text x="448" y="174" font-weight="700">Plungers</text><text x="448" y="190" font-size="12" fill="#566475">must slide freely</text>
    <text x="448" y="226" font-weight="700">Coils</text><text x="448" y="242" font-size="12" fill="#566475">magnet pushes plunger</text>
    <text x="448" y="316" font-weight="700">Terminals</text><text x="448" y="332" font-size="12" fill="#566475">tighten all three</text>
  </g>
  <text x="24" y="386" font-size="13" fill="#566475">Layouts vary by model. Check the labels printed next to the screws.</text>
