<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="444" fill="#f3f6fa"/>
  <defs><marker id="rncp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where the cooling parts sit (many models)</text>
  <text x="24" y="54" font-size="13" fill="#566475">Side view of the lower cabinet. Layouts vary, so check your manual.</text>
  <rect x="170" y="70" width="270" height="272" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="160" y="70" width="14" height="176" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="171" y="251" width="268" height="90" fill="#dfe9f7"/>
  <path d="M170 250H440" stroke="#0f2240" stroke-width="2"/>
  <text x="182" y="92" font-size="13" fill="#566475">Front</text>
  <text x="428" y="92" font-size="13" fill="#566475" text-anchor="end">Back</text>
  <text x="305" y="170" font-size="13" fill="#566475" text-anchor="middle">Fridge cabinet</text>
  <rect x="158" y="290" width="12" height="50" rx="2" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="1.5"><path d="M160 302h8M160 314h8M160 326h8"/></g>
  <path d="M190 276h64v9h-64v9h64v9h-64v9h64v9h-64" fill="none" stroke="#1d5fae" stroke-width="2.5"/>
  <circle cx="290" cy="300" r="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="3" stroke-linecap="round"><path d="M290 300l0-14M290 300l12 8M290 300l-12 8"/></g>
  <rect x="322" y="268" width="66" height="66" rx="26" fill="#0f2240"/>
  <rect x="386" y="292" width="18" height="26" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><rect x="182" y="342" width="16" height="8" rx="2"/><rect x="412" y="342" width="16" height="8" rx="2"/></g>
  <g fill="none" stroke="#1d5fae" stroke-width="1.8" marker-end="url(#rncp)"><path d="M112 300h42"/></g>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M156 322H112"/><path d="M222 324V374"/><path d="M370 272L452 266"/><path d="M404 305H452"/><path d="M290 320V356H452"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="298" font-size="13" fill="#1d5fae">air in</text>
    <text x="24" y="320" font-weight="700">Kick plate</text><text x="24" y="338" font-size="13" fill="#566475">front grille</text>
    <text x="456" y="262" font-weight="700">Compressor</text><text x="456" y="280" font-size="13" fill="#566475">black dome, hums</text>
    <text x="456" y="302" font-weight="700">Start relay</text><text x="456" y="320" font-size="13" fill="#566475">clips onto compressor</text>
    <text x="456" y="352" font-weight="700">Condenser fan</text><text x="456" y="370" font-size="13" fill="#566475">runs with compressor</text>
    <text x="222" y="392" font-weight="700" text-anchor="middle">Condenser coil</text><text x="222" y="408" font-size="13" fill="#566475" text-anchor="middle">dust builds up here</text>
  </g>
  <text x="24" y="434" font-size="13" fill="#566475">Some models have the coil on the back and no condenser fan.</text>
