<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="tnws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a thermostat call reaches the system</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="60" width="140" height="140" rx="8"/>
    <rect x="300" y="60" width="150" height="140" rx="8"/>
    <rect x="480" y="60" width="136" height="40" rx="8"/>
    <rect x="480" y="110" width="136" height="40" rx="8"/>
    <rect x="480" y="160" width="136" height="40" rx="8"/>
    <rect x="30" y="252" width="108" height="50" rx="8"/>
    <rect x="148" y="252" width="108" height="50" rx="8"/>
    <rect x="266" y="252" width="108" height="50" rx="8"/>
    <rect x="384" y="252" width="108" height="50" rx="8"/>
    <rect x="502" y="252" width="108" height="50" rx="8"/>
  </g>
  <rect x="50" y="84" width="100" height="44" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g stroke-width="3" fill="none">
    <path d="M170 80h130" stroke="#d9442b"/>
    <path d="M170 110h130" stroke="#1d5fae"/>
    <path d="M170 140h130" stroke="#566475"/>
    <path d="M170 165h130" stroke="#1f8a5b"/>
    <path d="M170 190h130" stroke="#0f2240"/>
  </g>
  <g font-size="12" fill="#14202c">
    <text x="180" y="74">R: 24 V power</text>
    <text x="180" y="104">C: common</text>
    <text x="180" y="134">W: heat call</text>
    <text x="180" y="160">Y: cooling call</text>
    <text x="180" y="185">G: fan call</text>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#tnws)">
    <path d="M450 80h28"/><path d="M450 130h28"/><path d="M450 180h28"/>
    <path d="M556 252V226H375v-24"/>
  </g>
  <g stroke="#0f2240" stroke-width="1.8"><path d="M138 277h10M256 277h10M374 277h10M492 277h10"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="100" y="153" font-weight="700">Thermostat</text>
    <text x="100" y="172" font-size="12" fill="#566475">mode, setpoint</text>
    <text x="100" y="188" font-size="12" fill="#566475">and schedule</text>
    <text x="375" y="110" font-weight="700">Control board</text>
    <text x="375" y="134" font-size="12" fill="#566475">in the furnace or</text>
    <text x="375" y="150" font-size="12" fill="#566475">air handler</text>
    <text x="548" y="85">Heat</text>
    <text x="548" y="135">Cooling</text>
    <text x="548" y="185">Blower fan</text>
  </g>
  <text x="24" y="242" font-size="13" fill="#566475">The board can only respond when every switch in this chain is closed:</text>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="84" y="282">Breaker</text>
    <text x="202" y="273">Service</text><text x="202" y="290">switch</text>
    <text x="320" y="273">Door</text><text x="320" y="290">switch</text>
    <text x="438" y="273">Low-voltage</text><text x="438" y="290">fuse</text>
    <text x="556" y="273">Float</text><text x="556" y="290">switch</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="84" y="322">Cause 3</text><text x="202" y="322">Cause 3</text><text x="320" y="322">Cause 4</text><text x="438" y="322">Cause 6</text><text x="556" y="322">Cause 5</text>
  </g>
  <rect x="30" y="344" width="580" height="50" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="366" font-size="13" fill="#14202c" text-anchor="middle" font-weight="700">If any one is open, the thermostat can't start anything,</text>
  <text x="320" y="384" font-size="13" fill="#14202c" text-anchor="middle">even though its screen may still look normal.</text>
</svg>
