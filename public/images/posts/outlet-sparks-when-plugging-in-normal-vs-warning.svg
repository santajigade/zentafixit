<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Normal spark or warning sign?</text>
  <text x="24" y="54" font-size="13" fill="#566475">Look at the spark, then at what happens after it</text>
  <rect x="24" y="70" width="284" height="40" rx="8" fill="#1f8a5b"/>
  <rect x="332" y="70" width="284" height="40" rx="8" fill="#d9442b"/>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="166" y="95">Usually normal</text>
    <text x="474" y="95">Warning sign: stop using it</text>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="122" width="284" height="48" rx="8"/><rect x="24" y="180" width="284" height="48" rx="8"/>
    <rect x="24" y="238" width="284" height="48" rx="8"/><rect x="24" y="296" width="284" height="48" rx="8"/>
    <rect x="332" y="122" width="284" height="48" rx="8"/><rect x="332" y="180" width="284" height="48" rx="8"/>
    <rect x="332" y="238" width="284" height="48" rx="8"/><rect x="332" y="296" width="284" height="48" rx="8"/>
  </g>
  <g fill="#1f8a5b"><circle cx="46" cy="146" r="8"/><circle cx="46" cy="204" r="8"/><circle cx="46" cy="262" r="8"/><circle cx="46" cy="320" r="8"/></g>
  <g fill="#d9442b"><circle cx="354" cy="146" r="8"/><circle cx="354" cy="204" r="8"/><circle cx="354" cy="262" r="8"/><circle cx="354" cy="320" r="8"/></g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M42 146l3 3 5-6M42 204l3 3 5-6M42 262l3 3 5-6M42 320l3 3 5-6"/>
    <path d="M354 141v6M354 199v6M354 257v6M354 315v6"/>
  </g>
  <g fill="#fff"><circle cx="354" cy="151" r="1.4"/><circle cx="354" cy="209" r="1.4"/><circle cx="354" cy="267" r="1.4"/><circle cx="354" cy="325" r="1.4"/></g>
  <g font-size="13" fill="#14202c">
    <text x="64" y="151">Small blue flash, split second</text>
    <text x="64" y="209">Once, as the blades touch</text>
    <text x="64" y="267">Device was on, or is a charger</text>
    <text x="64" y="325">No smell, mark or sound after</text>
    <text x="372" y="151">Large, yellow or orange spark</text>
    <text x="372" y="209">Repeats, pops or crackles</text>
    <text x="372" y="267">Burning smell or scorch marks</text>
    <text x="372" y="325">Buzzing, warmth or loose fit</text>
  </g>
  <rect x="24" y="358" width="592" height="44" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="385" font-size="13" fill="#14202c" text-anchor="middle">Not sure? Treat it as a warning, turn off the breaker and get it checked.</text>
</svg>
