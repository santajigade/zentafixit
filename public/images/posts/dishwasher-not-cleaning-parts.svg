<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="450" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Parts that affect cleaning</text>
  <!-- tub -->
  <rect x="40" y="56" width="260" height="280" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="54" y="70" width="232" height="252" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <!-- upper spray arm -->
  <rect x="120" y="80" width="100" height="7" rx="3.5" fill="#0f2240"/>
  <!-- upper rack with cups -->
  <rect x="66" y="100" width="208" height="56" rx="4" fill="none" stroke="#566475" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><path d="M86 112h28l-4 34h-20z"/><path d="M130 112h28l-4 34h-20z"/><path d="M174 112h28l-4 34h-20z"/><path d="M218 112h28l-4 34h-20z"/></g>
  <!-- middle spray arm -->
  <rect x="110" y="166" width="120" height="7" rx="3.5" fill="#0f2240"/>
  <circle cx="170" cy="169.5" r="5" fill="#0f2240"/>
  <!-- lower rack with plates -->
  <rect x="66" y="186" width="208" height="74" rx="4" fill="none" stroke="#566475" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="84" y="194" width="14" height="60" rx="7"/><rect x="112" y="194" width="14" height="60" rx="7"/><rect x="140" y="194" width="14" height="60" rx="7"/><rect x="168" y="194" width="14" height="60" rx="7"/><rect x="196" y="194" width="14" height="60" rx="7"/><rect x="224" y="194" width="14" height="60" rx="7"/></g>
  <!-- lower spray arm and jets -->
  <g stroke="#1d5fae" stroke-width="2" stroke-dasharray="3 4" fill="none"><path d="M104 272l-8-14M136 272l-4-14M204 272l4-14M236 272l8-14"/></g>
  <rect x="90" y="274" width="160" height="7" rx="3.5" fill="#0f2240"/>
  <circle cx="170" cy="277.5" r="6" fill="#0f2240"/>
  <!-- filter and float -->
  <rect x="150" y="292" width="40" height="22" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <rect x="64" y="298" width="22" height="16" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- door inset -->
  <rect x="40" y="348" width="260" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="70" y="362" width="60" height="40" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M74 368h52" stroke="#0f2240" stroke-width="2"/>
  <circle cx="210" cy="382" r="16" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="170" y="426" font-size="12" fill="#566475" text-anchor="middle">Inside of the door</text>
  <!-- markers -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="240" cy="83" r="11" fill="#d9442b"/><text x="240" y="88">1</text>
    <circle cx="250" cy="169" r="11" fill="#d9442b"/><text x="250" y="174">2</text>
    <circle cx="266" cy="277" r="11" fill="#d9442b"/><text x="266" y="282">3</text>
    <circle cx="210" cy="303" r="11" fill="#d9442b"/><text x="210" y="308">4</text>
    <circle cx="104" cy="306" r="11" fill="#d9442b"/><text x="104" y="311">5</text>
    <circle cx="150" cy="370" r="11" fill="#d9442b"/><text x="150" y="375">6</text>
    <circle cx="244" cy="372" r="11" fill="#d9442b"/><text x="244" y="377">7</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#14202c">
    <text x="330" y="82" font-weight="700">1. Upper spray arm</text><text x="330" y="100" font-size="13" fill="#566475">Cleans the top rack on many models</text>
    <text x="330" y="136" font-weight="700">2. Middle spray arm</text><text x="330" y="154" font-size="13" fill="#566475">Blocked by tall items below it</text>
    <text x="330" y="190" font-weight="700">3. Lower spray arm</text><text x="330" y="208" font-size="13" fill="#566475">Spins freely, holes clear</text>
    <text x="330" y="244" font-weight="700">4. Filter</text><text x="330" y="262" font-size="13" fill="#566475">Traps food, clean it often</text>
    <text x="330" y="298" font-weight="700">5. Float</text><text x="330" y="316" font-size="13" fill="#566475">Must move freely for a full fill</text>
    <text x="330" y="352" font-weight="700">6. Detergent cup</text><text x="330" y="370" font-size="13" fill="#566475">Lid must open, nothing blocking it</text>
    <text x="330" y="406" font-weight="700">7. Rinse aid dispenser</text><text x="330" y="424" font-size="13" fill="#566475">Refill when the indicator shows</text>
  </g>
</svg>
