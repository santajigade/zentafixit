<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="pnppath" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a print job can get stuck</text>
  <text x="24" y="54" font-size="13" fill="#566475">Follow the arrows: each stage has its usual faults</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="74" width="180" height="96" rx="8"/>
    <rect x="230" y="74" width="180" height="96" rx="8"/>
    <rect x="436" y="74" width="180" height="96" rx="8"/>
    <rect x="436" y="220" width="180" height="96" rx="8"/>
    <rect x="230" y="220" width="180" height="96" rx="8"/>
  </g>
  <rect x="24" y="220" width="180" height="96" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pnppath)">
    <path d="M204 122h24"/><path d="M410 122h24"/><path d="M526 170v48"/><path d="M436 268h-24"/><path d="M230 268h-24"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="114" y="104" font-weight="700">1. App</text><text x="114" y="128" font-size="12" fill="#566475">wrong printer picked</text><text x="114" y="146" font-size="12" fill="#566475">blank page in document</text>
    <text x="320" y="104" font-weight="700">2. Print queue</text><text x="320" y="128" font-size="12" fill="#566475">first job stuck</text><text x="320" y="146" font-size="12" fill="#566475">spooler has hung</text>
    <text x="526" y="104" font-weight="700">3. Driver</text><text x="526" y="128" font-size="12" fill="#566475">damaged or outdated</text><text x="526" y="146" font-size="12" fill="#566475">after an OS update</text>
    <text x="526" y="250" font-weight="700">4. Connection</text><text x="526" y="274" font-size="12" fill="#566475">Wi-Fi or USB dropped</text><text x="526" y="292" font-size="12" fill="#566475">printer shows offline</text>
    <text x="320" y="250" font-weight="700">5. Printer</text><text x="320" y="274" font-size="12" fill="#566475">jam or open cover</text><text x="320" y="292" font-size="12" fill="#566475">error on its screen</text>
    <text x="114" y="250" font-weight="700">6. Ink and paper</text><text x="114" y="274" font-size="12" fill="#566475">empty, taped or clogged</text><text x="114" y="292" font-size="12" fill="#566475">paper misfeeds</text>
  </g>
  <rect x="24" y="340" width="592" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="365" font-size="13" fill="#14202c" text-anchor="middle">A test page printed from the printer itself only checks stages 5 and 6</text>
</svg>
