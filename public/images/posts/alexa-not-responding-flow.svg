<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="alx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Say the wake word and watch the light</text>
  <rect x="190" y="54" width="260" height="48" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="320" y="84" font-size="14" fill="#14202c" text-anchor="middle" font-weight="700">What does the light do?</text>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#alx)">
    <path d="M220 102L92 150"/><path d="M290 102L246 150"/><path d="M350 102L394 150"/><path d="M420 102L548 150"/>
  </g>
  <g fill="#fff" stroke-width="2">
    <rect x="24" y="152" width="136" height="74" rx="8" stroke="#d9442b"/>
    <rect x="176" y="152" width="136" height="74" rx="8" stroke="#0f2240"/>
    <rect x="328" y="152" width="136" height="74" rx="8" stroke="#1d5fae"/>
    <rect x="480" y="152" width="136" height="74" rx="8" stroke="#1f8a5b"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="92" y="178" font-weight="700">Red light on</text><text x="92" y="198" font-size="12" fill="#566475">mic is switched</text><text x="92" y="214" font-size="12" fill="#566475">off</text>
    <text x="244" y="178" font-weight="700">No light at all</text><text x="244" y="198" font-size="12" fill="#566475">didn't hear the</text><text x="244" y="214" font-size="12" fill="#566475">wake word</text>
    <text x="396" y="178" font-weight="700">Blue, no answer</text><text x="396" y="198" font-size="12" fill="#566475">heard you, can't</text><text x="396" y="214" font-size="12" fill="#566475">reply out loud</text>
    <text x="548" y="178" font-weight="700">Answers, but</text><text x="548" y="198" font-size="12" fill="#566475">device won't</text><text x="548" y="214" font-size="12" fill="#566475">respond</text>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#alx)">
    <path d="M92 226v26"/><path d="M244 226v26"/><path d="M396 226v26"/><path d="M548 226v26"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="254" width="136" height="92" rx="8"/><rect x="176" y="254" width="136" height="92" rx="8"/><rect x="328" y="254" width="136" height="92" rx="8"/><rect x="480" y="254" width="136" height="92" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="92" y="280">Press the</text><text x="92" y="298">mic button</text><text x="92" y="330" font-weight="700">Fix 1</text>
    <text x="244" y="280">Wake word,</text><text x="244" y="298">distance, noise</text><text x="244" y="330" font-weight="700">Fixes 3 and 4</text>
    <text x="396" y="280">Wi-Fi, volume,</text><text x="396" y="298">Bluetooth</text><text x="396" y="330" font-weight="700">Fixes 2 and 6</text>
    <text x="548" y="280">Alexa app and</text><text x="548" y="298">linked devices</text><text x="548" y="330" font-weight="700">Fix 7</text>
  </g>
  <text x="320" y="378" font-size="12" fill="#566475" text-anchor="middle">Still stuck after these? Restart the Echo (fix 5) before trying a reset.</text>
</svg>
