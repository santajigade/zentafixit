<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside the slot: why worn outlets spark</text>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2"><rect x="24" y="50" width="284" height="290" rx="8"/><rect x="332" y="50" width="284" height="290" rx="8"/></g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="166" y="76">Healthy receptacle</text><text x="474" y="76">Worn receptacle</text></g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"><rect x="110" y="150" width="112" height="120" rx="8"/><rect x="418" y="150" width="112" height="120" rx="8"/></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="126" y="90" width="80" height="40" rx="8"/><rect x="434" y="90" width="80" height="40" rx="8"/></g>
  <g fill="#566475"><rect x="160" y="130" width="12" height="110"/><rect x="468" y="130" width="12" height="110"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 264V220L157 196V162"/><path d="M206 264V220L175 196V162"/>
    <path d="M434 264V220L452 196V162"/><path d="M514 264V220L496 196V162"/>
  </g>
  <path d="M462 168l4 9 8-3-5 8 7 5-9 1 1 9-6-7-6 7 1-9-9-1 7-5-5-8 8 3z" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="166" y="298">Springs press on the blade</text>
    <text x="474" y="298">Springs have lost their grip</text>
  </g>
  <g font-size="13" fill="#566475" text-anchor="middle">
    <text x="166" y="318">Firm contact, no gap</text>
    <text x="474" y="318">Small gaps arc and heat up</text>
  </g>
  <rect x="24" y="352" width="592" height="36" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="375" font-size="13" fill="#14202c" text-anchor="middle">Fix: replace the receptacle. Worn contacts do not tighten back up.</text>
