<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <defs><marker id="pdua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">100% disk usage: find the cause</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <path d="M190 54l150 32-150 32-150-32z"/>
    <path d="M190 144l150 32-150 32-150-32z"/>
    <path d="M190 234l150 32-150 32-150-32z"/>
  </g>
  <rect x="370" y="60" width="250" height="52" rx="8" fill="#fff" stroke="#1f8a5b" stroke-width="2"/>
  <rect x="370" y="150" width="250" height="52" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="370" y="240" width="250" height="52" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="40" y="330" width="300" height="70" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pdua)">
    <path d="M340 86h28"/><path d="M340 176h28"/><path d="M340 266h28"/>
    <path d="M190 118v24"/><path d="M190 208v24"/><path d="M190 298v30"/>
  </g>
  <g font-size="12" fill="#566475">
    <text x="346" y="78">yes</text><text x="346" y="168">yes</text><text x="346" y="258">yes</text>
    <text x="198" y="134">no</text><text x="198" y="224">no</text><text x="198" y="318">no</text>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="190" y="82">Drops after restart</text><text x="190" y="99">and 10 minutes?</text>
    <text x="190" y="172">One app at top</text><text x="190" y="189">of Disk column?</text>
    <text x="190" y="262">Memory nearly</text><text x="190" y="279">full?</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#14202c">
    <text x="495" y="82" font-weight="700" fill="#1f8a5b">Temporary task</text><text x="495" y="100" font-size="13" fill="#566475">Updates or startup (cause 1)</text>
    <text x="495" y="172" font-weight="700" fill="#1d5fae">Deal with that app</text><text x="495" y="190" font-size="13" fill="#566475">Causes 2 to 6</text>
    <text x="495" y="262" font-weight="700">Close apps or add RAM</text><text x="495" y="280" font-size="13" fill="#566475">Cause 7</text>
    <text x="190" y="356" font-weight="700">Check drive health and type</text><text x="190" y="374" font-size="13" fill="#566475">Back up first (cause 8)</text><text x="190" y="390" font-size="13" fill="#566475">HDD? Upgrade to SSD (cause 9)</text>
  </g>
  <text x="24" y="434" font-size="13" fill="#566475">Open Task Manager with Ctrl + Shift + Esc and sort by the Disk column.</text>
</svg>
