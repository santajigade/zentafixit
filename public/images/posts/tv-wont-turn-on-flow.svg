<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <defs><marker id="tvflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Is power reaching the TV?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="54" width="300" height="44" rx="8"/>
    <rect x="170" y="124" width="300" height="44" rx="8"/>
    <path d="M320 192l150 38-150 38-150-38z"/>
    <rect x="30" y="300" width="260" height="56" rx="8"/>
    <rect x="350" y="300" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="368" width="260" height="56" rx="8"/><rect x="350" y="368" width="260" height="56" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#tvflow)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M170 230H160v68"/><path d="M470 230h10v68"/><path d="M160 356v10"/><path d="M480 356v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Plug into a working wall outlet</text>
    <text x="320" y="151">2. Unplug 60 seconds, plug back in</text>
    <text x="320" y="226" font-weight="700">Standby light</text><text x="320" y="243" font-weight="700">on or blinking?</text>
    <text x="146" y="222" font-size="12" fill="#566475">no</text><text x="496" y="222" font-size="12" fill="#566475">yes</text>
    <text x="160" y="324">No light, no sound:</text><text x="160" y="342">power isn't reaching the TV</text>
    <text x="480" y="324">Light on or blinking:</text><text x="480" y="342">power reaches the TV</text>
    <text x="160" y="392" font-weight="700">Check causes 1 and 3</text><text x="160" y="410" font-size="12">outlet, strip, cord, power cycle</text>
    <text x="480" y="392" font-weight="700">Check causes 2, 4 to 8</text><text x="480" y="410" font-size="12">remote, button, screen, settings</text>
  </g>
  <text x="24" y="448" font-size="13" fill="#566475">Some TVs keep the light off in standby: check your manual.</text>
</svg>
