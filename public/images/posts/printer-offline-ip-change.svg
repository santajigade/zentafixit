<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs>
    <marker id="pib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker>
    <marker id="pir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
    <marker id="pig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f8a5b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why a changed IP address means offline</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="80" width="160" height="70" rx="8"/>
    <rect x="240" y="80" width="160" height="70" rx="8"/>
    <rect x="450" y="80" width="160" height="70" rx="8"/>
  </g>
  <rect x="240" y="80" width="160" height="70" rx="8" fill="none" stroke="#d9442b" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="110" y="110" font-weight="700">Your PC</text><text x="110" y="130" font-size="12" fill="#566475">sends to old address</text>
    <text x="320" y="110" font-weight="700">Old address</text><text x="320" y="130" font-size="12" fill="#566475">nothing answers here</text>
    <text x="530" y="110" font-weight="700">Printer</text><text x="530" y="130" font-size="12" fill="#566475">now at a new address</text>
  </g>
  <path d="M190 115h46" fill="none" stroke="#d9442b" stroke-width="2" marker-end="url(#pir)"/>
  <text x="320" y="180" font-size="13" fill="#d9442b" text-anchor="middle">Job fails, Windows shows "Offline"</text>
  <path d="M30 210H610" stroke="#d5dee8" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="250" width="160" height="70" rx="8"/>
    <rect x="450" y="250" width="160" height="70" rx="8"/>
  </g>
  <rect x="240" y="250" width="160" height="70" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="110" y="280" font-weight="700">Your PC</text><text x="110" y="300" font-size="12" fill="#566475">uses the reserved IP</text>
    <text x="320" y="280" font-weight="700">Router</text><text x="320" y="300" font-size="12" fill="#566475">same IP every time</text>
    <text x="530" y="280" font-weight="700">Printer</text><text x="530" y="300" font-size="12" fill="#566475">keeps its address</text>
  </g>
  <g fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#pig)"><path d="M190 285h46"/><path d="M400 285h46"/></g>
  <text x="320" y="352" font-size="13" fill="#1f8a5b" text-anchor="middle">Fix: reserve the printer's IP address in your router</text>
  <text x="320" y="374" font-size="12" fill="#566475" text-anchor="middle">Then match the port in Windows to that address</text>
</svg>
