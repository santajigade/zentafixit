<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Rinsing the outdoor unit safely</text>
  <!-- clearance outline -->
  <rect x="160" y="80" width="220" height="270" rx="12" fill="none" stroke="#1f8a5b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- unit -->
  <rect x="190" y="120" width="160" height="210" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="182" y="106" width="176" height="18" rx="5" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="1.5"><path d="M206 140v175M218 140v175M230 140v175M242 140v175M254 140v175M266 140v175M278 140v175M290 140v175"/></g>
  <rect x="306" y="140" width="32" height="60" rx="4" fill="#dfe9f7" stroke="#d9442b" stroke-width="2"/>
  <!-- hose and spray -->
  <path d="M24 300C60 300 70 250 100 240" fill="none" stroke="#1f8a5b" stroke-width="7" stroke-linecap="round"/>
  <rect x="96" y="226" width="34" height="18" rx="4" fill="#0f2240"/>
  <g stroke="#1d5fae" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6">
    <path d="M134 230L184 214"/><path d="M134 235L184 235"/><path d="M134 240L184 256"/>
  </g>
  <!-- disconnect -->
  <rect x="392" y="130" width="28" height="40" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="399" y="138" width="14" height="10" fill="#d9442b"/>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M420 150H436"/><path d="M338 170H436V260"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="444" y="132" font-weight="700">1. Power off first</text>
    <text x="444" y="150" font-size="13" fill="#566475">Disconnect and breaker</text>
    <text x="444" y="196" font-weight="700" fill="#1f8a5b">2. Gentle spray only</text>
    <text x="444" y="214" font-size="13" fill="#566475">Straight at the fins</text>
    <text x="444" y="272" font-weight="700">3. Keep panel dry</text>
    <text x="444" y="290" font-size="13" fill="#566475">Don't spray the wiring</text>
    <text x="444" y="336" font-weight="700" fill="#d9442b">No pressure washer</text>
    <text x="444" y="354" font-size="13" fill="#566475">It flattens the fins</text>
  </g>
  <text x="24" y="282" font-size="12" fill="#566475">Garden hose</text>
  <text x="160" y="374" font-size="13" fill="#1f8a5b" font-weight="700">Open space on all sides</text>
  <text x="160" y="390" font-size="12" fill="#566475">Your manual may list the clearance</text>
</svg>
