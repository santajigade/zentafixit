<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Typical change interval by filter depth</text>
  <g stroke="#d5dee8" stroke-width="1">
    <path d="M170 60V300M275 60V300M380 60V300M485 60V300M590 60V300"/>
  </g>
  <path d="M170 300H590" stroke="#566475" stroke-width="1.5"/>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="170" y="318">0</text><text x="275" y="318">3</text><text x="380" y="318">6</text><text x="485" y="318">9</text><text x="590" y="318">12</text>
    <text x="380" y="336">months</text>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1">
    <rect x="170" y="74" width="105" height="24" rx="4"/>
    <rect x="170" y="134" width="105" height="24" rx="4"/>
    <rect x="170" y="194" width="210" height="24" rx="4"/>
    <rect x="170" y="254" width="420" height="24" rx="4"/>
  </g>
  <g fill="#1d5fae">
    <rect x="205" y="74" width="70" height="24" rx="4"/>
    <rect x="240" y="134" width="35" height="24" rx="4"/>
    <rect x="370" y="194" width="10" height="24" rx="3"/>
    <rect x="380" y="254" width="210" height="24" rx="4"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="84" font-weight="700">1-inch</text><text x="24" y="101" font-size="12" fill="#566475">1 to 3 months</text>
    <text x="24" y="144" font-weight="700">2-inch</text><text x="24" y="161" font-size="12" fill="#566475">2 to 3 months</text>
    <text x="24" y="204" font-weight="700">4-inch</text><text x="24" y="221" font-size="12" fill="#566475">about 6 months</text>
    <text x="24" y="264" font-weight="700">5-inch media</text><text x="24" y="281" font-size="12" fill="#566475">6 to 12 months</text>
  </g>
  <rect x="24" y="350" width="592" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="40" y="368" font-size="13" font-weight="700" fill="#14202c">Check monthly. Change sooner with pets, allergies or dust.</text>
  <text x="40" y="384" font-size="12" fill="#566475">Typical ranges only: the interval on your filter's label comes first.</text>
</svg>
