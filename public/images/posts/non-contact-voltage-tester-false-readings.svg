<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="370" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">When a non-contact tester gets it wrong</text>
  <rect x="24" y="52" width="286" height="244" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <rect x="330" y="52" width="286" height="244" rx="8" fill="#fff" stroke="#1d5fae" stroke-width="2"/>
  <text x="40" y="78" font-size="14" font-weight="700" fill="#d9442b">Silent, but still live</text>
  <text x="40" y="96" font-size="12" fill="#566475">false negative: the dangerous one</text>
  <text x="346" y="78" font-size="14" font-weight="700" fill="#1d5fae">Beeps, but it's dead</text>
  <text x="346" y="96" font-size="12" fill="#566475">false positive: less dangerous</text>
  <g stroke="#d5dee8" stroke-width="1"><path d="M40 108h254"/><path d="M346 108h254"/></g>
  <g font-size="13" fill="#14202c">
    <text x="40" y="134">Metal-clad cable or conduit</text><text x="40" y="160">Metal box or shielded cord</text><text x="40" y="186">Low or dying battery</text><text x="40" y="212">Your body insulated from ground</text><text x="40" y="238">Tip not close to the hot wire</text><text x="40" y="264">DC circuits (batteries, solar)</text>
    <text x="346" y="134">Induced (ghost) voltage</text><text x="346" y="160">Live wire nearby in the same box</text><text x="346" y="186">Another circuit in the wall</text><text x="346" y="212">Static charge</text><text x="346" y="238">Sensitivity set high</text>
  </g>
  <rect x="24" y="310" width="592" height="44" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="337" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Before you touch: confirm with a contact tester or multimeter</text>
</svg>
