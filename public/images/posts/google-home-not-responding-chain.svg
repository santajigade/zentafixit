<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="gc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">The path every voice request takes</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="66" width="160" height="80" rx="8"/><rect x="240" y="66" width="160" height="80" rx="8"/><rect x="450" y="66" width="160" height="80" rx="8"/>
    <rect x="30" y="226" width="160" height="80" rx="8"/><rect x="240" y="226" width="160" height="80" rx="8"/><rect x="450" y="226" width="160" height="80" rx="8"/>
  </g>
  <rect x="30" y="226" width="160" height="80" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#1d5fae" stroke-width="2.5" marker-end="url(#gc)">
    <path d="M190 106h48"/><path d="M400 106h48"/><path d="M530 146v78"/><path d="M450 266h-48"/><path d="M240 266h-48"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="110" y="100" font-weight="700">Your voice</text><text x="110" y="122" font-size="13" fill="#566475">clear, little noise</text><text x="110" y="138" font-size="13" fill="#566475">fix 4</text>
    <text x="320" y="100" font-weight="700">Speaker mic</text><text x="320" y="122" font-size="13" fill="#566475">mic on, wake word</text><text x="320" y="138" font-size="13" fill="#566475">fixes 1 and 3</text>
    <text x="530" y="100" font-weight="700">Wi-Fi router</text><text x="530" y="122" font-size="13" fill="#566475">range and password</text><text x="530" y="138" font-size="13" fill="#566475">fix 2</text>
    <text x="530" y="260" font-weight="700">Internet</text><text x="530" y="282" font-size="13" fill="#566475">test on your phone</text><text x="530" y="298" font-size="13" fill="#566475">fix 2</text>
    <text x="320" y="260" font-weight="700">Google account</text><text x="320" y="282" font-size="13" fill="#566475">Downtime, account</text><text x="320" y="298" font-size="13" fill="#566475">fix 7</text>
    <text x="110" y="260" font-weight="700">Spoken answer</text><text x="110" y="282" font-size="13" fill="#566475">volume, output</text><text x="110" y="298" font-size="13" fill="#566475">fix 6</text>
  </g>
  <text x="24" y="350" font-size="13" fill="#566475">If every speaker in the house stopped at once, check the internet first.</text>
  <text x="24" y="370" font-size="13" fill="#566475">If only one stopped, start with its mic switch and a restart (fix 5).</text>
</svg>
