<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Your furnace checklist, step by step</text>
  <path d="M24 320H616" stroke="#566475" stroke-width="2"/>
  <path d="M450 56V320" stroke="#d5dee8" stroke-width="6"/>
  <text x="230" y="54" font-size="12" fill="#566475" text-anchor="middle">INDOORS</text>
  <text x="540" y="54" font-size="12" fill="#566475" text-anchor="middle">OUTDOORS</text>
  <!-- clearance -->
  <rect x="140" y="62" width="200" height="252" rx="10" fill="none" stroke="#1f8a5b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- supply duct and register -->
  <path d="M190 88H70" stroke="#0f2240" stroke-width="16"/>
  <path d="M190 88H70" stroke="#fff" stroke-width="12"/>
  <rect x="44" y="76" width="30" height="24" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="1.5"><path d="M50 82h18M50 88h18M50 94h18"/></g>
  <!-- plenum -->
  <rect x="186" y="72" width="100" height="36" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- furnace cabinet -->
  <rect x="176" y="108" width="120" height="200" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M176 200H296" stroke="#0f2240" stroke-width="2"/>
  <!-- sight window with flame -->
  <rect x="216" y="140" width="40" height="30" rx="4" fill="#0f2240"/>
  <path d="M236 166c-10-6-8-16 0-22 1 7 9 10 6 17-1 3-3 4-6 5z" fill="#1d5fae"/>
  <!-- blower -->
  <circle cx="236" cy="262" r="24" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <circle cx="236" cy="262" r="5" fill="#1d5fae"/>
  <!-- filter slot -->
  <rect x="164" y="220" width="12" height="80" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- PVC intake and exhaust -->
  <path d="M296 124H560" stroke="#0f2240" stroke-width="12"/>
  <path d="M296 124H560" stroke="#fff" stroke-width="8"/>
  <path d="M296 150H520V176" fill="none" stroke="#0f2240" stroke-width="12"/>
  <path d="M296 150H520V176" fill="none" stroke="#fff" stroke-width="8"/>
  <g fill="#1f8a5b"><ellipse cx="572" cy="132" rx="9" ry="5"/><ellipse cx="528" cy="188" rx="8" ry="4"/></g>
  <!-- condensate drain -->
  <path d="M296 280H360V316" fill="none" stroke="#566475" stroke-width="5"/>
  <rect x="348" y="314" width="26" height="6" fill="#566475"/>
  <!-- thermostat -->
  <rect x="62" y="150" width="32" height="42" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="78" cy="171" r="9" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <!-- CO alarm -->
  <circle cx="390" cy="84" r="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="390" cy="84" r="4" fill="#d9442b"/>
  <!-- markers -->
  <g fill="#0f2240"><circle cx="146" cy="244" r="12"/><circle cx="420" cy="84" r="12"/><circle cx="340" cy="62" r="12"/><circle cx="58" cy="122" r="12"/><circle cx="596" cy="124" r="12"/><circle cx="392" cy="280" r="12"/><circle cx="276" cy="155" r="12"/><circle cx="78" cy="214" r="12"/><circle cx="236" cy="224" r="12"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="146" y="249">1</text><text x="420" y="89">2</text><text x="340" y="67">3</text><text x="58" y="127">4</text><text x="596" y="129">5</text>
    <text x="392" y="285">6</text><text x="276" y="160">7</text><text x="78" y="219">8</text><text x="236" y="229">9</text>
  </g>
  <!-- legend -->
  <g fill="#0f2240"><circle cx="34" cy="352" r="9"/><circle cx="244" cy="352" r="9"/><circle cx="454" cy="352" r="9"/><circle cx="34" cy="382" r="9"/><circle cx="244" cy="382" r="9"/><circle cx="454" cy="382" r="9"/><circle cx="34" cy="412" r="9"/><circle cx="244" cy="412" r="9"/><circle cx="454" cy="412" r="9"/></g>
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="34" y="356">1</text><text x="244" y="356">2</text><text x="454" y="356">3</text>
    <text x="34" y="386">4</text><text x="244" y="386">5</text><text x="454" y="386">6</text>
    <text x="34" y="416">7</text><text x="244" y="416">8</text><text x="454" y="416">9</text>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="50" y="357">Filter and pad</text><text x="260" y="357">CO and smoke alarms</text><text x="470" y="357">Clear space</text>
    <text x="50" y="387">Vents open</text><text x="260" y="387">Outdoor pipes</text><text x="470" y="387">Condensate drain</text>
    <text x="50" y="417">Flue and flame</text><text x="260" y="417">Test-run the heat</text><text x="470" y="417">Pro tune-up</text>
  </g>
</svg>
