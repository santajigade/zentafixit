<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Frozen AC: who fixes what</text>
  <rect x="20" y="56" width="190" height="40" rx="8" fill="#1f8a5b"/>
  <rect x="225" y="56" width="190" height="40" rx="8" fill="#1d5fae"/>
  <rect x="430" y="56" width="190" height="40" rx="8" fill="#d9442b"/>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="115" y="81">You can fix</text><text x="320" y="81">Check, maybe a pro</text><text x="525" y="81">Pro only</text>
  </g>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="20" y="108" width="190" height="40" rx="8"/><rect x="20" y="158" width="190" height="40" rx="8"/><rect x="20" y="208" width="190" height="40" rx="8"/><rect x="20" y="258" width="190" height="40" rx="8"/>
    <rect x="225" y="108" width="190" height="40" rx="8"/><rect x="225" y="158" width="190" height="40" rx="8"/>
    <rect x="430" y="108" width="190" height="40" rx="8"/><rect x="430" y="158" width="190" height="40" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="115" y="133">Dirty air filter</text><text x="115" y="183">Closed vents</text><text x="115" y="233">Blocked returns</text><text x="115" y="283">Cool weather runs</text>
    <text x="320" y="133">Dirty indoor coil</text><text x="320" y="183">Weak blower</text>
    <text x="525" y="133">Low refrigerant</text><text x="525" y="183">Flow restriction</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="115" y="322">fix these first,</text><text x="115" y="337">then retest for a day</text>
    <text x="320" y="222">sealed coils and</text><text x="320" y="237">blower motors need</text><text x="320" y="252">a technician</text>
    <text x="525" y="222">leak or blockage:</text><text x="525" y="237">needs an EPA</text><text x="525" y="252">certified technician</text>
  </g>
  <rect x="20" y="352" width="600" height="34" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="374" font-size="13" fill="#14202c" text-anchor="middle">Always thaw the coil fully first, then work from left to right</text>
</svg>
