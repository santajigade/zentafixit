<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="imparts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How water reaches the ice maker</text>
  <g fill="none" stroke="#d5dee8" stroke-width="2"><rect x="12" y="48" width="616" height="130" rx="8"/><rect x="12" y="194" width="616" height="146" rx="8"/></g>
  <g font-size="13" fill="#566475"><text x="26" y="68">Behind or under the fridge</text><text x="26" y="214">Inside the freezer</text></g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="30" y="80" width="170" height="44" rx="8"/><rect x="235" y="80" width="170" height="44" rx="8"/><rect x="440" y="80" width="170" height="44" rx="8"/>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="440" y="226" width="170" height="44" rx="8"/><rect x="235" y="226" width="170" height="44" rx="8"/><rect x="30" y="226" width="170" height="44" rx="8"/>
  </g>
  <g fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#imparts)">
    <path d="M200 102h33"/><path d="M405 102h33"/><path d="M595 124v100"/><path d="M440 248h-33"/><path d="M235 248h-33"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="115" y="107">Shutoff valve</text><text x="320" y="107">Water filter</text><text x="525" y="107">Water inlet valve</text>
    <text x="525" y="253">Fill tube</text><text x="320" y="253">Mold and ejector</text><text x="115" y="253">Ice bin and auger</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="115" y="144">open it fully,</text><text x="115" y="159">check for kinks</text>
    <text x="320" y="144">replace on schedule,</text><text x="320" y="159">seat it fully</text>
    <text x="512" y="144">needs enough</text><text x="512" y="159">pressure</text>
    <text x="525" y="292">can freeze shut</text><text x="525" y="307">near the mold</text>
    <text x="320" y="292">waits for cubes</text><text x="320" y="307">to freeze solid</text>
    <text x="115" y="292">clumped ice can</text><text x="115" y="307">jam the auger</text>
  </g>
  <rect x="30" y="352" width="580" height="34" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="374" font-size="13" fill="#14202c" text-anchor="middle">Shutoff arm on the ice maker: arm down means on, arm up means off</text>
</svg>
