<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Power strip vs surge protector</text>
  <rect x="24" y="52" width="592" height="40" rx="8" fill="#0f2240"/>
  <g font-size="14" font-weight="700" fill="#fff">
    <text x="40" y="77">Feature</text>
    <text x="401" y="77" text-anchor="middle">Power strip</text>
    <text x="545" y="77" text-anchor="middle">Surge protector</text>
  </g>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="24" y="100" width="592" height="36" rx="8"/>
    <rect x="24" y="140" width="592" height="36" rx="8"/>
    <rect x="24" y="180" width="592" height="36" rx="8"/>
    <rect x="24" y="220" width="592" height="36" rx="8"/>
    <rect x="24" y="260" width="592" height="36" rx="8"/>
    <rect x="24" y="300" width="592" height="36" rx="8"/>
    <rect x="24" y="340" width="592" height="36" rx="8"/>
  </g>
  <rect x="478" y="180" width="134" height="36" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="14" fill="#14202c">
    <text x="40" y="123">Turns one outlet into several</text>
    <text x="40" y="163">Overload breaker or switch</text>
    <text x="40" y="203" font-weight="700">Absorbs voltage spikes</text>
    <text x="40" y="243">UL listing on the label</text>
    <text x="40" y="283">Joule rating and VPR listed</text>
    <text x="40" y="323">Protected indicator light</text>
    <text x="40" y="363">Wears out as it absorbs surges</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="401" y="123" fill="#1f8a5b">Yes</text><text x="545" y="123" fill="#1f8a5b">Yes</text>
    <text x="401" y="163" fill="#566475">Usually</text><text x="545" y="163" fill="#566475">Usually</text>
    <text x="401" y="203" fill="#d9442b">No</text><text x="545" y="203" fill="#1f8a5b">Yes</text>
    <text x="401" y="243" fill="#566475">Often UL 1363</text><text x="545" y="243" fill="#1f8a5b">UL 1449</text>
    <text x="401" y="283" fill="#d9442b">No</text><text x="545" y="283" fill="#1f8a5b">Yes</text>
    <text x="401" y="323" fill="#d9442b">No</text><text x="545" y="323" fill="#1f8a5b">Yes</text>
    <text x="401" y="363" fill="#566475">No</text><text x="545" y="363" fill="#566475">Yes</text>
  </g>
  <text x="24" y="404" font-size="12" fill="#566475">Read the label: if it lists no surge ratings, it is a plain power strip.</text>
</svg>
