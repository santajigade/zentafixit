  <rect x="280" y="260" width="80" height="108" rx="4" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/><path d="M280 274H360" stroke="#0f2240" stroke-width="2"/><rect x="292" y="286" width="56" height="40" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="1.5"/><path d="M280 340H360" stroke="#0f2240" stroke-width="2"/><rect x="306" y="348" width="28" height="10" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
