<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Thermostat terminals and typical wire colors</text>
  <g font-size="12" fill="#566475"><text x="24" y="58">Terminal</text><text x="214" y="58">Typical color</text><text x="410" y="58">What it does</text></g>
  <rect x="24" y="68" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="73" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="91" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">R</text>
  <path d="M96 86H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 86H196" stroke="#d9442b" stroke-width="6" stroke-linecap="round"/>
  <text x="214" y="91" font-size="13" fill="#14202c">Red</text><text x="410" y="91" font-size="13" fill="#14202c">24 V power</text>
  <rect x="24" y="112" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="117" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="135" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <path d="M96 130H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 130H196" stroke="#1d5fae" stroke-width="6" stroke-linecap="round"/>
  <text x="214" y="135" font-size="13" fill="#14202c">Often blue, or black</text><text x="410" y="135" font-size="13" fill="#14202c">Common return (C-wire)</text>
  <rect x="24" y="156" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="161" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="179" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">W</text>
  <path d="M96 174H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 174H196" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="214" y="179" font-size="13" fill="#14202c">White</text><text x="410" y="179" font-size="13" fill="#14202c">Calls for heat</text>
  <rect x="24" y="200" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="205" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="223" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Y</text>
  <path d="M96 218H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 218H196" stroke="#ffd23f" stroke-width="6" stroke-linecap="round"/>
  <text x="214" y="223" font-size="13" fill="#14202c">Yellow</text><text x="410" y="223" font-size="13" fill="#14202c">Calls for cooling</text>
  <rect x="24" y="244" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="249" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="267" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">G</text>
  <path d="M96 262H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 262H196" stroke="#1f8a5b" stroke-width="6" stroke-linecap="round"/>
  <text x="214" y="267" font-size="13" fill="#14202c">Green</text><text x="410" y="267" font-size="13" fill="#14202c">Runs the indoor fan</text>
  <rect x="24" y="288" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="293" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="311" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">O/B</text>
  <path d="M96 306H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 306H196" stroke="#566475" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6"/>
  <text x="214" y="311" font-size="13" fill="#14202c">Often orange or dark blue</text><text x="410" y="311" font-size="13" fill="#14202c">Heat pump reversing valve</text>
  <rect x="24" y="332" width="592" height="36" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="30" y="337" width="52" height="26" rx="6" fill="#0f2240"/><text x="56" y="355" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">W2</text>
  <path d="M96 350H196" stroke="#0f2240" stroke-width="10" stroke-linecap="round"/><path d="M96 350H196" stroke="#566475" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6"/>
  <text x="214" y="355" font-size="13" fill="#14202c">No standard color</text><text x="410" y="355" font-size="13" fill="#14202c">2nd stage or aux heat</text>
  <rect x="24" y="384" width="592" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="409" font-size="13" fill="#14202c" text-anchor="middle">Colors vary from house to house. Label wires by terminal letter.</text>
</svg>
