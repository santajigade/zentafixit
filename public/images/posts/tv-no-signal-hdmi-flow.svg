<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="470" fill="#f3f6fa"/>
  <defs><marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">No signal? Work down from the top</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="140" y="54" width="360" height="40" rx="8"/>
    <rect x="140" y="116" width="360" height="40" rx="8"/>
    <rect x="140" y="178" width="360" height="40" rx="8"/>
    <rect x="140" y="240" width="360" height="40" rx="8"/>
    <path d="M320 302l110 34-110 34-110-34z"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="380" width="260" height="70" rx="8"/><rect x="350" y="380" width="260" height="70" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#hf)">
    <path d="M320 94v20"/><path d="M320 156v20"/><path d="M320 218v20"/><path d="M320 280v20"/><path d="M210 336H160v42"/><path d="M430 336h50v42"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="79">1. Right input? Device on and awake?</text>
    <text x="320" y="141">2. Reseat or swap the cable and port</text>
    <text x="320" y="203">3. Unplug TV and device for 60 seconds</text>
    <text x="320" y="265">4. Connect the device straight to TV</text>
    <text x="320" y="341" font-weight="700">Picture now?</text>
    <text x="186" y="328" font-size="12" fill="#566475">yes</text><text x="456" y="328" font-size="12" fill="#566475">no</text>
    <text x="160" y="408" font-weight="700">Receiver or soundbar</text><text x="160" y="430" font-size="13">is the weak link (fix 6)</text>
    <text x="480" y="408" font-weight="700">Check resolution, HDCP</text><text x="480" y="430" font-size="13">and cable speed (fixes 7 to 9)</text>
  </g>
</svg>
