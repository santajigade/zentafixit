  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a stream can slow down</text>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="24" y="52" width="170" height="46" rx="8"/><rect x="24" y="112" width="170" height="46" rx="8"/><rect x="24" y="172" width="170" height="46" rx="8"/><rect x="24" y="292" width="170" height="46" rx="8"/>
  </g>
