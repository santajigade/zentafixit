  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="210" y="52" width="406" height="46" rx="8"/><rect x="210" y="112" width="406" height="46" rx="8"/><rect x="210" y="172" width="406" height="46" rx="8"/><rect x="210" y="232" width="406" height="46" rx="8"/><rect x="210" y="292" width="406" height="46" rx="8"/>
