<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">One loose wire, several dead outlets</text>
  <path d="M94 130H116M192 130H214M290 130H312" stroke="#1d5fae" stroke-width="4"/>
  <path d="M388 130H410M486 130H508" stroke="#566475" stroke-width="3" stroke-dasharray="5 5"/>
  <rect x="24" y="70" width="70" height="120" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><rect x="36" y="86" width="46" height="10" rx="2"/><rect x="36" y="104" width="46" height="10" rx="2"/><rect x="36" y="122" width="46" height="10" rx="2"/><rect x="36" y="140" width="46" height="10" rx="2"/><rect x="36" y="158" width="46" height="10" rx="2"/></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="116" y="76" width="76" height="108" rx="8"/>
    <rect x="214" y="76" width="76" height="108" rx="8"/>
    <rect x="410" y="76" width="76" height="108" rx="8"/>
    <rect x="508" y="76" width="76" height="108" rx="8"/>
  </g>
  <rect x="312" y="76" width="76" height="108" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="#f3f6fa" stroke="#0f2240" stroke-width="1.5">
    <rect x="132" y="88" width="44" height="30" rx="6"/><rect x="132" y="146" width="44" height="30" rx="6"/>
    <rect x="230" y="88" width="44" height="30" rx="6"/><rect x="230" y="146" width="44" height="30" rx="6"/>
    <rect x="328" y="88" width="44" height="30" rx="6"/><rect x="328" y="146" width="44" height="30" rx="6"/>
    <rect x="426" y="88" width="44" height="30" rx="6"/><rect x="426" y="146" width="44" height="30" rx="6"/>
    <rect x="524" y="88" width="44" height="30" rx="6"/><rect x="524" y="146" width="44" height="30" rx="6"/>
  </g>
  <g fill="#ffd23f" stroke="#0f2240" stroke-width="1"><rect x="134" y="124" width="18" height="14" rx="2"/><rect x="156" y="124" width="18" height="14" rx="2"/></g>
  <path d="M378 120l20 20M398 120l-20 20" stroke="#d9442b" stroke-width="4" stroke-linecap="round"/>
  <g text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#14202c">
      <text x="59" y="214">Panel</text><text x="154" y="214">GFCI</text><text x="252" y="214">Outlet A</text><text x="350" y="214">Outlet B</text><text x="448" y="214">Outlet C</text><text x="546" y="214">Outlet D</text>
    </g>
    <g font-size="12" font-weight="700">
      <text x="59" y="232" fill="#1f8a5b">on</text><text x="154" y="232" fill="#1f8a5b">works</text><text x="252" y="232" fill="#1f8a5b">works</text><text x="350" y="232" fill="#d9442b">loose wire</text><text x="448" y="232" fill="#d9442b">dead</text><text x="546" y="232" fill="#d9442b">dead</text>
    </g>
  </g>
  <rect x="24" y="256" width="592" height="120" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="44" y="284">Power passes through each outlet to reach the next one.</text>
    <text x="44" y="306">A loose backstab wire at Outlet B cuts power to C and D,</text>
    <text x="44" y="328">while the panel, the GFCI and Outlet A still work.</text>
    <text x="44" y="356" font-weight="700" font-size="14">Check the last working outlet and the first dead one.</text>
  </g>
