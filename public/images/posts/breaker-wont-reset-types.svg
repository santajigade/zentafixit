  <circle cx="417" cy="258" r="9" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g fill="none" stroke="#566475" stroke-width="1.5"><path d="M126 196H166"/><path d="M447 126H478"/><path d="M438 196H478"/><path d="M426 258H478"/></g>
