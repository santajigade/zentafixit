<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="360" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">An example time-of-use day</text>
  <text x="24" y="54" font-size="13" fill="#566475">Hours and prices vary by utility. Check your own rate plan.</text>
  <text x="40" y="96" font-size="13" font-weight="700" fill="#14202c">Electricity price</text>
  <rect x="40" y="106" width="140" height="48" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <rect x="180" y="106" width="233" height="48" fill="#fff" stroke="#566475" stroke-width="1.5"/>
  <rect x="413" y="106" width="117" height="48" fill="#d9442b" fill-opacity=".8" stroke="#d9442b" stroke-width="1.5"/>
  <rect x="530" y="106" width="70" height="48" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="110" y="135" fill="#0f2240" font-weight="700">Off-peak</text>
    <text x="296" y="135" fill="#14202c">Standard</text>
    <text x="471" y="135" fill="#fff" font-weight="700">Peak</text>
    <text x="565" y="135" fill="#0f2240" font-weight="700">Off-peak</text>
  </g>
  <text x="40" y="186" font-size="13" font-weight="700" fill="#14202c">EV charging schedule</text>
  <rect x="40" y="196" width="117" height="34" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="98" y="218" font-size="13" fill="#14202c" text-anchor="middle">Charging</text>
  <g stroke="#566475" stroke-width="1.5"><path d="M40 240v8"/><path d="M180 240v8"/><path d="M320 240v8"/><path d="M460 240v8"/><path d="M600 240v8"/><path d="M40 244h560"/></g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="48" y="266">12 am</text><text x="180" y="266">6 am</text><text x="320" y="266">12 pm</text><text x="460" y="266">6 pm</text><text x="588" y="266">12 am</text>
  </g>
  <rect x="24" y="284" width="592" height="56" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="320" y="308" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Set the car or charger to start after off-peak begins</text>
  <text x="320" y="328" font-size="13" fill="#566475" text-anchor="middle">and check it finishes before off-peak ends</text>
</svg>
