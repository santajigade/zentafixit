<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How the C-wire powers a smart thermostat</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="200" height="262" rx="8"/><rect x="416" y="56" width="200" height="262" rx="8"/>
  </g>
  <rect x="44" y="94" width="160" height="38" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="124" y="80" font-weight="700">HVAC control board</text>
    <text x="516" y="80" font-weight="700">Thermostat base</text>
    <text x="124" y="118" font-size="13">24 V transformer</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M84 132v28h110" stroke="#d9442b"/><path d="M164 132v68h30" stroke="#1d5fae"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M206 160H434" stroke="#d9442b"/><path d="M206 200H434" stroke="#1d5fae"/>
  </g>
  <g fill="none" stroke="#566475" stroke-width="2"><path d="M206 240H434M206 270H434M206 300H434"/></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <circle cx="200" cy="160" r="6"/><circle cx="200" cy="200" r="6"/><circle cx="200" cy="240" r="6"/><circle cx="200" cy="270" r="6"/><circle cx="200" cy="300" r="6"/>
    <circle cx="440" cy="160" r="6"/><circle cx="440" cy="200" r="6"/><circle cx="440" cy="240" r="6"/><circle cx="440" cy="270" r="6"/><circle cx="440" cy="300" r="6"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f2240">
    <text x="456" y="165">R</text><text x="456" y="205">C</text><text x="456" y="245">W</text><text x="456" y="275">Y</text><text x="456" y="305">G</text>
    <text x="178" y="245" text-anchor="end">W</text><text x="178" y="275" text-anchor="end">Y</text><text x="178" y="305" text-anchor="end">G</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="44" y="245">heat</text><text x="44" y="275">cooling</text><text x="44" y="305">fan</text>
    <text x="478" y="165">24 V power in</text><text x="478" y="205">common return</text><text x="478" y="245">calls for heat</text><text x="478" y="275">calls for cooling</text><text x="478" y="305">calls for the fan</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="320" y="152" font-weight="700">R wire</text><text x="320" y="192" font-weight="700">C wire</text>
    <text x="320" y="222" font-size="12" fill="#566475">completes the circuit</text>
  </g>
  <rect x="24" y="330" width="592" height="38" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="354" font-size="13" fill="#14202c" text-anchor="middle">No C-wire? The thermostat borrows power through W, Y or G.</text>
</svg>
