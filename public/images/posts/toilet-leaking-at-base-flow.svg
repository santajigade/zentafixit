  <g font-size="12" fill="#566475">
    <text x="366" y="140">yes</text><text x="366" y="222">yes</text><text x="366" y="304">yes</text><text x="366" y="386">yes</text>
    <text x="218" y="194">no</text><text x="218" y="276">no</text><text x="218" y="358">no</text><text x="218" y="440">no</text>
