    <text x="210" y="235" font-weight="700">Drips at the supply line?</text>
    <text x="210" y="317" font-weight="700">Color under the tank?</text>
    <text x="210" y="399" font-weight="700">Wet base after a flush?</text>
    <text x="210" y="473">Still dry? Check again overnight</text>
