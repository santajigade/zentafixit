    <text x="412" y="226" font-weight="700">Supply line or valve</text><text x="412" y="246">Fix: step 2</text>
    <text x="412" y="308" font-weight="700">Tank bolts or gasket</text><text x="412" y="328">Fix: steps 3 and 6</text>
