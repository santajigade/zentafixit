<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="tlf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Tankless not heating: where to start</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="120" y="54" width="400" height="44" rx="8"/>
    <rect x="120" y="124" width="400" height="44" rx="8"/>
    <rect x="15" y="200" width="190" height="56" rx="8"/>
    <rect x="225" y="200" width="190" height="56" rx="8"/>
    <rect x="435" y="200" width="190" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="15" y="282" width="190" height="60" rx="8"/>
    <rect x="225" y="282" width="190" height="60" rx="8"/>
    <rect x="435" y="282" width="190" height="60" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#tlf)">
    <path d="M320 98v24"/><path d="M290 168L120 198"/><path d="M320 168v30"/><path d="M350 168L520 198"/>
    <path d="M110 256v24"/><path d="M320 256v24"/><path d="M530 256v24"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Open one hot tap fully, wait 30 seconds</text>
    <text x="320" y="151">2. Check the display or status light</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="110" y="224">Display dark or</text><text x="110" y="242">unit seems dead</text>
    <text x="320" y="224">Display on, but</text><text x="320" y="242">it never fires</text>
    <text x="530" y="224">Fires, but water</text><text x="530" y="242">is only warm</text>
    <text x="110" y="307" font-weight="700">Cause 8, or frozen</text><text x="110" y="327" font-size="12">breakers, outlet, freeze</text>
    <text x="320" y="307" font-weight="700">Causes 1, 5, 6, 7</text><text x="320" y="327" font-size="12">flow, gas, vent, error</text>
    <text x="530" y="307" font-weight="700">Causes 2, 3, 4, 9</text><text x="530" y="327" font-size="12">demand, setpoint, scale</text>
  </g>
  <text x="24" y="378" font-size="13" fill="#566475">Error code on screen? Look it up in your manual first.</text>
  <text x="24" y="398" font-size="13" fill="#566475">Smell gas? Leave now and call the gas utility from outside.</text>
</svg>
