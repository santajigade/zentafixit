<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What's safe to check on a microwave</text>
  <!-- cabinet -->
  <rect x="40" y="70" width="330" height="220" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="56" y="86" width="214" height="188" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M262 150v60" stroke="#0f2240" stroke-width="4" stroke-linecap="round"/>
  <rect x="286" y="86" width="68" height="40" rx="5" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="1.5">
    <rect x="290" y="140" width="18" height="14" rx="3"/><rect x="311" y="140" width="18" height="14" rx="3"/><rect x="332" y="140" width="18" height="14" rx="3"/>
    <rect x="290" y="160" width="18" height="14" rx="3"/><rect x="311" y="160" width="18" height="14" rx="3"/><rect x="332" y="160" width="18" height="14" rx="3"/>
    <rect x="290" y="180" width="18" height="14" rx="3"/><rect x="311" y="180" width="18" height="14" rx="3"/><rect x="332" y="180" width="18" height="14" rx="3"/>
  </g>
  <rect x="290" y="210" width="60" height="22" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- hidden high voltage area -->
  <rect x="284" y="244" width="72" height="36" rx="4" fill="none" stroke="#d9442b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M322 248l-10 16h8l-6 12 14-18h-8l6-10z" fill="#d9442b"/>
  <!-- cord and outlet -->
  <path d="M370 260c30 0 30 70 0 90H120" fill="none" stroke="#0f2240" stroke-width="2"/>
  <rect x="84" y="330" width="36" height="42" rx="5" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="3" stroke-linecap="round"><path d="M96 342v8M108 342v8"/></g>
  <!-- legend lists -->
  <rect x="396" y="62" width="224" height="160" rx="8" fill="#fff" stroke="#1f8a5b" stroke-width="2"/>
  <rect x="396" y="236" width="224" height="150" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="410" y="86" font-size="14" font-weight="700" fill="#1f8a5b">Safe to check</text>
    <text x="410" y="110">Display: DEMO or lock</text>
    <text x="410" y="132">Power level and settings</text>
    <text x="410" y="154">Door, latch and seal</text>
    <text x="410" y="176">Outlet and breaker</text>
    <text x="410" y="198">Vents and clearance</text>
    <text x="410" y="260" font-size="14" font-weight="700" fill="#d9442b">Never open the cabinet</text>
    <text x="410" y="284">Magnetron</text>
    <text x="410" y="306">High-voltage capacitor</text>
    <text x="410" y="328">Diode and transformer</text>
    <text x="410" y="350">Door switches and fuse</text>
    <text x="410" y="372" fill="#566475">Can shock even unplugged</text>
  </g>
  <text x="40" y="404" font-size="12" fill="#566475">Red dashed area: high-voltage parts sit behind the panels, inside the cabinet.</text>
</svg>
