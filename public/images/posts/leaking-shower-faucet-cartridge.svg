<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Single-handle shower valve, taken apart</text>
  <!-- handle -->
  <rect x="140" y="66" width="170" height="28" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="166" cy="80" r="16" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="166" cy="80" r="5" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <!-- trim plate -->
  <rect x="110" y="120" width="230" height="44" rx="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="225" cy="142" r="12" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <!-- clip -->
  <path d="M190 188h70v8h-62v12h62v8h-70z" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <!-- cartridge -->
  <rect x="130" y="250" width="26" height="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="156" y="238" width="150" height="44" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="150" y="232" width="162" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#0f2240"><rect x="190" y="236" width="8" height="48" rx="3"/><rect x="250" y="236" width="8" height="48" rx="3"/></g>
  <!-- valve body -->
  <rect x="225" y="300" width="14" height="16" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="225" y="380" width="14" height="22" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="150" y="316" width="164" height="64" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="200" y="330" width="64" height="36" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><circle cx="172" cy="348" r="9"/><circle cx="292" cy="348" r="9"/></g>
  <g stroke="#0f2240" stroke-width="2"><path d="M167 348h10M287 348h10"/></g>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M310 80H372"/><path d="M340 142H372"/><path d="M260 202H372"/><path d="M312 260H372"/><path d="M314 348H372"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="380" y="77" font-weight="700">Handle</text><text x="380" y="93" font-size="12" fill="#566475">held by a screw under a cap</text>
    <text x="380" y="139" font-weight="700">Trim plate</text><text x="380" y="155" font-size="12" fill="#566475">covers the wall opening</text>
    <text x="380" y="199" font-weight="700">Retaining clip or nut</text><text x="380" y="215" font-size="12" fill="#566475">holds the cartridge in</text>
    <text x="380" y="257" font-weight="700">Cartridge</text><text x="380" y="273" font-size="12" fill="#566475">worn seals cause the drip</text>
    <text x="380" y="345" font-weight="700">Valve body in the wall</text><text x="380" y="361" font-size="12" fill="#566475">some have built-in stops</text><text x="380" y="377" font-size="12" fill="#566475">on each side (circles)</text>
  </g>
</svg>
