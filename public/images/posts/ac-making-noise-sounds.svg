<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="480" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What is that AC sound?</text>
  <rect x="20" y="50" width="600" height="34" rx="8" fill="#0f2240"/>
  <g font-size="13" font-weight="700" fill="#fff"><text x="36" y="72">Sound</text><text x="166" y="72">Likely cause</text><text x="547" y="72" text-anchor="middle">What to do</text></g>
  <rect x="20" y="92" width="600" height="40" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="117" font-size="14" font-weight="700" fill="#0f2240">Rattling</text>
  <text x="166" y="117" font-size="13" fill="#14202c">Loose panel, screws or debris</text>
  <rect x="482" y="100" width="130" height="24" rx="8" fill="#1f8a5b"/>
  <text x="547" y="116" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DIY check</text>
  <rect x="20" y="136" width="600" height="40" rx="8" fill="#dfe9f7" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="161" font-size="14" font-weight="700" fill="#0f2240">Buzzing</text>
  <text x="166" y="161" font-size="13" fill="#14202c">Capacitor, contactor or motor</text>
  <rect x="482" y="144" width="130" height="24" rx="8" fill="#d9442b"/>
  <text x="547" y="160" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Pro only</text>
  <rect x="20" y="180" width="600" height="40" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="205" font-size="14" font-weight="700" fill="#0f2240">Clicking</text>
  <text x="166" y="205" font-size="13" fill="#14202c">Thermostat, relay or contactor</text>
  <rect x="482" y="188" width="130" height="24" rx="8" fill="#1d5fae"/>
  <text x="547" y="204" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Check, then pro</text>
  <rect x="20" y="224" width="600" height="40" rx="8" fill="#dfe9f7" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="249" font-size="14" font-weight="700" fill="#0f2240">Squealing</text>
  <text x="166" y="249" font-size="13" fill="#14202c">Fan or blower motor bearings</text>
  <rect x="482" y="232" width="130" height="24" rx="8" fill="#d9442b"/>
  <text x="547" y="248" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Pro only</text>
  <rect x="20" y="268" width="600" height="40" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="293" font-size="14" font-weight="700" fill="#0f2240">Banging</text>
  <text x="166" y="293" font-size="13" fill="#14202c">Loose or broken part</text>
  <rect x="482" y="276" width="130" height="24" rx="8" fill="#d9442b"/>
  <text x="547" y="292" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Stop, call a pro</text>
  <rect x="20" y="312" width="600" height="40" rx="8" fill="#dfe9f7" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="337" font-size="14" font-weight="700" fill="#0f2240">Hissing</text>
  <text x="166" y="337" font-size="13" fill="#14202c">Refrigerant leak or high pressure</text>
  <rect x="482" y="320" width="130" height="24" rx="8" fill="#d9442b"/>
  <text x="547" y="336" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Stop, call a pro</text>
  <rect x="20" y="356" width="600" height="40" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="381" font-size="14" font-weight="700" fill="#0f2240">Gurgling</text>
  <text x="166" y="381" font-size="13" fill="#14202c">Clogged condensate drain</text>
  <rect x="482" y="364" width="130" height="24" rx="8" fill="#1f8a5b"/>
  <text x="547" y="380" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DIY check</text>
  <rect x="20" y="400" width="600" height="40" rx="8" fill="#dfe9f7" stroke="#d5dee8" stroke-width="2"/>
  <text x="36" y="425" font-size="14" font-weight="700" fill="#0f2240">Whistling</text>
  <text x="166" y="425" font-size="13" fill="#14202c">Dirty filter or blocked vents</text>
  <rect x="482" y="408" width="130" height="24" rx="8" fill="#1f8a5b"/>
  <text x="547" y="424" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DIY check</text>
  <text x="24" y="456" font-size="12" fill="#566475">Turn the system off at the thermostat before checking anything.</text>
</svg>
