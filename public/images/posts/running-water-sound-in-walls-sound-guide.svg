<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="436" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What the sound tells you</text>
  <rect x="24" y="52" width="592" height="36" rx="8" fill="#0f2240"/>
  <g font-size="13" font-weight="700" fill="#fff">
    <text x="36" y="75">What you hear</text>
    <text x="260" y="75">Likely source</text>
    <text x="546" y="75" text-anchor="middle">Meter moving?</text>
  </g>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="24" y="92" width="592" height="56" rx="8"/>
    <rect x="24" y="152" width="592" height="56" rx="8"/>
    <rect x="24" y="212" width="592" height="56" rx="8"/>
    <rect x="24" y="272" width="592" height="56" rx="8"/>
    <rect x="24" y="332" width="592" height="56" rx="8"/>
  </g>
  <g stroke="#d5dee8" stroke-width="1.5"><path d="M248 98v44M476 98v44M248 158v44M476 158v44M248 218v44M476 218v44M248 278v44M476 278v44M248 338v44M476 338v44"/></g>
  <g font-size="13" fill="#14202c">
    <text x="36" y="117">Steady hiss or trickle</text><text x="36" y="135">that never stops</text>
    <text x="260" y="117">Running toilet, leak in</text><text x="260" y="135">a wall or under the slab</text>
    <text x="36" y="177">Runs a few minutes,</text><text x="36" y="195">then stops</text>
    <text x="260" y="177">Toilet refilling, water</text><text x="260" y="195">heater, ice maker</text>
    <text x="36" y="237">Long run, often</text><text x="36" y="255">overnight</text>
    <text x="260" y="237">Water softener cycle,</text><text x="260" y="255">irrigation timer</text>
    <text x="36" y="297">Bang or thud when a</text><text x="36" y="315">tap or washer shuts off</text>
    <text x="260" y="297">Water hammer (pressure</text><text x="260" y="315">surge, not a leak)</text>
    <text x="36" y="357">Whoosh or gurgle only</text><text x="36" y="375">when someone uses water</text>
    <text x="260" y="357">Drain or vent pipe, from</text><text x="260" y="375">upstairs or next door</text>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="546" y="125" fill="#d9442b">Yes, nonstop</text>
    <text x="546" y="185" fill="#d9442b">Yes, briefly</text>
    <text x="546" y="245" fill="#d9442b">Yes, on schedule</text>
    <text x="546" y="305" fill="#1f8a5b">No</text>
    <text x="546" y="365" fill="#1f8a5b">No</text>
  </g>
  <text x="24" y="418" font-size="12" fill="#566475">Do the meter test first: if the meter does not move, it is not a supply leak.</text>
</svg>
