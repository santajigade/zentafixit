<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="dnhf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Dryer tumbles but won't heat</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="160" y="54" width="320" height="44" rx="8"/>
    <rect x="160" y="124" width="320" height="44" rx="8"/>
    <path d="M320 192l150 38-150 38-150-38z"/>
    <rect x="30" y="300" width="260" height="56" rx="8"/>
    <rect x="350" y="300" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="368" width="260" height="56" rx="8"/><rect x="350" y="368" width="260" height="56" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#dnhf)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M170 230H160v68"/><path d="M470 230h10v68"/><path d="M160 356v10"/><path d="M480 356v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Timed dry, high heat, 5 min</text>
    <text x="320" y="151">2. Clean lint screen, check vent</text>
    <text x="320" y="235" font-weight="700">Electric or gas?</text>
    <text x="146" y="222" font-size="12" fill="#566475">electric</text><text x="500" y="222" font-size="12" fill="#566475">gas</text>
    <text x="160" y="324">Reset the 240 V breaker</text><text x="160" y="342">fully: OFF, then ON</text>
    <text x="480" y="324">Gas valve open? Watch</text><text x="480" y="342">for the igniter glow</text>
    <text x="160" y="392" font-weight="700">Then test causes 4, 5, 6</text><text x="160" y="410" font-size="12">thermal fuse, element, thermostats</text>
    <text x="480" y="392" font-weight="700">Then check cause 7</text><text x="480" y="410" font-size="12">igniter, flame sensor, valve coils</text>
  </g>
</svg>
