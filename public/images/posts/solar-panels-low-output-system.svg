<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="solsys" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where solar production can stop</text>
  <text x="24" y="54" font-size="13" fill="#566475">Typical grid-tied system without a battery</text>
  <!-- top row -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="80" width="140" height="90" rx="8"/>
    <rect x="196" y="80" width="106" height="90" rx="8"/>
    <rect x="334" y="80" width="120" height="90" rx="8"/>
    <rect x="486" y="80" width="134" height="90" rx="8"/>
    <rect x="196" y="240" width="106" height="80" rx="8"/>
    <rect x="334" y="240" width="120" height="80" rx="8"/>
    <rect x="486" y="240" width="134" height="80" rx="8"/>
  </g>
  <!-- small panel grid icon -->
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"><rect x="64" y="90" width="60" height="30"/></g>
  <g stroke="#1d5fae" stroke-width="1"><path d="M84 90v30M104 90v30M64 105h60"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#solsys)">
    <path d="M164 125h30"/><path d="M302 125h30"/><path d="M454 125h30"/><path d="M553 170v68"/>
  </g>
  <g fill="none" stroke="#566475" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M249 170v70"/>
    <path d="M394 320v24H94V170"/>
  </g>
  <g font-size="12" fill="#566475">
    <text x="170" y="117">DC</text><text x="308" y="117">AC</text><text x="460" y="117">AC</text>
    <text x="255" y="210">Wi-Fi</text>
    <text x="110" y="336">turns panels off</text>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="94" y="142">Panels</text>
    <text x="249" y="122">Inverter</text>
    <text x="394" y="122">AC disconnect</text>
    <text x="553" y="122">Main panel</text>
    <text x="249" y="274">Monitoring</text>
    <text x="394" y="274" font-size="13">Rapid shutdown</text>
    <text x="553" y="274">Utility meter</text>
  </g>
  <g font-size="12" fill="#d9442b" text-anchor="middle">
    <text x="94" y="160">shade, dirt, heat</text>
    <text x="249" y="146">fault light</text>
    <text x="394" y="146">switched off</text>
    <text x="553" y="146">breaker tripped</text>
    <text x="249" y="296">Wi-Fi lost,</text><text x="249" y="311">shows 0</text>
    <text x="394" y="298">switch off</text>
  </g>
  <text x="553" y="298" font-size="12" fill="#1f8a5b" text-anchor="middle">confirms output</text>
  <rect x="24" y="364" width="592" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="389" font-size="13" fill="#14202c" text-anchor="middle">Panels and DC wiring stay live in daylight, even with switches off.</text>
</svg>
