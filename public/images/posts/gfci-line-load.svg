<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">LINE brings power in. LOAD feeds the outlets after it.</text>
  <text x="24" y="54" font-size="13" fill="#566475">Back of a GFCI outlet (simplified)</text>
  <rect x="250" y="76" width="140" height="262" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="262" y="112" width="116" height="60" rx="6" fill="#ffd23f" fill-opacity=".35" stroke="#c9a10a"/>
  <text x="320" y="102" font-size="13" font-weight="700" fill="#0f2240" text-anchor="middle">LINE</text>
  <rect x="262" y="250" width="116" height="60" rx="6" fill="#dfe9f7" stroke="#1d5fae"/>
  <text x="320" y="240" font-size="13" font-weight="700" fill="#0f2240" text-anchor="middle">LOAD</text>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M40 142H273" stroke="#14202c"/><path d="M367 142H600" stroke="#a9b3bd"/>
    <path d="M40 280H273" stroke="#14202c"/><path d="M367 280H600" stroke="#a9b3bd"/>
  </g>
  <g stroke="#0f2240" stroke-width="2"><circle cx="282" cy="142" r="9" fill="#e9c46a"/><circle cx="358" cy="142" r="9" fill="#e4e8ec"/><circle cx="282" cy="280" r="9" fill="#e9c46a"/><circle cx="358" cy="280" r="9" fill="#e4e8ec"/><circle cx="320" cy="324" r="7" fill="#1f8a5b"/></g>
  <g font-size="13" fill="#14202c">
    <text x="40" y="130" font-weight="700">Hot in (black)</text><text x="40" y="162" fill="#566475">from the panel, brass screw</text>
    <text x="600" y="130" font-weight="700" text-anchor="end">Neutral in (white)</text><text x="600" y="162" fill="#566475" text-anchor="end">from the panel, silver screw</text>
    <text x="40" y="268" font-weight="700">Hot out (black)</text><text x="40" y="300" fill="#566475">to the next outlets</text>
    <text x="600" y="268" font-weight="700" text-anchor="end">Neutral out (white)</text><text x="600" y="300" fill="#566475" text-anchor="end">to the next outlets</text>
    <text x="320" y="356" fill="#566475" text-anchor="middle">Green screw = ground</text>
  </g>
  <line x1="24" y1="376" x2="616" y2="376" stroke="#d5dee8"/>
  <g font-size="13" fill="#14202c">
    <text x="24" y="400" font-weight="700">New GFCIs ship with tape over LOAD.</text><text x="24" y="418" fill="#566475">Incoming power always goes on LINE.</text>
    <text x="340" y="400" font-weight="700">LINE and LOAD swapped?</text><text x="340" y="418" fill="#566475">Most GFCIs made since 2006 won't reset.</text>
  </g>
</svg>
