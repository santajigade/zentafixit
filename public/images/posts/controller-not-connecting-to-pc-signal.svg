  <rect x="200" y="214" width="14" height="8" fill="#d9442b"/>
  <rect x="250" y="114" width="44" height="26" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M262 114v-14M282 114v-14" stroke="#0f2240" stroke-width="2"/>
