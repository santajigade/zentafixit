    <text x="68" y="256">USB 3 drive</text>
    <text x="206" y="132">router</text>
    <text x="40" y="112">controller</text>
  </g>
  <!-- right: desk with dongle on extension -->
  <g stroke="#0f2240" stroke-width="2" fill="none">
    <path d="M346 150h200M366 150v140M526 150v140"/>
    <rect x="456" y="190" width="56" height="100" rx="4" fill="#dfe9f7"/>
