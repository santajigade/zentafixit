<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs>
    <marker id="acfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker>
    <marker id="acfb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why the coil freezes: airflow</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="70" width="100" height="64" rx="8"/><rect x="142" y="70" width="100" height="64" rx="8"/><rect x="264" y="70" width="100" height="64" rx="8"/><rect x="508" y="70" width="100" height="64" rx="8"/>
  </g>
  <rect x="386" y="70" width="100" height="64" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#acfa)"><path d="M120 102h20"/><path d="M242 102h20"/><path d="M364 102h20"/><path d="M486 102h20"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="70" y="98">Return</text><text x="192" y="98">Filter</text><text x="314" y="98">Blower</text><text x="436" y="98">Coil</text><text x="558" y="98">Supply</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="70" y="118">warm air in</text><text x="192" y="118">traps dust</text><text x="314" y="118">moves air</text><text x="436" y="118">very cold</text><text x="558" y="118">cool air out</text>
  </g>
  <text x="24" y="182" font-size="14" font-weight="700" fill="#0f2240">When airflow drops</text>
  <g fill="#fff" stroke="#d9442b" stroke-width="2">
    <rect x="20" y="198" width="190" height="64" rx="8"/><rect x="225" y="198" width="190" height="64" rx="8"/><rect x="430" y="198" width="190" height="64" rx="8"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="115" y="226">Dirty filter</text><text x="320" y="226">Closed vents</text><text x="525" y="226">Weak blower</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="115" y="246">clogged, air slows</text><text x="320" y="246">or blocked returns</text><text x="525" y="246">dirty wheel or motor</text>
  </g>
  <g fill="none" stroke="#d9442b" stroke-width="2" marker-end="url(#acfb)"><path d="M115 262L190 304"/><path d="M320 262v40"/><path d="M525 262L450 304"/></g>
  <rect x="120" y="308" width="400" height="64" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="335" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Coil drops below freezing</text>
  <text x="320" y="356" font-size="13" fill="#14202c" text-anchor="middle">moisture on it turns to ice</text>
  <text x="320" y="400" font-size="12" fill="#566475" text-anchor="middle">Low refrigerant also makes the coil too cold. That one needs a technician.</text>
</svg>
