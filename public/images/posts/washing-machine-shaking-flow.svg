<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="450" fill="#f3f6fa"/>
  <defs><marker id="wsf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why is it shaking?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="56" width="280" height="52" rx="8"/>
    <rect x="30" y="150" width="280" height="52" rx="8"/>
    <rect x="30" y="244" width="280" height="52" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="360" y="56" width="250" height="52" rx="8"/>
    <rect x="360" y="150" width="250" height="52" rx="8"/>
    <rect x="360" y="244" width="250" height="52" rx="8"/>
    <rect x="30" y="338" width="580" height="52" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#wsf)">
    <path d="M312 82h46"/><path d="M312 176h46"/><path d="M312 270h46"/>
    <path d="M170 108v40"/><path d="M170 202v40"/><path d="M170 296v40"/>
  </g>
  <g font-size="12" fill="#566475"><text x="324" y="74">yes</text><text x="326" y="168">no</text><text x="324" y="262">yes</text><text x="180" y="133">no</text><text x="180" y="227">yes</text><text x="180" y="321">no</text></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="170" y="87">Is the washer brand new?</text>
    <text x="170" y="181">Shakes with every load?</text>
    <text x="170" y="275">Rocks when you push a corner?</text>
    <text x="485" y="78" font-weight="700">Remove shipping bolts</text><text x="485" y="97" font-size="12" fill="#566475">cause 3</text>
    <text x="485" y="172" font-weight="700">Unbalanced load</text><text x="485" y="191" font-size="12" fill="#566475">cause 1: spread it out</text>
    <text x="485" y="266" font-weight="700">Level and lock the feet</text><text x="485" y="285" font-size="12" fill="#566475">cause 2</text>
    <text x="320" y="360" font-weight="700">Check suspension, shock absorbers and the floor</text><text x="320" y="379" font-size="12" fill="#566475">causes 4, 5 and 7</text>
  </g>
  <text x="30" y="424" font-size="13" fill="#566475">Loud roar that rises with spin speed? Suspect worn bearings (cause 6).</text>
</svg>
