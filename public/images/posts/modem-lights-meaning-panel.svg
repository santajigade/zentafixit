<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Typical cable modem lights</text>
  <rect x="24" y="50" width="592" height="80" rx="16" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><circle cx="96" cy="78" r="9"/><circle cx="208" cy="78" r="9"/><circle cx="320" cy="78" r="9"/><circle cx="544" cy="78" r="9"/></g>
  <circle cx="432" cy="78" r="11" fill="#ffd23f" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="13" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="96" y="114">Power</text><text x="208" y="114">DS</text><text x="320" y="114">US</text><text x="432" y="114">Online</text><text x="544" y="114">Ethernet</text>
  </g>
  <rect x="24" y="148" width="592" height="34" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g font-size="13" font-weight="700" fill="#0f2240"><text x="40" y="170">Light</text><text x="196" y="170">Solid usually means</text><text x="412" y="170">Blinking usually means</text></g>
  <rect x="24" y="182" width="592" height="220" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="25" y="314" width="590" height="44" fill="#ffd23f" fill-opacity=".45"/>
  <g stroke="#d5dee8" stroke-width="1.5"><path d="M24 226h592M24 270h592M24 314h592M24 358h592M184 182v220M400 182v220"/></g>
  <g font-size="13" fill="#14202c">
    <text x="40" y="209" font-weight="700">Power</text><text x="196" y="209">On and running</text><text x="412" y="209">Starting or updating</text>
    <text x="40" y="253" font-weight="700">Downstream</text><text x="196" y="253">Locked on provider signal</text><text x="412" y="253">Scanning for a signal</text>
    <text x="40" y="297" font-weight="700">Upstream</text><text x="196" y="297">Connected upstream</text><text x="412" y="297">Connecting upstream</text>
    <text x="40" y="341" font-weight="700">Online</text><text x="196" y="341">Connected to provider</text><text x="412" y="341">Still connecting</text>
    <text x="40" y="385" font-weight="700">Ethernet</text><text x="196" y="385">Device linked</text><text x="412" y="385">Data moving (normal)</text>
  </g>
  <text x="24" y="416" font-size="12" fill="#566475">Names, colors and patterns vary by brand. Check your modem's label or manual.</text>
</svg>
