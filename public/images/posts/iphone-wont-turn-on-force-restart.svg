<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Force restart: buttons by model</text>
  <rect x="20" y="50" width="190" height="252" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="80" y="64" width="70" height="130" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="86" y="72" width="58" height="114" rx="6" fill="#14202c"/>
  <rect x="75" y="92" width="5" height="18" rx="2" fill="#1d5fae"/><rect x="75" y="116" width="5" height="18" rx="2" fill="#1d5fae" stroke="#1d5fae" stroke-width="1"/>
  <rect x="150" y="100" width="5" height="26" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <circle cx="59" cy="101" r="10" fill="#0f2240"/><text x="59" y="105" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="59" cy="125" r="10" fill="#0f2240"/><text x="59" y="129" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <circle cx="171" cy="113" r="10" fill="#0f2240"/><text x="171" y="117" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="115" y="224" font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">iPhone 8 and later</text>
  <text x="115" y="248" font-size="13" fill="#14202c" text-anchor="middle">1. Press volume up</text>
  <text x="115" y="266" font-size="13" fill="#14202c" text-anchor="middle">2. Press volume down</text>
  <text x="115" y="284" font-size="13" fill="#14202c" text-anchor="middle">3. Hold side button</text>
  <rect x="225" y="50" width="190" height="252" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="285" y="64" width="70" height="130" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="291" y="72" width="58" height="114" rx="6" fill="#14202c"/>
  <rect x="280" y="92" width="5" height="18" rx="2" fill="#566475"/><rect x="280" y="116" width="5" height="18" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <rect x="355" y="100" width="5" height="26" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <text x="320" y="224" font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">iPhone 7 and 7 Plus</text>
  <text x="320" y="248" font-size="13" fill="#14202c" text-anchor="middle">Hold the side button</text>
  <text x="320" y="266" font-size="13" fill="#14202c" text-anchor="middle">and volume down</text>
  <text x="320" y="284" font-size="13" fill="#14202c" text-anchor="middle">together</text>
  <rect x="430" y="50" width="190" height="252" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <rect x="490" y="64" width="70" height="130" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="496" y="76" width="58" height="96" rx="3" fill="#14202c"/>
  <circle cx="525" cy="183" r="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <rect x="533" y="59" width="18" height="5" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <rect x="560" y="96" width="5" height="22" rx="2" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <rect x="485" y="92" width="5" height="16" rx="2" fill="#566475"/><rect x="485" y="114" width="5" height="16" rx="2" fill="#566475"/>
  <text x="525" y="224" font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">iPhone 6s and older</text>
  <text x="525" y="248" font-size="13" fill="#14202c" text-anchor="middle">Hold the Home button</text>
  <text x="525" y="266" font-size="13" fill="#14202c" text-anchor="middle">and the top or side</text>
  <text x="525" y="284" font-size="13" fill="#14202c" text-anchor="middle">button together</text>
  <rect x="20" y="318" width="600" height="36" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="341" font-size="13" fill="#14202c" text-anchor="middle">Keep holding until the Apple logo appears. A force restart erases nothing.</text>
  <text x="320" y="374" font-size="12" fill="#566475" text-anchor="middle">iPhone SE (2nd and 3rd generation): use the iPhone 8 and later steps.</text>
  <text x="320" y="390" font-size="12" fill="#566475" text-anchor="middle">iPhone SE (1st generation): Home button plus the top button.</text>
</svg>
