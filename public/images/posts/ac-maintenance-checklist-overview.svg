<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Your AC checklist, step by step</text>
  <path d="M24 336H616" stroke="#566475" stroke-width="2"/>
  <path d="M360 56V336" stroke="#d5dee8" stroke-width="6"/>
  <text x="196" y="72" font-size="12" fill="#566475" text-anchor="middle">INDOORS</text>
  <text x="512" y="72" font-size="12" fill="#566475" text-anchor="middle">OUTDOORS</text>
  <!-- indoor unit -->
  <rect x="70" y="120" width="120" height="196" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="70" y="292" width="120" height="14" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <path d="M90 150l20 30 20-30 20 30 20-30" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <!-- drain line -->
  <path d="M190 240H240V334" fill="none" stroke="#566475" stroke-width="5"/>
  <!-- thermostat -->
  <rect x="250" y="90" width="32" height="42" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="266" cy="111" r="9" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <!-- refrigerant lines -->
  <path d="M190 200H440" stroke="#14202c" stroke-width="7"/>
  <path d="M190 218H440" stroke="#d9442b" stroke-width="3"/>
  <!-- disconnect -->
  <rect x="368" y="160" width="26" height="30" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- clearance -->
  <rect x="414" y="150" width="192" height="182" rx="10" fill="none" stroke="#1f8a5b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- outdoor unit -->
  <rect x="440" y="180" width="140" height="150" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="434" y="170" width="152" height="14" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="1.5"><path d="M456 196v120M468 196v120M480 196v120M540 196v120M552 196v120M564 196v120"/></g>
  <!-- markers -->
  <g fill="#0f2240"><circle cx="46" cy="299" r="12"/><circle cx="381" cy="140" r="12"/><circle cx="596" cy="140" r="12"/><circle cx="510" cy="256" r="12"/><circle cx="266" cy="290" r="12"/><circle cx="315" cy="178" r="12"/><circle cx="306" cy="111" r="12"/><circle cx="130" cy="236" r="12"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="46" y="304">1</text><text x="381" y="145">2</text><text x="596" y="145">3</text><text x="510" y="261">4</text>
    <text x="266" y="295">5</text><text x="315" y="183">6</text><text x="306" y="116">7</text><text x="130" y="241">8</text>
  </g>
  <!-- legend -->
  <g fill="#0f2240"><circle cx="34" cy="364" r="9"/><circle cx="182" cy="364" r="9"/><circle cx="330" cy="364" r="9"/><circle cx="478" cy="364" r="9"/><circle cx="34" cy="394" r="9"/><circle cx="182" cy="394" r="9"/><circle cx="330" cy="394" r="9"/><circle cx="478" cy="394" r="9"/></g>
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="34" y="368">1</text><text x="182" y="368">2</text><text x="330" y="368">3</text><text x="478" y="368">4</text>
    <text x="34" y="398">5</text><text x="182" y="398">6</text><text x="330" y="398">7</text><text x="478" y="398">8</text>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="50" y="369">Air filter</text><text x="198" y="369">Power off</text><text x="346" y="369">Clear space</text><text x="494" y="369">Rinse the coil</text>
    <text x="50" y="399">Drain line</text><text x="198" y="399">Line insulation</text><text x="346" y="399">Thermostat test</text><text x="494" y="399">Pro tune-up</text>
  </g>
</svg>
