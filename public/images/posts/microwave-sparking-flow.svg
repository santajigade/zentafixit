<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <defs><marker id="msf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Microwave sparking: find the cause</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="200" y="54" width="240" height="44" rx="8"/>
    <path d="M320 122l110 32-110 32-110-32z"/>
    <rect x="30" y="210" width="230" height="56" rx="8"/>
    <rect x="380" y="210" width="230" height="56" rx="8"/>
    <rect x="380" y="292" width="230" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="292" width="230" height="56" rx="8"/></g>
  <rect x="380" y="376" width="230" height="56" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#msf-arrow)">
    <path d="M320 98v22"/><path d="M210 154H145v54"/><path d="M430 154h65v54"/><path d="M145 266v24"/><path d="M495 266v24"/><path d="M495 348v26"/><path d="M260 238h118"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81" font-weight="700">1. Stop and unplug</text>
    <text x="320" y="159" font-weight="700">Metal inside?</text>
    <text x="175" y="146" font-size="12" fill="#566475">yes</text><text x="466" y="146" font-size="12" fill="#566475">no</text>
    <text x="320" y="230" font-size="12" fill="#566475">still sparks</text>
    <text x="145" y="234">Remove the metal, run</text><text x="145" y="252">a cup of water for 1 min</text>
    <text x="495" y="234">Inspect the waveguide</text><text x="495" y="252">cover and cavity paint</text>
    <text x="145" y="316" font-weight="700">No sparks? Done</text><text x="145" y="334" font-size="12">causes 1, 5, 6 or 7</text>
    <text x="495" y="316">Clean or replace cover,</text><text x="495" y="334">touch up chipped paint</text>
    <text x="495" y="400" font-size="13" font-weight="700" fill="#d9442b">Still sparks? Unplug it</text><text x="495" y="418" font-size="13">and call a technician</text>
  </g>
</svg>
