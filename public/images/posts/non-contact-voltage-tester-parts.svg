<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Using a non-contact tester on an outlet</text>
  <text x="24" y="54" font-size="13" fill="#566475">Outlet shown with the ground hole at the bottom</text>
  <rect x="50" y="76" width="140" height="210" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="66" y="98" width="108" height="164" rx="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="7" stroke-linecap="round"><path d="M100 140v40"/><path d="M144 146v28"/></g>
  <path d="M110 214h20v10a10 10 0 0 1-20 0z" fill="#0f2240"/>
  <g stroke="#c9a10a" stroke-width="2.5" stroke-linecap="round"><path d="M160 138l-6-16M176 134l2-17M160 182l-6 16M176 186l2 17"/></g>
  <path d="M148 160L212 140v40z" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <rect x="212" y="138" width="300" height="44" rx="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="270" y="128" width="110" height="10" rx="4" fill="#d5dee8" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="470" cy="160" r="10" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <path d="M400 150v20" stroke="#d5dee8" stroke-width="2"/>
  <g fill="none" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4"><path d="M196 178l34 42"/><path d="M470 150V118"/><path d="M480 182v38"/></g>
  <g font-size="13" fill="#14202c">
    <text x="360" y="94" font-weight="700">Power button</text><text x="360" y="111" font-size="12" fill="#566475">self-test on many models</text>
    <text x="226" y="238" font-weight="700">Sensing tip</text><text x="226" y="256" fill="#566475">glows and beeps near live AC</text>
    <text x="460" y="238" font-weight="700">Battery inside</text><text x="460" y="256" fill="#566475">weak battery can</text><text x="460" y="272" fill="#566475">miss a live wire</text>
  </g>
  <text x="24" y="314" font-size="13" fill="#14202c"><tspan font-weight="700">Short slot is hot.</tspan> Tall slot is neutral.</text>
  <rect x="24" y="334" width="592" height="46" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="362" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">A beep means voltage is likely. Silence doesn't prove it's dead.</text>
</svg>
