<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where is the water? Three leak zones</text>
  <!-- counter -->
  <rect x="20" y="56" width="400" height="16" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <!-- sink cabinet -->
  <rect x="30" y="72" width="170" height="268" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="40" y="200" width="150" height="96" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- dishwasher -->
  <rect x="210" y="72" width="200" height="236" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="210" y="72" width="200" height="34" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="280" y="84" width="60" height="10" rx="5" fill="#0f2240"/>
  <rect x="210" y="308" width="200" height="32" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <rect x="204" y="100" width="212" height="214" rx="8" fill="none" stroke="#1d5fae" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="204" y="304" width="212" height="44" rx="8" fill="none" stroke="#d9442b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- floor and puddle -->
  <path d="M20 340h400" stroke="#0f2240" stroke-width="2"/>
  <ellipse cx="310" cy="360" rx="90" ry="10" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <!-- zone labels -->
  <g font-size="13" fill="#14202c">
    <text x="115" y="222" text-anchor="middle" font-weight="700">Sink cabinet</text>
    <text x="115" y="242" text-anchor="middle">drain hose and</text>
    <text x="115" y="260" text-anchor="middle">its clamp (5)</text>
    <text x="115" y="280" text-anchor="middle" font-size="12" fill="#566475">leaks while draining</text>
  </g>
  <g font-size="14" fill="#14202c">
    <circle cx="448" cy="118" r="7" fill="#1d5fae"/>
    <text x="462" y="123" font-weight="700">Door edge</text>
    <text x="448" y="144" font-size="13">suds, gasket, level,</text>
    <text x="448" y="162" font-size="13">filter, door (1 to 4)</text>
    <circle cx="448" cy="214" r="7" fill="#d9442b"/>
    <text x="462" y="219" font-weight="700">Under the unit</text>
    <text x="448" y="240" font-size="13">supply line, inlet</text>
    <text x="448" y="258" font-size="13">valve, pump (6 to 8)</text>
    <circle cx="448" cy="310" r="7" fill="#c9a10a"/>
    <text x="462" y="315" font-weight="700">Sink cabinet</text>
    <text x="448" y="336" font-size="13">drain hose (5)</text>
  </g>
  <text x="24" y="398" font-size="13" fill="#566475">Dry everything, run a short cycle and watch which zone gets wet first.</text>
  <text x="24" y="416" font-size="13" fill="#566475">Turn off the power before removing the kick plate (red zone).</text>
</svg>
