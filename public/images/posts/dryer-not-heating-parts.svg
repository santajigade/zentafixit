<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="dnhp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">The air path inside a dryer</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="70" width="180" height="96" rx="8"/>
    <rect x="240" y="70" width="160" height="96" rx="8"/>
    <rect x="440" y="70" width="180" height="96" rx="8"/>
    <rect x="440" y="226" width="180" height="96" rx="8"/>
    <rect x="240" y="226" width="160" height="96" rx="8"/>
    <rect x="20" y="226" width="180" height="96" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="32" y="110" width="156" height="24" rx="6"/>
    <rect x="452" y="262" width="156" height="24" rx="6"/>
    <rect x="452" y="290" width="156" height="24" rx="6"/>
  </g>
  <g fill="none" stroke="#1d5fae" stroke-width="2.5" marker-end="url(#dnhp)">
    <path d="M200 118h38"/><path d="M400 118h38"/><path d="M530 166v58"/><path d="M440 274h-38"/><path d="M240 274h-38"/>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="110" y="96">Heating element</text>
    <text x="320" y="96">Drum</text>
    <text x="530" y="96">Lint screen</text>
    <text x="530" y="252">Blower fan</text>
    <text x="320" y="252">Vent duct</text>
    <text x="110" y="252">Outside hood</text>
  </g>
  <g font-size="12" fill="#14202c" text-anchor="middle">
    <text x="110" y="127">High-limit thermostat</text>
    <text x="110" y="153" fill="#566475">gas: burner, igniter</text>
    <text x="320" y="120" fill="#566475">hot air dries</text><text x="320" y="136" fill="#566475">the clothes</text>
    <text x="530" y="120" fill="#566475">clean after</text><text x="530" y="136" fill="#566475">every load</text>
    <text x="530" y="279">Thermal fuse</text>
    <text x="530" y="307">Cycling thermostat</text>
    <text x="320" y="276" fill="#566475">short, no kinks,</text><text x="320" y="292" fill="#566475">metal duct</text>
    <text x="110" y="276" fill="#566475">flap must open</text><text x="110" y="292" fill="#566475">freely</text>
  </g>
  <text x="24" y="368" font-size="13" fill="#566475">Highlighted parts cut the heat when air can't flow. Exact locations</text>
  <text x="24" y="386" font-size="13" fill="#566475">vary by model, so check the wiring diagram inside your dryer.</text>
</svg>
