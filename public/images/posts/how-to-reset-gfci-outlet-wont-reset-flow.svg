<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="490" fill="#f3f6fa"/>
  <defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">GFCI won't reset? Work down the list</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="180" y="50" width="280" height="40" rx="8"/>
    <path d="M320 112l120 36-120 36-120-36z"/>
    <rect x="180" y="208" width="280" height="40" rx="8"/>
    <rect x="180" y="268" width="280" height="40" rx="8"/>
    <path d="M320 328l120 36-120 36-120-36z"/>
    <rect x="470" y="340" width="150" height="48" rx="8"/>
  </g>
  <rect x="470" y="124" width="150" height="48" rx="8" fill="#fff" stroke="#1f8a5b" stroke-width="2"/>
  <rect x="160" y="420" width="320" height="52" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#flowArrow)">
    <path d="M320 90v20"/><path d="M440 148h28"/><path d="M320 184v22"/><path d="M320 248v18"/><path d="M320 308v18"/><path d="M440 364h28"/><path d="M320 400v18"/>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="454" y="140">yes</text><text x="338" y="200">no</text><text x="454" y="356">yes</text><text x="338" y="414">no</text>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="75">Press RESET firmly</text>
    <text x="320" y="153" font-weight="700">Stays in, power back?</text>
    <text x="320" y="233">Reset the breaker if tripped</text>
    <text x="320" y="293">Unplug everything, press RESET</text>
    <text x="320" y="369" font-weight="700">Resets now?</text>
    <text x="545" y="144" font-weight="700" fill="#1f8a5b">Done</text><text x="545" y="162" font-size="13">test it monthly</text>
    <text x="545" y="360">Plug items back</text><text x="545" y="378" font-size="13">one at a time</text>
    <text x="320" y="442" font-weight="700">Failed GFCI or wiring fault</text><text x="320" y="461" font-size="13">Replace it or call an electrician</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="24" y="224">Breaker may sit</text><text x="24" y="240">in the middle</text>
    <text x="24" y="284">Dry any wet</text><text x="24" y="300">outlets first</text>
  </g>
</svg>
