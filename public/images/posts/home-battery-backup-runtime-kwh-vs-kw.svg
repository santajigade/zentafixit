<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Energy (kWh) vs power (kW)</text>
  <!-- tank -->
  <rect x="70" y="66" width="140" height="200" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="72" y="126" width="136" height="138" rx="6" fill="#dfe9f7"/>
  <path d="M72 126q17-8 34 0t34 0 34 0 34 0" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <rect x="210" y="234" width="70" height="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="280" y="226" width="18" height="36" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <g fill="#1d5fae"><path d="M289 270c5 8 8 12 8 16a8 8 0 0 1-16 0c0-4 3-8 8-16z"/></g>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4" fill="none"><path d="M320 116H214"/><path d="M320 216H300v14"/></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="320" y="76" width="300" height="80" rx="8"/>
    <rect x="320" y="176" width="300" height="80" rx="8"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="336" y="102" font-weight="700">Tank size = energy (kWh)</text>
    <text x="336" y="124" font-size="13" fill="#566475">Sets how long the battery lasts</text>
    <text x="336" y="142" font-size="13" fill="#566475">Use the usable kWh figure</text>
    <text x="336" y="202" font-weight="700">Tap size = power (kW)</text>
    <text x="336" y="224" font-size="13" fill="#566475">Sets how much can run at once</text>
    <text x="336" y="242" font-size="13" fill="#566475">Motors also need a startup surge</text>
  </g>
  <rect x="24" y="296" width="592" height="80" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#14202c" text-anchor="middle">
    <text x="320" y="328" font-size="15" font-weight="700">Runtime (hours) = usable kWh ÷ average kW</text>
    <text x="320" y="354" font-size="13">Example: 9 kWh ÷ 0.5 kW average load = about 18 hours</text>
  </g>
</svg>
