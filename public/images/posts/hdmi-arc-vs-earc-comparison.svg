<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">ARC vs eARC at a glance</text>
  <text x="24" y="54" font-size="13" fill="#566475">Both ends must support eARC to get the eARC column</text>
  <rect x="184" y="68" width="210" height="32" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="404" y="68" width="212" height="32" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="289" y="89">ARC</text><text x="510" y="89">eARC</text></g>
  <g fill="#fff" stroke="#d5dee8" stroke-width="1.5">
    <rect x="24" y="108" width="592" height="34" rx="6"/><rect x="24" y="146" width="592" height="34" rx="6"/><rect x="24" y="184" width="592" height="34" rx="6"/><rect x="24" y="222" width="592" height="34" rx="6"/><rect x="24" y="260" width="592" height="34" rx="6"/><rect x="24" y="298" width="592" height="34" rx="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#14202c">
    <text x="36" y="130">Added in</text><text x="36" y="168">Bandwidth</text><text x="36" y="206">Stereo</text><text x="36" y="244">5.1 and 7.1</text><text x="36" y="282">Dolby Atmos</text><text x="36" y="320">Lossless formats</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="289" y="130">HDMI 1.4</text><text x="510" y="130">HDMI 2.1</text>
    <text x="289" y="168">Low</text><text x="510" y="168" fill="#1d5fae" font-weight="700">Much higher</text>
    <text x="289" y="206">Yes</text><text x="510" y="206">Yes</text>
    <text x="289" y="244">Compressed 5.1 only</text><text x="510" y="244">Compressed or lossless</text>
    <text x="289" y="282">Streaming type, some TVs</text><text x="510" y="282">Streaming and lossless</text>
    <text x="289" y="320" fill="#d9442b">No</text><text x="510" y="320" fill="#1f8a5b">TrueHD, DTS-HD MA</text>
  </g>
  <text x="24" y="360" font-size="13" fill="#566475">An eARC device plugged into an ARC port still works, as regular ARC.</text>
  <text x="24" y="380" font-size="13" fill="#566475">DTS support varies by TV. Check your manual.</text>
</svg>
