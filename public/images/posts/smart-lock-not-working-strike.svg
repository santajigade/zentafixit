<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="340" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Bolt and strike plate, seen from the door edge</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="54" width="284" height="210" rx="8"/><rect x="332" y="54" width="284" height="210" rx="8"/></g>
  <text x="166" y="80" font-size="14" font-weight="700" fill="#1f8a5b" text-anchor="middle">Lined up: locks freely</text>
  <text x="474" y="80" font-size="14" font-weight="700" fill="#d9442b" text-anchor="middle">Door sagged: bolt jams</text>
  <!-- left: door edge and frame -->
  <rect x="50" y="100" width="90" height="150" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="190" y="100" width="90" height="150" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="186" y="130" width="10" height="90" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="190" y="160" width="40" height="30" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/>
  <rect x="140" y="163" width="80" height="24" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="12" fill="#566475" text-anchor="middle"><text x="95" y="122">door</text><text x="250" y="122">frame</text><text x="166" y="210">bolt</text></g>
  <!-- right: sagged door, bolt lower -->
  <rect x="358" y="112" width="90" height="140" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="498" y="100" width="90" height="150" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="494" y="130" width="10" height="90" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="498" y="160" width="40" height="30" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/>
  <rect x="448" y="178" width="46" height="24" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g stroke="#d9442b" stroke-width="3" stroke-linecap="round"><path d="M486 172l8 -8M486 208l8 8M478 168l4 -10"/></g>
  <g font-size="12" fill="#566475" text-anchor="middle"><text x="403" y="134">door</text><text x="558" y="122">frame</text><text x="470" y="226">bolt hits plate</text></g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="24" y="278" width="592" height="48" rx="8"/></g>
  <text x="320" y="298" font-size="13" fill="#14202c" text-anchor="middle">Fix: tighten hinges, move or file the strike plate, deepen the hole,</text>
  <text x="320" y="316" font-size="13" fill="#14202c" text-anchor="middle">then recalibrate the lock in its app.</text>
</svg>
