<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#0f2240">Where the start-up parts are</text>
  <!-- cabinet and door -->
  <rect x="60" y="72" width="240" height="310" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="60" y="72" width="240" height="40" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g fill="#fff" stroke="#1d5fae" stroke-width="2"><circle cx="190" cy="92" r="7"/><circle cx="215" cy="92" r="7"/><circle cx="240" cy="92" r="7"/></g>
  <circle cx="280" cy="92" r="8" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <rect x="120" y="124" width="120" height="10" rx="5" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <rect x="166" y="66" width="30" height="10" rx="3" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <path d="M60 340H300" stroke="#0f2240" stroke-width="2"/>
  <rect x="60" y="340" width="240" height="42" rx="8" fill="#d5dee8" fill-opacity=".6" stroke="#0f2240" stroke-width="2"/>
  <g fill="none" stroke="#1d5fae" stroke-width="2" stroke-dasharray="5 5">
    <path d="M78 150H282V328H78z"/>
    <circle cx="110" cy="318" r="10"/>
  </g>
  <rect x="246" y="350" width="30" height="22" rx="3" fill="#fff" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- leaders -->
  <g fill="none" stroke="#566475" stroke-width="1.5">
    <path d="M181 66V54H350"/><path d="M288 92H350"/><path d="M120 318H350"/><path d="M276 361H350"/>
  </g>
  <g fill="#566475"><circle cx="181" cy="66" r="3"/><circle cx="288" cy="92" r="3"/><circle cx="120" cy="318" r="3"/><circle cx="276" cy="361" r="3"/></g>
  <!-- labels -->
  <g font-size="14" font-weight="700" fill="#14202c">
    <text x="360" y="59">Door latch and switch</text>
    <text x="360" y="97">Control panel</text>
    <text x="360" y="323">Float switch (inside tub)</text>
    <text x="360" y="366">Behind the kick plate</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="360" y="76">tells the board the door is shut</text>
    <text x="360" y="114">lock, delay and Start buttons</text>
    <text x="360" y="340">stops the fill when water is high</text>
    <text x="360" y="383">wiring box, water valve: power off</text>
    <text x="24" y="412">Under the sink: the plug (if any) and the water shutoff valve.</text>
  </g>
