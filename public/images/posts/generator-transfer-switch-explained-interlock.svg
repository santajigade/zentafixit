<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="il-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How an interlock kit works</text>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="165" y="62">Utility mode</text>
    <text x="475" y="62">Generator mode</text>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="40" y="74" width="250" height="250" rx="8"/>
    <rect x="350" y="74" width="250" height="250" rx="8"/>
    <rect x="70" y="100" width="80" height="110" rx="8"/>
    <rect x="180" y="100" width="80" height="110" rx="8"/>
    <rect x="380" y="100" width="80" height="110" rx="8"/>
    <rect x="490" y="100" width="80" height="110" rx="8"/>
  </g>
  <g fill="#0f2240">
    <rect x="100" y="112" width="20" height="34" rx="3"/>
    <rect x="210" y="164" width="20" height="34" rx="3"/>
    <rect x="410" y="164" width="20" height="34" rx="3"/>
    <rect x="520" y="112" width="20" height="34" rx="3"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2">
    <rect x="172" y="94" width="96" height="62" rx="8"/>
    <rect x="372" y="94" width="96" height="62" rx="8"/>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5">
    <rect x="70" y="262" width="80" height="14" rx="3"/><rect x="180" y="262" width="80" height="14" rx="3"/>
    <rect x="70" y="284" width="80" height="14" rx="3"/><rect x="180" y="284" width="80" height="14" rx="3"/>
    <rect x="380" y="262" width="80" height="14" rx="3"/><rect x="490" y="262" width="80" height="14" rx="3"/>
    <rect x="380" y="284" width="80" height="14" rx="3"/><rect x="490" y="284" width="80" height="14" rx="3"/>
  </g>
  <path d="M298 200h44" fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#il-arrow)"/>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="220" y="130" font-weight="700">Plate</text>
    <text x="420" y="130" font-weight="700">Plate</text>
    <text x="110" y="232" font-weight="700">Main: ON</text>
    <text x="220" y="232" font-weight="700">Gen: OFF</text>
    <text x="420" y="232" font-weight="700">Main: OFF</text>
    <text x="530" y="232" font-weight="700">Gen: ON</text>
    <text x="165" y="316" font-size="12" fill="#566475">branch circuits</text>
    <text x="475" y="316" font-size="12" fill="#566475">branch circuits</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="24" y="354" font-size="14" font-weight="700" fill="#14202c">The plate lets only one of the two breakers be on.</text>
    <text x="24" y="376">To switch: main off, slide the plate, then generator breaker on.</text>
    <text x="24" y="396">The generator breaker is fed from the outdoor inlet box.</text>
    <text x="24" y="414">The kit must be listed for your panel's make and model.</text>
  </g>
