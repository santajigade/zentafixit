<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="330" fill="#f3f6fa"/>
  <defs><marker id="hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">The weakest link sets the limit</text>
  <text x="24" y="54" font-size="13" fill="#566475">A typical HDMI chain with a receiver or soundbar in the middle</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="76" width="150" height="86" rx="8"/>
    <rect x="245" y="76" width="150" height="86" rx="8"/>
    <rect x="466" y="76" width="150" height="86" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#hc)"><path d="M176 128h66"/><path d="M397 128h66"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="99" y="112" font-weight="700">Source</text><text x="99" y="134" font-size="12" fill="#566475">console, box,</text><text x="99" y="150" font-size="12" fill="#566475">streamer or PC</text>
    <text x="320" y="112" font-weight="700">Receiver or</text><text x="320" y="130" font-weight="700">soundbar</text><text x="320" y="150" font-size="12" fill="#566475">or HDMI switch</text>
    <text x="541" y="112" font-weight="700">TV</text><text x="541" y="134" font-size="12" fill="#566475">on the matching</text><text x="541" y="150" font-size="12" fill="#566475">HDMI input</text>
    <text x="209" y="118" font-size="12" fill="#566475">cable</text><text x="430" y="118" font-size="12" fill="#566475">cable</text>
  </g>
  <rect x="24" y="186" width="592" height="122" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" fill="#14202c">
    <text x="44" y="212" font-weight="700">All three devices and both cables must support:</text>
    <text x="44" y="238">The same resolution and refresh rate, for example 4K at 120Hz</text>
    <text x="44" y="260">HDCP 2.2 copy protection for 4K streaming and Blu-ray</text>
    <text x="44" y="282">Enough cable bandwidth for the format you send (fix 9)</text>
  </g>
</svg>
