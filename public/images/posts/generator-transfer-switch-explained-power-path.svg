<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs>
    <marker id="pp-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
    <marker id="pp-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Backfeed cord vs transfer equipment</text>
  <text x="24" y="70" font-size="14" font-weight="700" fill="#d9442b">Unsafe: double male cord into a dryer outlet</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="84" width="96" height="64" rx="8"/>
    <rect x="148" y="84" width="96" height="64" rx="8"/>
    <rect x="272" y="84" width="96" height="64" rx="8"/>
    <rect x="396" y="84" width="96" height="64" rx="8"/>
    <rect x="520" y="84" width="96" height="64" rx="8" stroke="#d9442b"/>
  </g>
  <g fill="none" stroke="#d9442b" stroke-width="1.8" marker-end="url(#pp-red)">
    <path d="M120 116h26"/><path d="M244 116h26"/><path d="M368 116h26"/><path d="M492 116h26"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="72" y="121" font-weight="700">Generator</text>
    <text x="196" y="112" font-weight="700">Double male</text><text x="196" y="130">cord</text>
    <text x="320" y="112" font-weight="700">Dryer</text><text x="320" y="130">outlet</text>
    <text x="444" y="112" font-weight="700">Main panel</text><text x="444" y="130">main ON</text>
    <text x="568" y="104" font-weight="700" fill="#d9442b">Utility</text><text x="568" y="120" fill="#d9442b">lines</text><text x="568" y="136" fill="#d9442b">line worker</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="24" y="174">Power flows back out through the meter. The pole transformer steps</text>
    <text x="24" y="192">it up to thousands of volts on lines a crew believes are dead.</text>
  </g>
  <path d="M24 212H616" stroke="#d5dee8" stroke-width="2"/>
  <text x="24" y="240" font-size="14" font-weight="700" fill="#1f8a5b">Safe: inlet box and transfer equipment</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="254" width="96" height="64" rx="8"/>
    <rect x="148" y="254" width="96" height="64" rx="8"/>
    <rect x="272" y="254" width="96" height="64" rx="8"/>
    <rect x="520" y="254" width="96" height="64" rx="8"/>
    <rect x="396" y="352" width="96" height="48" rx="8" stroke="#566475"/>
  </g>
  <rect x="396" y="254" width="96" height="64" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pp-navy)">
    <path d="M120 286h26"/><path d="M244 286h26"/><path d="M368 286h26"/><path d="M492 286h26"/>
  </g>
  <path d="M444 318v34" stroke="#566475" stroke-width="1.8" stroke-dasharray="4 4"/>
  <g stroke="#d9442b" stroke-width="3" stroke-linecap="round"><path d="M436 327l16 16M452 327l-16 16"/></g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="72" y="291" font-weight="700">Generator</text>
    <text x="196" y="282" font-weight="700">Cord to</text><text x="196" y="300">inlet</text>
    <text x="320" y="274" font-weight="700">Inlet box</text><text x="320" y="290">on outside</text><text x="320" y="306">wall</text>
    <text x="444" y="274" font-weight="700">Transfer</text><text x="444" y="290">switch or</text><text x="444" y="306">interlock</text>
    <text x="568" y="282" font-weight="700">House</text><text x="568" y="300">circuits</text>
    <text x="444" y="372" font-weight="700">Utility</text><text x="444" y="390" font-size="12" fill="#566475">disconnected</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="24" y="372">Only one source can feed</text>
    <text x="24" y="390">the house at a time.</text>
    <text x="24" y="424" font-size="12">The cord has a female end at the inlet, so no live pins are exposed.</text>
  </g>
</svg>
