<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <defs><marker id="pfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why the pilot won't stay lit</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="54" width="300" height="44" rx="8"/>
    <path d="M320 116l120 34-120 34-120-34z"/>
    <path d="M320 216l140 34-140 34-140-34z"/>
    <rect x="24" y="300" width="180" height="70" rx="8"/>
    <rect x="230" y="300" width="180" height="70" rx="8"/>
    <rect x="436" y="300" width="180" height="70" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="382" width="180" height="40" rx="8"/><rect x="230" y="382" width="180" height="40" rx="8"/><rect x="436" y="382" width="180" height="40" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pfa)">
    <path d="M320 98v16"/><path d="M200 150H114v148"/><path d="M320 184v30"/><path d="M320 284v14"/><path d="M460 250h66v48"/>
    <path d="M114 370v10"/><path d="M320 370v10"/><path d="M526 370v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Relight exactly per the label</text>
    <text x="320" y="155" font-weight="700">Did the pilot light?</text>
    <text x="320" y="255" font-weight="700">Stays lit after you let go?</text>
    <text x="160" y="142" font-size="12" fill="#566475">no</text>
    <text x="334" y="204" font-size="12" fill="#566475" text-anchor="start">yes</text>
    <text x="306" y="296" font-size="12" fill="#566475" text-anchor="end">no</text>
    <text x="490" y="242" font-size="12" fill="#566475">yes</text>
    <text x="114" y="322" font-weight="700">No flame at all</text>
    <text x="114" y="342" font-size="13">Gas supply, igniter,</text><text x="114" y="358" font-size="13">clogged pilot tube</text>
    <text x="320" y="322" font-weight="700">Dies when released</text>
    <text x="320" y="342" font-size="13">Hold time, flame,</text><text x="320" y="358" font-size="13">thermocouple, valve</text>
    <text x="526" y="322" font-weight="700">Dies hours later</text>
    <text x="526" y="342" font-size="13">Draft, vent, vapor</text><text x="526" y="358" font-size="13">sensor or air screen</text>
    <text x="114" y="407" font-weight="700">Causes 4 and 7</text>
    <text x="320" y="407" font-weight="700">Causes 1, 2, 3, 8</text>
    <text x="526" y="407" font-weight="700">Causes 5 and 6</text>
  </g>
  <text x="24" y="446" font-size="13" font-weight="700" fill="#d9442b">Smell gas at any point? Stop, leave the house, call from outside.</text>
</svg>
