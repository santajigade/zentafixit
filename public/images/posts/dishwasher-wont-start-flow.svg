  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">Press a button: do lights come on?</text>
    <text x="215" y="106" font-size="12" fill="#566475">no</text>
    <text x="425" y="106" font-size="12" fill="#566475">yes</text>
    <text x="165" y="163" font-weight="700">No lights at all</text>
    <text x="475" y="163" font-weight="700">Lights on, won't run</text>
