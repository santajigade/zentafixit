<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Six places to check for battery drain</text>
  <rect x="24" y="56" width="150" height="364" rx="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="36" y="78" width="126" height="320" rx="8" fill="#dfe9f7"/>
  <rect x="80" y="64" width="38" height="6" rx="3" fill="#0f2240"/>
  <rect x="64" y="190" width="62" height="100" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="86" y="182" width="18" height="10" rx="2" fill="#0f2240"/>
  <rect x="70" y="270" width="50" height="14" rx="3" fill="#d9442b"/>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="196" y="56" width="420" height="52" rx="8"/>
    <rect x="196" y="117" width="420" height="52" rx="8"/>
    <rect x="196" y="178" width="420" height="52" rx="8"/>
    <rect x="196" y="239" width="420" height="52" rx="8"/>
    <rect x="196" y="300" width="420" height="52" rx="8"/>
  </g>
  <rect x="196" y="361" width="420" height="52" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" fill="#14202c" font-weight="700">
    <text x="212" y="78">1. Screen</text>
    <text x="212" y="139">2. Background apps</text>
    <text x="212" y="200">3. Mobile signal</text>
    <text x="212" y="261">4. Location and scanning</text>
    <text x="212" y="322">5. Account sync</text>
    <text x="212" y="383">6. Battery health</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="212" y="97">Adaptive brightness, short timeout, dark mode</text>
    <text x="212" y="158">Restrict or update the top app in the list</text>
    <text x="212" y="219">Wi-Fi calling, or airplane mode with no service</text>
    <text x="212" y="280">"While using the app" only, scanning off</text>
    <text x="212" y="341">Turn off sync you don't need, back up on Wi-Fi</text>
    <text x="212" y="402">Worn or swollen battery: get it replaced</text>
  </g>
</svg>
