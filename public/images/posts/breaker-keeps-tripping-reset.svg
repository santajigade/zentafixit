    <g font-size="12" fill="#566475"><text x="115" y="214">Power is flowing</text><text x="320" y="214">Rests in the middle,</text><text x="320" y="230">can look like ON</text><text x="525" y="214">Re-latches here</text><text x="525" y="230">with a click</text></g>
