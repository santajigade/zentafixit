<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Rh and Rc: one transformer or two?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="52" width="284" height="262" rx="8"/><rect x="332" y="52" width="284" height="262" rx="8"/></g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="166" y="78">One transformer</text><text x="474" y="78">Two transformers</text></g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="86" y="92" width="160" height="40" rx="8"/>
    <rect x="344" y="92" width="128" height="40" rx="8"/><rect x="480" y="92" width="128" height="40" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="166" y="117">24 V transformer</text>
    <text x="408" y="117">Heat source</text><text x="544" y="117">Cooling (AC)</text>
  </g>
  <!-- thermostat bases -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="56" y="196" width="220" height="80" rx="8"/><rect x="364" y="196" width="220" height="80" rx="8"/></g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M166 132v40h-50v56" stroke="#d9442b"/>
    <path d="M408 132v96" stroke="#d9442b"/><path d="M544 132v40h-28v56" stroke="#d9442b"/>
  </g>
  <path d="M120 238c30 22 66 22 96 0" fill="none" stroke="#c9a10a" stroke-width="5" stroke-linecap="round"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><circle cx="116" cy="232" r="7"/><circle cx="216" cy="232" r="7"/><circle cx="408" cy="232" r="7"/><circle cx="516" cy="232" r="7"/></g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="138" y="218">Rh</text><text x="216" y="218">Rc</text><text x="430" y="218">Rh</text><text x="538" y="218">Rc</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="166" y="270">jumper links Rh and Rc</text><text x="462" y="270">no jumper</text>
    <text x="222" y="160">single R wire</text><text x="476" y="168">two R wires</text>
  </g>
  <path d="M452 246l20 12M472 246l-20 12" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <rect x="24" y="330" width="592" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="354" font-size="13" fill="#14202c" text-anchor="middle">One R wire: keep the jumper (or the thermostat's jumper setting).</text>
  <text x="320" y="374" font-size="13" fill="#14202c" text-anchor="middle">Two R wires: remove the jumper so the transformers stay separate.</text>
</svg>
