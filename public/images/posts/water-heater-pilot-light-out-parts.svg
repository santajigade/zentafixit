<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Parts of a gas water heater pilot system</text>
  <rect x="230" y="60" width="180" height="280" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="250" y="250" width="140" height="80" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <path d="M24 150H290" stroke="#566475" stroke-width="8"/>
  <rect x="140" y="140" width="20" height="20" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M128 134H172" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/>
  <rect x="290" y="100" width="90" height="60" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="318" cy="130" r="14" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <rect x="350" y="121" width="18" height="18" rx="3" fill="#d9442b" stroke="#0f2240" stroke-width="1.5"/>
  <path d="M300 160V302" stroke="#566475" stroke-width="5" fill="none"/>
  <path d="M330 160V270H352V300" stroke="#1d5fae" stroke-width="2.5" fill="none"/>
  <path d="M345 160V262H364V288" stroke="#d9442b" stroke-width="2.5" fill="none"/>
  <ellipse cx="310" cy="308" rx="42" ry="8" fill="#566475"/>
  <path d="M358 276C368 288 370 296 358 302C346 296 348 288 358 276z" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <rect x="362" y="286" width="5" height="16" fill="#0f2240"/>
  <rect x="240" y="342" width="160" height="14" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="1"><path d="M252 344v10M264 344v10M276 344v10M288 344v10M300 344v10M312 344v10M324 344v10M336 344v10M348 344v10M360 344v10M372 344v10M384 344v10"/></g>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M150 116V130"/><path d="M380 116H435"/><path d="M330 200H435"/><path d="M364 270H435"/><path d="M362 284L435 330"/><path d="M212 304H266"/><path d="M212 350H238"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="76" font-weight="700">Gas shutoff valve</text><text x="24" y="94" font-size="13" fill="#566475">Handle in line with</text><text x="24" y="110" font-size="13" fill="#566475">the pipe means open</text>
    <text x="440" y="112" font-weight="700">Gas control valve</text><text x="440" y="130" font-size="13" fill="#566475">Knob: OFF, PILOT, ON</text><text x="440" y="146" font-size="13" fill="#566475">plus a pilot button</text>
    <text x="440" y="196" font-weight="700">Pilot tube</text><text x="440" y="214" font-size="13" fill="#566475">Thin tube that feeds</text><text x="440" y="230" font-size="13" fill="#566475">the pilot</text>
    <text x="440" y="262" font-weight="700">Thermocouple</text><text x="440" y="280" font-size="13" fill="#566475">Tip must sit in the</text><text x="440" y="296" font-size="13" fill="#566475">pilot flame</text>
    <text x="440" y="336" font-weight="700">Pilot flame</text><text x="440" y="354" font-size="13" fill="#566475">Steady and mostly blue</text><text x="440" y="370" font-size="13" fill="#566475">when healthy</text>
    <text x="24" y="290" font-weight="700">Main burner</text><text x="24" y="308" font-size="13" fill="#566475">Lit by the pilot when</text><text x="24" y="324" font-size="13" fill="#566475">the tank calls for heat</text>
    <text x="24" y="350" font-weight="700">Air intake screen</text><text x="24" y="368" font-size="13" fill="#566475">On FVIR models, keep</text><text x="24" y="384" font-size="13" fill="#566475">lint and dust off it</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="24" y="410">Simplified view. Layout varies by model. On sealed (FVIR) heaters the burner</text>
    <text x="24" y="426">sits behind a sealed inner door: do not remove it yourself.</text>
  </g>
</svg>
