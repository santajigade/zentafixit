<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Three kinds of laptop SSD</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="54" width="184" height="276" rx="8"/>
    <rect x="228" y="54" width="184" height="276" rx="8"/>
    <rect x="432" y="54" width="184" height="276" rx="8"/>
  </g>
  <!-- 2.5-inch drive -->
  <rect x="56" y="76" width="120" height="100" rx="6" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="76" y="96" width="80" height="44" rx="4" fill="#fff" stroke="#566475" stroke-width="1.5"/>
  <rect x="70" y="166" width="56" height="10" fill="#0f2240"/>
  <rect x="134" y="166" width="28" height="10" fill="#0f2240"/>
  <!-- M.2 SATA, two notches -->
  <rect x="244" y="110" width="152" height="32" rx="3" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="244" y="112" width="12" height="28" fill="#ffd23f"/>
  <rect x="242" y="115" width="14" height="4" fill="#fff"/><rect x="242" y="133" width="14" height="4" fill="#fff"/>
  <g fill="#fff" stroke="#566475" stroke-width="1.5"><rect x="270" y="116" width="34" height="20" rx="2"/><rect x="316" y="116" width="34" height="20" rx="2"/></g>
  <circle cx="396" cy="126" r="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- M.2 NVMe, one notch -->
  <rect x="448" y="110" width="152" height="32" rx="3" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="448" y="112" width="12" height="28" fill="#ffd23f"/>
  <rect x="446" y="133" width="14" height="4" fill="#fff"/>
  <g fill="#fff" stroke="#566475" stroke-width="1.5"><rect x="474" y="116" width="34" height="20" rx="2"/><rect x="520" y="116" width="34" height="20" rx="2"/></g>
  <circle cx="600" cy="126" r="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="116" y="194">SATA connector</text>
    <text x="320" y="164">notches at the left end</text>
    <text x="524" y="164">notch at the left end</text>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="116" y="222" font-weight="700">2.5-inch SATA</text>
    <text x="116" y="242" font-size="13" fill="#566475">Fits a 2.5-inch bay</text>
    <text x="116" y="260" font-size="13" fill="#566475">Usually 7 mm thick</text>
    <text x="320" y="222" font-weight="700">M.2 SATA</text>
    <text x="320" y="242" font-size="13" fill="#566475">Usually two notches</text>
    <text x="320" y="260" font-size="13" fill="#566475">(B and M key)</text>
    <text x="524" y="222" font-weight="700">M.2 NVMe</text>
    <text x="524" y="242" font-size="13" fill="#566475">Usually one notch</text>
    <text x="524" y="260" font-size="13" fill="#566475">(M key)</text>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"><rect x="44" y="280" width="144" height="34" rx="8"/><rect x="248" y="280" width="144" height="34" rx="8"/></g>
  <rect x="452" y="280" width="144" height="34" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="116" y="302">SATA speed</text><text x="320" y="302">SATA speed</text><text x="524" y="302">Fastest</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="24" y="362">M.2 SATA and M.2 NVMe drives can look almost identical.</text>
    <text x="24" y="382">The slot must support the type, so check your laptop's manual.</text>
  </g>
</svg>
