<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="300" fill="#f3f6fa"/>
  <defs><marker id="wr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Restart in this order</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="128" height="140" rx="8"/><rect x="176" y="56" width="128" height="140" rx="8"/><rect x="328" y="56" width="128" height="140" rx="8"/><rect x="480" y="56" width="128" height="140" rx="8"/>
  </g>
  <g fill="#0f2240"><circle cx="88" cy="86" r="16"/><circle cx="240" cy="86" r="16"/><circle cx="392" cy="86" r="16"/><circle cx="544" cy="86" r="16"/></g>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><text x="88" y="91">1</text><text x="240" y="91">2</text><text x="392" y="91">3</text><text x="544" y="91">4</text></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#wr)"><path d="M154 126h20"/><path d="M306 126h20"/><path d="M458 126h20"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="88" y="128" font-weight="700">Unplug both</text><text x="88" y="150" font-size="12" fill="#566475">modem and</text><text x="88" y="166" font-size="12" fill="#566475">router</text>
    <text x="240" y="128" font-weight="700">Wait 30 sec</text><text x="240" y="150" font-size="12" fill="#566475">let both fully</text><text x="240" y="166" font-size="12" fill="#566475">power down</text>
    <text x="392" y="128" font-weight="700">Modem first</text><text x="392" y="150" font-size="12" fill="#566475">wait for its</text><text x="392" y="166" font-size="12" fill="#566475">online light</text>
    <text x="544" y="128" font-weight="700">Router next</text><text x="544" y="150" font-size="12" fill="#566475">give it 1 to 2</text><text x="544" y="166" font-size="12" fill="#566475">minutes</text>
  </g>
  <rect x="24" y="214" width="584" height="66" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="240" font-weight="700">Then reconnect your device and open a website.</text>
    <text x="40" y="262">Use the power plug, not the reset pinhole. Reset erases router settings.</text>
  </g>
</svg>
