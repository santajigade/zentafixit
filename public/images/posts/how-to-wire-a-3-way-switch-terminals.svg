<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Terminals on a 3-way switch</text>
  <text x="24" y="54" font-size="13" fill="#566475">Screw positions vary by brand, so go by screw color</text>
  <rect x="296" y="70" width="48" height="268" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="270" y="110" width="100" height="180" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="305" y="170" width="30" height="60" rx="6" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <circle cx="270" cy="140" r="11" fill="#14202c" stroke="#0f2240" stroke-width="2"/>
  <circle cx="370" cy="140" r="11" fill="#ffd23f" stroke="#c9a10a" stroke-width="2"/>
  <circle cx="370" cy="260" r="11" fill="#ffd23f" stroke="#c9a10a" stroke-width="2"/>
  <circle cx="320" cy="318" r="9" fill="#1f8a5b" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M257 140H206"/><path d="M383 140H432"/><path d="M383 260H432"/><path d="M309 318H200"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="136" font-weight="700">Common (dark)</text><text x="24" y="154" font-size="13" fill="#566475">Hot from the panel,</text><text x="24" y="170" font-size="13" fill="#566475">or the wire to the light</text>
    <text x="440" y="136" font-weight="700">Traveler (brass)</text><text x="440" y="154" font-size="13" fill="#566475">Runs to the other</text><text x="440" y="170" font-size="13" fill="#566475">3-way switch</text>
    <text x="440" y="256" font-weight="700">Traveler (brass)</text><text x="440" y="274" font-size="13" fill="#566475">Either traveler can</text><text x="440" y="290" font-size="13" fill="#566475">go on either screw</text>
    <text x="24" y="314" font-weight="700">Ground (green)</text><text x="24" y="332" font-size="13" fill="#566475">Bare or green wire</text>
  </g>
  <text x="320" y="252" font-size="12" fill="#566475" text-anchor="middle">no ON/OFF</text>
  <rect x="24" y="356" width="592" height="66" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="382" font-weight="700">Tip: label the wire on the dark screw before removing the old switch.</text>
    <text x="40" y="404">The two travelers can swap places. The common cannot.</text>
  </g>
</svg>
