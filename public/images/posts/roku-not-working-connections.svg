<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Power the stick from the wall</text>
  <rect x="40" y="60" width="330" height="250" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="60" y="88" font-size="13" fill="#566475">Back of TV</text>
  <g fill="#0f2240"><rect x="330" y="120" width="28" height="14" rx="2"/><rect x="330" y="160" width="28" height="14" rx="2"/><rect x="330" y="200" width="28" height="14" rx="2"/><rect x="336" y="250" width="18" height="10" rx="2"/></g>
  <g font-size="13" fill="#14202c" text-anchor="end"><text x="320" y="132">HDMI 1</text><text x="320" y="172">HDMI 2</text><text x="320" y="212">HDMI 3</text><text x="320" y="260">USB</text></g>
  <path d="M358 167H420" stroke="#14202c" stroke-width="5"/>
  <rect x="420" y="152" width="120" height="30" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#0f2240" stroke-width="2"/>
  <text x="480" y="126" font-size="14" font-weight="700" text-anchor="middle" fill="#14202c">Streaming stick</text>
  <text x="480" y="143" font-size="12" text-anchor="middle" fill="#566475">on a short HDMI extender</text>
  <path d="M354 255H460V182" fill="none" stroke="#d9442b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M400 245l20 20M420 245l-20 20" stroke="#d9442b" stroke-width="3"/>
  <text x="384" y="286" font-size="13" font-weight="700" fill="#d9442b">USB port: may be too weak</text>
  <path d="M540 167H575V300" fill="none" stroke="#14202c" stroke-width="3"/>
  <rect x="540" y="296" width="70" height="90" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="555" y="300" width="40" height="34" rx="4" fill="#0f2240"/>
  <g fill="#0f2240"><rect x="566" y="350" width="5" height="14" rx="1"/><rect x="580" y="350" width="5" height="14" rx="1"/></g>
  <text x="528" y="330" font-size="14" font-weight="700" text-anchor="end" fill="#1f8a5b">Power from a wall outlet</text>
  <text x="528" y="348" font-size="12" text-anchor="end" fill="#566475">using the stick's own adapter</text>
  <text x="40" y="404" font-size="13" fill="#566475">A stick wedged behind the TV runs hotter. An extender gives it room.</text>
</svg>
