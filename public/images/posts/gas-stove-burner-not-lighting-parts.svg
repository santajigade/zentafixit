<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Parts of a sealed gas burner</text>
  <rect x="170" y="240" width="360" height="14" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="270" y="190" width="100" height="56" rx="8" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="235" y="150" width="170" height="40" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><circle cx="252" cy="170" r="4"/><circle cx="272" cy="170" r="4"/><circle cx="292" cy="170" r="4"/><circle cx="312" cy="170" r="4"/><circle cx="332" cy="170" r="4"/><circle cx="352" cy="170" r="4"/><circle cx="372" cy="170" r="4"/><circle cx="390" cy="170" r="4"/></g>
  <rect x="250" y="128" width="140" height="20" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="418" y="168" width="14" height="76" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M425 168v-6" stroke="#566475" stroke-width="3" stroke-linecap="round"/>
  <path d="M422 164l-5 4 4 2-6 3" fill="none" stroke="#c9a10a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="190" cy="300" r="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M190 284v16" stroke="#0f2240" stroke-width="3" stroke-linecap="round"/>
  <rect x="216" y="290" width="34" height="20" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <path d="M250 300H300V246" fill="none" stroke="#1d5fae" stroke-width="4"/>
  <text x="262" y="292" font-size="12" fill="#1d5fae">gas</text>
  <rect x="360" y="286" width="84" height="32" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="none" stroke="#d9442b" stroke-width="1.8"><path d="M233 310V334H402V318"/><path d="M425 286V244"/></g>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M200 136H250"/><path d="M150 168H245"/><path d="M160 218H270"/><path d="M436 200H456"/><path d="M444 302H456"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="124" font-weight="700">Burner cap</text><text x="24" y="142" font-size="13" fill="#566475">Sits flat and centered</text>
    <text x="24" y="172" font-weight="700">Flame ports</text><text x="24" y="190" font-size="13" fill="#566475">Clear with a pin</text>
    <text x="24" y="214" font-weight="700">Burner base</text><text x="24" y="232" font-size="13" fill="#566475">Keep liquids out</text>
    <text x="462" y="196" font-weight="700">Igniter</text><text x="462" y="214" font-size="13" fill="#566475">Sparks to the ports</text>
    <text x="462" y="298" font-weight="700">Spark module</text><text x="462" y="316" font-size="13" fill="#566475">Under the cooktop</text>
    <text x="24" y="358" font-weight="700">Knob and spark switch</text><text x="24" y="376" font-size="13" fill="#566475">Moisture here can cause nonstop clicking</text>
  </g>
</svg>
