<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where the heat comes from</text>
  <rect x="262" y="58" width="116" height="226" rx="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="272" y="76" width="96" height="190" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <rect x="300" y="96" width="40" height="30" rx="4" fill="#0f2240"/>
  <rect x="288" y="150" width="64" height="96" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <path d="M352 66h16" stroke="#0f2240" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#566475" stroke-width="1.2" fill="none">
    <path d="M230 106H298"/><path d="M230 226H286"/><path d="M410 106L366 68"/><path d="M410 226H370"/>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="70" width="210" height="72" rx="8"/>
    <rect x="20" y="190" width="210" height="72" rx="8"/>
    <rect x="410" y="70" width="210" height="72" rx="8"/>
    <rect x="410" y="190" width="210" height="72" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="20" y="304" width="290" height="60" rx="8"/>
    <rect x="330" y="304" width="290" height="60" rx="8"/>
  </g>
  <g font-size="12" fill="#566475">
    <text x="34" y="94" font-size="14" font-weight="700" fill="#14202c">Processor</text><text x="34" y="113">Games, video, navigation</text><text x="34" y="131" fill="#1f8a5b">Fix: close heavy apps</text>
    <text x="34" y="214" font-size="14" font-weight="700" fill="#14202c">Battery</text><text x="34" y="233">Charging, fast or wireless</text><text x="34" y="251" fill="#1f8a5b">Fix: charge, then play</text>
    <text x="424" y="94" font-size="14" font-weight="700" fill="#14202c">Cellular radio</text><text x="424" y="113">Weak signal</text><text x="424" y="131" fill="#1f8a5b">Fix: use Wi-Fi</text>
    <text x="424" y="214" font-size="14" font-weight="700" fill="#14202c">Screen</text><text x="424" y="233">High brightness</text><text x="424" y="251" fill="#1f8a5b">Fix: lower brightness</text>
    <text x="34" y="328" font-size="14" font-weight="700" fill="#14202c">Outside heat</text><text x="34" y="348">Sun, hot cars, pockets: keep it shaded</text>
    <text x="344" y="328" font-size="14" font-weight="700" fill="#14202c">Thick case</text><text x="344" y="348">Traps heat: remove it while charging</text>
  </g>
  <text x="320" y="400" font-size="13" text-anchor="middle" fill="#566475">Warm is normal. Too hot to hold, or hot while idle, is not.</text>
</svg>
