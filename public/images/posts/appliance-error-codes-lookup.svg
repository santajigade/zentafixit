  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="75">1. Write down the exact code</text>
    <text x="320" y="129">2. Find the model number tag</text>
    <text x="320" y="183">3. Check the owner's manual</text>
    <text x="320" y="237">4. Look for the tech sheet inside</text>
    <text x="320" y="291">5. Fix the cause, power cycle once</text>
    <text x="320" y="357" font-weight="700">Code comes back?</text>
    <text x="160" y="344" font-size="12" fill="#566475">no</text><text x="480" y="344" font-size="12" fill="#566475">yes</text>
    <text x="119" y="417" fill="#1f8a5b" font-weight="700">Done: watch for it</text>
    <text x="521" y="417" font-weight="700">Call maker or a pro</text>
  </g>
