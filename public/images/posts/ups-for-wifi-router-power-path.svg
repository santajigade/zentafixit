<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs>
    <marker id="upd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker>
    <marker id="upp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
    <marker id="upw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What has to stay powered</text>
  <text x="24" y="58" font-size="12" fill="#566475">Every box on the data path needs power, including some you don't own.</text>
  <text x="24" y="110" font-size="13" font-weight="700" fill="#566475">DATA PATH</text>
  <rect x="24" y="122" width="150" height="56" rx="8" fill="#fff" stroke="#566475" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="214" y="122" width="130" height="56" rx="8"/>
    <rect x="384" y="122" width="110" height="56" rx="8"/>
    <rect x="514" y="122" width="106" height="56" rx="8"/>
    <rect x="24" y="290" width="150" height="52" rx="8"/>
  </g>
  <rect x="214" y="290" width="406" height="52" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#upd)">
    <path d="M174 150h38"/><path d="M344 150h38"/><path d="M494 150h18"/>
  </g>
  <g fill="none" stroke="#d9442b" stroke-width="2" marker-end="url(#upp)">
    <path d="M279 290v-110"/><path d="M439 290v-110"/><path d="M567 290v-110"/>
  </g>
  <path d="M174 316h38" fill="none" stroke="#0f2240" stroke-width="2" marker-end="url(#upw)"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="99" y="155">ISP network</text>
    <text x="279" y="155">Modem or ONT</text>
    <text x="439" y="155">Router</text>
    <text x="567" y="155">Mesh nodes</text>
    <text x="99" y="321">Wall outlet</text>
    <text x="417" y="321" font-weight="700">Battery backup (UPS or power station)</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="99" y="198">Owned by your ISP,</text>
    <text x="99" y="214">may lose power too</text>
  </g>
  <text x="24" y="276" font-size="13" font-weight="700" fill="#566475">POWER PATH</text>
  <g font-size="12" fill="#566475">
    <text x="24" y="372">Fiber: the ONT may have a separate battery unit. Ask your ISP what it covers.</text>
    <text x="24" y="394">Plug only network gear into the battery outlets.</text>
  </g>
</svg>
