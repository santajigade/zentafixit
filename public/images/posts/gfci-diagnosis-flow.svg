<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Find the cause in 10 minutes</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="200" y="54" width="240" height="44" rx="8"/>
    <rect x="200" y="124" width="240" height="44" rx="8"/>
    <path d="M320 192l110 36-110 36-110-36z"/>
    <rect x="30" y="300" width="250" height="56" rx="8"/>
    <rect x="360" y="300" width="250" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="368" width="250" height="48" rx="8"/><rect x="360" y="368" width="250" height="48" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#a)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M210 228H155v70"/><path d="M430 228h55v70"/><path d="M155 356v10"/><path d="M485 356v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Unplug everything</text>
    <text x="320" y="151">2. Press RESET, wait 10 min</text>
    <text x="320" y="233" font-weight="700">Trips again?</text>
    <text x="183" y="220" font-size="12" fill="#566475">yes</text><text x="458" y="220" font-size="12" fill="#566475">no</text>
    <text x="155" y="324">Problem is in the wiring,</text><text x="155" y="342">moisture or the GFCI</text>
    <text x="485" y="324">Plug devices back in</text><text x="485" y="342">one at a time</text>
    <text x="155" y="390" font-weight="700">Check causes 1, 3, 4, 5</text><text x="155" y="406" font-size="12">moisture, downstream, worn unit</text>
    <text x="485" y="390" font-weight="700">The one that trips it</text><text x="485" y="406" font-size="12">is the faulty appliance (cause 2)</text>
  </g>
</svg>
