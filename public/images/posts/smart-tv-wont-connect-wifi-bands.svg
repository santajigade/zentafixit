<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">2.4 GHz vs 5 GHz for your TV</text>
  <rect x="24" y="54" width="282" height="230" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="334" y="54" width="282" height="230" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="24" y="54" width="282" height="42" rx="8" fill="#0f2240"/>
  <rect x="334" y="54" width="282" height="42" rx="8" fill="#1d5fae"/>
  <g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="165" y="81">2.4 GHz</text>
    <text x="475" y="81">5 GHz</text>
  </g>
  <!-- range arcs -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <g stroke="#1f8a5b"><path d="M60 150a24 24 0 0 1 0 30"/><path d="M76 138a46 46 0 0 1 0 54"/><path d="M92 126a68 68 0 0 1 0 78"/></g>
    <g stroke="#1d5fae"><path d="M370 150a24 24 0 0 1 0 30"/><path d="M386 138a46 46 0 0 1 0 54"/></g>
  </g>
  <circle cx="50" cy="165" r="6" fill="#0f2240"/>
  <circle cx="360" cy="165" r="6" fill="#0f2240"/>
  <g font-size="14" fill="#14202c">
    <text x="118" y="146" font-weight="700">Longer range</text>
    <text x="118" y="166">Better through walls</text>
    <text x="118" y="186">Slower</text>
    <text x="428" y="146" font-weight="700">Faster</text>
    <text x="428" y="166">Shorter range</text>
    <text x="428" y="186">Weaker through walls</text>
  </g>
  <line x1="40" y1="216" x2="290" y2="216" stroke="#d5dee8" stroke-width="2"/>
  <line x1="350" y1="216" x2="600" y2="216" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="13" fill="#566475">
    <text x="40" y="242">Works with nearly all smart TVs</text>
    <text x="40" y="262">More interference from neighbors</text>
    <text x="350" y="242">Some older or budget TVs</text>
    <text x="350" y="262">can't see this band</text>
  </g>
  <rect x="24" y="302" width="592" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="326" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">TV far from the router, or can't see your network?</text>
  <text x="320" y="345" font-size="13" fill="#14202c" text-anchor="middle">Try the 2.4 GHz network. Close by and streaming 4K? Try 5 GHz.</text>
</svg>
