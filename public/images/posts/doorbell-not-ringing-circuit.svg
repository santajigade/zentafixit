<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a wired doorbell circuit works</text>
  <rect x="40" y="70" width="160" height="70" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <text x="120" y="100" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">120 V house power</text>
  <text x="120" y="120" font-size="12" fill="#566475" text-anchor="middle">from a breaker</text>
  <rect x="40" y="190" width="160" height="80" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="120" y="222" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Transformer</text>
  <text x="120" y="242" font-size="12" fill="#566475" text-anchor="middle">lowers to about</text>
  <text x="120" y="258" font-size="12" fill="#566475" text-anchor="middle">10 to 24 V AC</text>
  <path d="M120 140v50" stroke="#d9442b" stroke-width="3"/>
  <rect x="270" y="80" width="130" height="56" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="335" y="104" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Front button</text>
  <text x="335" y="122" font-size="12" fill="#566475" text-anchor="middle">closes when pressed</text>
  <rect x="270" y="170" width="130" height="56" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="335" y="194" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Back button</text>
  <text x="335" y="212" font-size="12" fill="#566475" text-anchor="middle">(if you have one)</text>
  <rect x="460" y="90" width="150" height="200" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="535" y="118" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Chime</text>
  <g font-size="13" font-weight="700" fill="#14202c">
    <text x="492" y="164">FRONT</text><text x="492" y="214">REAR</text><text x="492" y="264">TRANS</text>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><circle cx="478" cy="159" r="6"/><circle cx="478" cy="209" r="6"/><circle cx="478" cy="259" r="6"/></g>
  <g fill="none" stroke="#1d5fae" stroke-width="2.5">
    <path d="M200 215h40v-107h30"/><path d="M240 198h30"/>
    <path d="M400 108h30v51h42"/><path d="M400 198h30v11h42"/>
    <path d="M200 250h40v80h238v-65"/>
  </g>
  <text x="300" y="350" font-size="12" fill="#566475" text-anchor="middle">second transformer wire goes straight to TRANS</text>
  <text x="24" y="388" font-size="13" fill="#566475">Low-voltage side (blue): safe to handle. 120 V side (red): turn off the breaker.</text>
</svg>
