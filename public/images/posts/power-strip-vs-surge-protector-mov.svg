<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs>
    <marker id="psN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker>
    <marker id="psR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a surge protector handles a spike</text>
  <text x="24" y="70" font-size="13" font-weight="700" fill="#d9442b">Surge spike</text>
  <path d="M24 112h30l8-24l8 32l8-12h66" fill="none" stroke="#d9442b" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="130" width="120" height="70" rx="8"/>
    <rect x="240" y="100" width="180" height="130" rx="8"/>
    <rect x="500" y="130" width="116" height="70" rx="8"/>
  </g>
  <rect x="290" y="146" width="80" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#psN)">
    <path d="M144 165H236"/><path d="M420 165H496"/>
  </g>
  <path d="M330 186V262" fill="none" stroke="#d9442b" stroke-width="2.5" marker-end="url(#psR)"/>
  <g stroke="#0f2240" stroke-width="2.5" stroke-linecap="round"><path d="M310 270h40M318 278h24M326 286h8"/></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="84" y="161" font-weight="700">Wall outlet</text>
    <text x="84" y="181" font-size="12" fill="#566475">120 V supply</text>
    <text x="330" y="124" font-weight="700">Surge protector</text>
    <text x="330" y="171" font-weight="700">MOV</text>
    <text x="376" y="214" font-size="12" fill="#566475">idle at 120 V</text>
    <text x="558" y="161" font-weight="700">Your device</text>
    <text x="558" y="181" font-size="12" fill="#566475">TV, PC, router</text>
    <text x="191" y="154" font-size="12" fill="#566475">120 V in</text>
    <text x="459" y="154" font-size="12" fill="#566475">120 V out</text>
  </g>
  <text x="344" y="250" font-size="13" font-weight="700" fill="#d9442b">Spike diverted to ground</text>
  <text x="300" y="282" font-size="13" fill="#566475" text-anchor="end">Ground wire</text>
  <rect x="24" y="316" width="592" height="62" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="342">Each surge wears the MOV a little. When it is used up,</text>
    <text x="40" y="362">the protected light goes out and the strip stops protecting.</text>
  </g>
</svg>
