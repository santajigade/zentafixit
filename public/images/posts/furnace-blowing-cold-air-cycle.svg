<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <defs><marker id="fbcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">A normal heating cycle, and where it stops</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="300" height="60" rx="8"/><rect x="24" y="132" width="300" height="60" rx="8"/><rect x="24" y="208" width="300" height="60" rx="8"/><rect x="24" y="284" width="300" height="60" rx="8"/><rect x="24" y="360" width="300" height="60" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="356" y="56" width="260" height="60" rx="8"/><rect x="356" y="132" width="260" height="60" rx="8"/><rect x="356" y="208" width="260" height="60" rx="8"/><rect x="356" y="360" width="260" height="60" rx="8"/>
  </g>
  <rect x="356" y="284" width="260" height="60" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#fbcc)">
    <path d="M174 116v14"/><path d="M174 192v14"/><path d="M174 268v14"/><path d="M174 344v14"/>
  </g>
  <g fill="none" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M324 86h32"/><path d="M324 162h32"/><path d="M324 238h32"/><path d="M324 314h32"/><path d="M324 390h32"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="40" y="81" font-weight="700">1. Thermostat calls for heat</text><text x="40" y="101" font-size="12" fill="#566475">Fan on AUTO waits for the heat</text>
    <text x="40" y="157" font-weight="700">2. Inducer fan starts</text><text x="40" y="177" font-size="12" fill="#566475">Clears the burner area</text>
    <text x="40" y="233" font-weight="700">3. Burners light</text><text x="40" y="253" font-size="12" fill="#566475">Flame sensor confirms the flame</text>
    <text x="40" y="309" font-weight="700">4. Blower starts</text><text x="40" y="329" font-size="12" fill="#566475">Once the heat exchanger is warm</text>
    <text x="40" y="385" font-weight="700">5. Burners stop, blower runs on</text><text x="40" y="405" font-size="12" fill="#566475">Pulls out the leftover heat</text>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="370" y="81">Fan on ON: blower runs</text><text x="370" y="101">without heat (cause 1)</text>
    <text x="370" y="157">Clogged drain or vent:</text><text x="370" y="177">pressure switch (cause 7)</text>
    <text x="370" y="233">No flame: gas, pilot (5, 6)</text><text x="370" y="253">Goes out: flame sensor (4)</text>
    <text x="370" y="309">First air can feel cool:</text><text x="370" y="329">normal (cause 2)</text>
    <text x="370" y="385">Stops early, then cold air:</text><text x="370" y="405">dirty filter (cause 3)</text>
  </g>
  <text x="24" y="446" font-size="13" fill="#566475">Blower running with no flame means cold air at the vents.</text>
</svg>
