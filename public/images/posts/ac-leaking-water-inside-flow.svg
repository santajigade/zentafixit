<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="450" fill="#f3f6fa"/>
  <defs><marker id="acf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Find where the water comes from</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="52" width="300" height="42" rx="8"/>
    <rect x="170" y="112" width="300" height="42" rx="8"/>
    <rect x="30" y="200" width="260" height="48" rx="8"/>
    <rect x="30" y="262" width="260" height="48" rx="8"/>
    <rect x="30" y="324" width="260" height="48" rx="8"/>
    <rect x="30" y="386" width="260" height="48" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="350" y="200" width="260" height="48" rx="8"/>
    <rect x="350" y="262" width="260" height="48" rx="8"/>
    <rect x="350" y="324" width="260" height="48" rx="8"/>
    <rect x="350" y="386" width="260" height="48" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#acf)">
    <path d="M320 94v16"/><path d="M320 154v14"/>
    <path d="M292 224h56"/><path d="M292 286h56"/><path d="M292 348h56"/><path d="M292 410h56"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="78">1. Turn the AC off</text>
    <text x="320" y="138">2. Check the filter, coil and pan</text>
    <text x="160" y="186" font-size="13" font-weight="700" fill="#566475">What you see</text>
    <text x="480" y="186" font-size="13" font-weight="700" fill="#566475">Likely cause</text>
    <text x="160" y="229">Ice on the coil or copper line</text>
    <text x="160" y="291">Drain pan full of water</text>
    <text x="160" y="353">Pan dry, water below it</text>
    <text x="160" y="415">Pump box full, pump silent</text>
    <text x="480" y="220" font-weight="700">Frozen coil (cause 3)</text><text x="480" y="238" font-size="12" fill="#566475">filter, airflow or refrigerant</text>
    <text x="480" y="282" font-weight="700">Clogged drain line (cause 1)</text><text x="480" y="300" font-size="12" fill="#566475">clear it with a shop vacuum</text>
    <text x="480" y="344" font-weight="700">Cracked pan or loose fitting</text><text x="480" y="362" font-size="12" fill="#566475">causes 4 and 6</text>
    <text x="480" y="406" font-weight="700">Failed condensate pump</text><text x="480" y="424" font-size="12" fill="#566475">cause 5</text>
  </g>
</svg>
