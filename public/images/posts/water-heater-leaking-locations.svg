  <g font-size="13" fill="#14202c">
    <text x="24" y="56">Cold inlet and</text><text x="24" y="74">shutoff valve</text>
    <text x="476" y="58">Hot outlet</text><text x="476" y="74" font-size="12" fill="#566475">fittings, nipples</text>
    <text x="476" y="116">T&amp;P relief valve</text><text x="476" y="132" font-size="12" fill="#566475">never cap it</text>
    <text x="476" y="296">Discharge pipe</text><text x="476" y="312" font-size="12" fill="#566475">drips if it opens</text>
    <text x="24" y="332">Drain valve</text><text x="24" y="348" font-size="12" fill="#566475">cap or replace</text>
    <text x="24" y="366">Burner door (gas)</text><text x="24" y="382" font-size="12" fill="#566475">or element cover</text>
    <text x="476" y="400">Under the tank</text><text x="476" y="416" font-size="12" fill="#566475">tank failing, or</text><text x="476" y="432" font-size="12" fill="#566475">condensation</text>
  </g>
