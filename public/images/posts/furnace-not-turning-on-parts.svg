<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What to check on a gas furnace</text>
  <!-- cabinet -->
  <rect x="220" y="56" width="200" height="332" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <line x1="220" y1="210" x2="420" y2="210" stroke="#0f2240" stroke-width="2"/>
  <!-- burners -->
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="286" y="150" width="22" height="34" rx="4"/><rect x="318" y="150" width="22" height="34" rx="4"/><rect x="350" y="150" width="22" height="34" rx="4"/>
  </g>
  <g fill="#d9442b"><path d="M297 150c-6-10 0-18 0-24 6 8 8 16 0 24z"/><path d="M329 150c-6-10 0-18 0-24 6 8 8 16 0 24z"/><path d="M361 150c-6-10 0-18 0-24 6 8 8 16 0 24z"/></g>
  <rect x="340" y="80" width="56" height="36" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- flame sensor -->
  <path d="M262 120v40" stroke="#0f2240" stroke-width="4" stroke-linecap="round"/>
  <circle cx="262" cy="140" r="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- gas pipe and valve -->
  <path d="M440 46v52h-44" fill="none" stroke="#566475" stroke-width="6"/>
  <rect x="434" y="58" width="12" height="28" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <!-- lower section: control board, door switch -->
  <rect x="300" y="236" width="90" height="56" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <circle cx="372" cy="252" r="6" fill="#1f8a5b"/>
  <rect x="232" y="232" width="18" height="26" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <circle cx="320" cy="336" r="32" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="320" cy="336" r="8" fill="#0f2240"/>
  <!-- condensate trap -->
  <path d="M420 330h14v24a8 8 0 0 1-16 0" fill="none" stroke="#1d5fae" stroke-width="4" transform="translate(8 0)"/>
  <!-- filter slot -->
  <rect x="220" y="394" width="200" height="18" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- power switch -->
  <rect x="176" y="66" width="26" height="40" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="185" y="74" width="8" height="14" rx="2" fill="#0f2240"/>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M176 86H136"/><path d="M250 140H170"/><path d="M232 245H170"/><path d="M220 403H170"/>
    <path d="M446 72H456"/><path d="M390 264H456"/><path d="M442 354H456"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="82" font-weight="700">Power switch</text><text x="24" y="100" font-size="12" fill="#566475">on or near furnace</text>
    <text x="24" y="136" font-weight="700">Flame sensor</text><text x="24" y="154" font-size="12" fill="#566475">thin rod at burners</text>
    <text x="24" y="242" font-weight="700">Door switch</text><text x="24" y="260" font-size="12" fill="#566475">pressed by the panel</text>
    <text x="24" y="400" font-weight="700">Filter slot</text><text x="24" y="418" font-size="12" fill="#566475">check monthly</text>
    <text x="462" y="68" font-weight="700">Gas shutoff valve</text><text x="462" y="86" font-size="12" fill="#566475">along pipe: open</text>
    <text x="462" y="260" font-weight="700">Control board</text><text x="462" y="278" font-size="12" fill="#566475">LED blinks codes</text>
    <text x="462" y="350" font-weight="700">Condensate trap</text><text x="462" y="368" font-size="12" fill="#566475">high-efficiency only</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle"><text x="320" y="200">burners</text><text x="320" y="382">blower</text></g>
</svg>
