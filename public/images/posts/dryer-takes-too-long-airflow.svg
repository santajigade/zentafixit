<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="dtla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How air moves through a dryer</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="30" y="60" width="170" height="56" rx="8"/>
    <rect x="235" y="60" width="170" height="56" rx="8"/>
    <rect x="440" y="60" width="170" height="56" rx="8"/>
    <rect x="235" y="170" width="170" height="56" rx="8"/>
    <rect x="30" y="280" width="170" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2">
    <rect x="440" y="170" width="170" height="56" rx="8"/>
    <rect x="30" y="170" width="170" height="56" rx="8"/>
    <rect x="235" y="280" width="170" height="56" rx="8"/>
    <rect x="440" y="290" width="24" height="16" rx="3" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#dtla)">
    <path d="M200 88H233"/><path d="M405 88H438"/><path d="M525 116V168"/><path d="M440 198H407"/><path d="M235 198H202"/><path d="M115 226V278"/><path d="M200 308H233"/>
  </g>
  <g fill="#14202c" text-anchor="middle">
    <g font-size="14" font-weight="700">
      <text x="115" y="84">Room air in</text>
      <text x="320" y="84">Heater</text>
      <text x="525" y="84">Drum and clothes</text>
      <text x="525" y="194">Lint screen</text>
      <text x="320" y="194">Blower wheel</text>
      <text x="115" y="194">Transition hose</text>
      <text x="115" y="304">Wall duct</text>
      <text x="320" y="304">Outdoor hood</text>
    </g>
    <g font-size="12" fill="#566475">
      <text x="115" y="102">needs free space</text>
      <text x="320" y="102">electric or gas</text>
      <text x="525" y="102">air picks up water</text>
      <text x="525" y="212">clean every load</text>
      <text x="320" y="212">pushes air out</text>
      <text x="115" y="212">kinks and crushing</text>
      <text x="115" y="322">lint builds up inside</text>
      <text x="320" y="322">flap must open freely</text>
    </g>
  </g>
  <text x="472" y="303" font-size="13" fill="#14202c">Common blockage</text>
  <text x="472" y="320" font-size="13" fill="#14202c">point</text>
  <text x="24" y="374" font-size="13" fill="#566475">Heat alone is not enough. The wet air has to get outside.</text>
</svg>
