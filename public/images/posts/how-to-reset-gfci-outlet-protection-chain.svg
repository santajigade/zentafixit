<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="410" fill="#f3f6fa"/>
  <defs><marker id="chainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">One GFCI can protect several outlets</text>
  <text x="24" y="54" font-size="13" fill="#566475">When it trips, every outlet wired after it goes dead too</text>
  <!-- four boxes -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="76" width="120" height="150" rx="8"/>
    <rect x="336" y="76" width="120" height="150" rx="8"/>
    <rect x="492" y="76" width="120" height="150" rx="8"/>
  </g>
  <rect x="180" y="76" width="120" height="150" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <!-- panel icon -->
  <rect x="54" y="92" width="60" height="92" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="1.5"><rect x="62" y="102" width="44" height="12" rx="2"/><rect x="62" y="122" width="44" height="12" rx="2"/><rect x="62" y="142" width="44" height="12" rx="2"/><rect x="62" y="162" width="44" height="12" rx="2"/></g>
  <!-- GFCI icon -->
  <rect x="210" y="88" width="60" height="100" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="3" stroke-linecap="round"><path d="M230 100v12M250 100v10M230 166v12M250 166v10"/></g>
  <rect x="216" y="132" width="22" height="12" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="1.5"/>
  <rect x="242" y="132" width="22" height="12" rx="3" fill="#d9442b" stroke="#0f2240" stroke-width="1.5"/>
  <!-- regular outlet icons -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="366" y="88" width="60" height="100" rx="8"/><rect x="522" y="88" width="60" height="100" rx="8"/></g>
  <g stroke="#0f2240" stroke-width="3" stroke-linecap="round"><path d="M386 106v12M406 106v10M386 156v12M406 156v10M542 106v12M562 106v10M542 156v12M562 156v10"/></g>
  <!-- wires -->
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#chainArrow)"><path d="M144 150h34"/><path d="M300 150h34"/><path d="M456 150h34"/></g>
  <g font-size="11" fill="#566475" text-anchor="middle"><text x="162" y="142">LINE</text><text x="318" y="142">LOAD</text></g>
  <!-- box labels -->
  <g font-size="13" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="84" y="212">Breaker panel</text><text x="240" y="212">GFCI outlet</text><text x="396" y="212">Regular outlet</text><text x="552" y="212">Regular outlet</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="84" y="248">Breaker ON</text><text x="84" y="264">feeds the circuit</text>
    <text x="240" y="248" fill="#d9442b" font-weight="700">Tripped</text><text x="240" y="264">press RESET here</text>
    <text x="396" y="248">Dead too</text><text x="396" y="264">no buttons</text>
    <text x="552" y="248">Dead too</text><text x="552" y="264">no buttons</text>
  </g>
  <!-- protected bracket -->
  <path d="M180 280v10H612v-10" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <text x="396" y="310" font-size="13" fill="#1d5fae" text-anchor="middle" font-weight="700">Protected by this GFCI</text>
  <!-- where to look -->
  <text x="24" y="346" font-size="14" font-weight="700" fill="#0f2240">Where to look for the GFCI</text>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="24" y="358" width="104" height="34" rx="8"/><rect x="140" y="358" width="104" height="34" rx="8"/><rect x="256" y="358" width="104" height="34" rx="8"/><rect x="372" y="358" width="104" height="34" rx="8"/><rect x="488" y="358" width="104" height="34" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="76" y="380">Bathroom</text><text x="192" y="380">Kitchen</text><text x="308" y="380">Garage</text><text x="424" y="380">Outdoors</text><text x="540" y="380">Basement</text>
  </g>
</svg>
