<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="470" fill="#f3f6fa"/>
  <defs><marker id="abha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">AC blowing warm air: where to look</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <path d="M190 54l150 32-150 32-150-32z"/>
    <path d="M190 144l150 32-150 32-150-32z"/>
    <path d="M190 234l150 32-150 32-150-32z"/>
  </g>
  <rect x="390" y="60" width="230" height="52" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="390" y="150" width="230" height="52" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="390" y="240" width="230" height="52" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <rect x="40" y="330" width="300" height="70" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#abha)">
    <path d="M340 86h48"/><path d="M340 176h48"/><path d="M340 266h48"/>
    <path d="M190 118v24"/><path d="M190 208v24"/><path d="M190 298v30"/>
  </g>
  <g font-size="12" fill="#566475">
    <text x="346" y="78">no</text><text x="346" y="168">silent</text><text x="346" y="258">hums</text>
    <text x="198" y="134">yes</text><text x="198" y="224">running</text><text x="198" y="318">fan spins</text>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="190" y="82">COOL mode and</text><text x="190" y="99">fan on AUTO?</text>
    <text x="190" y="172">Outdoor unit</text><text x="190" y="189">running?</text>
    <text x="190" y="262">Outdoor fan</text><text x="190" y="279">spinning?</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#14202c">
    <text x="505" y="82" font-weight="700">Fix the setting</text><text x="505" y="100" font-size="13" fill="#566475">Wait 5 to 10 min (cause 1)</text>
    <text x="505" y="172" font-weight="700" fill="#1d5fae">Breaker, disconnect, drain</text><text x="505" y="190" font-size="13" fill="#566475">Causes 3 and 5</text>
    <text x="505" y="262" font-weight="700" fill="#d9442b">Turn it off, call a pro</text><text x="505" y="280" font-size="13" fill="#566475">Capacitor or contactor (cause 4)</text>
    <text x="190" y="356" font-weight="700">Check filter, coil and ducts</text><text x="190" y="374" font-size="13" fill="#566475">Causes 2, 6 and 8</text><text x="190" y="390" font-size="13" fill="#566475">Still warm? Cause 7, call a pro</text>
  </g>
  <text x="24" y="440" font-size="13" fill="#566475">Turn the power off at the breaker and disconnect before touching the outdoor unit.</text>
</svg>
