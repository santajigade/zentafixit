<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="aphf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">When does your phone get hot?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="54" width="300" height="44" rx="8"/>
    <rect x="24" y="140" width="184" height="56" rx="8"/>
    <rect x="228" y="140" width="184" height="56" rx="8"/>
    <rect x="432" y="140" width="184" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="216" width="184" height="96" rx="8"/>
    <rect x="228" y="216" width="184" height="96" rx="8"/>
    <rect x="432" y="216" width="184" height="96" rx="8"/>
  </g>
  <rect x="24" y="336" width="592" height="60" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#aphf)">
    <path d="M250 98L130 138"/><path d="M320 98v40"/><path d="M390 98L510 138"/>
    <path d="M116 196v18"/><path d="M320 196v18"/><path d="M524 196v18"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">Unplug, remove case, close apps</text>
    <text x="116" y="173" font-weight="700">While charging</text>
    <text x="320" y="163" font-weight="700">While using</text><text x="320" y="183" font-size="12" fill="#566475">games, video, maps</text>
    <text x="524" y="163" font-weight="700">While idle</text><text x="524" y="183" font-size="12" fill="#566475">in pocket or on desk</text>
    <text x="116" y="240" font-size="13">Avoid heavy use</text>
    <text x="116" y="260" font-size="13">Use a hard surface</text>
    <text x="116" y="280" font-size="13">Check charger, cable</text>
    <text x="116" y="300" font-size="12" fill="#566475">Causes 1, 3, 7</text>
    <text x="320" y="240" font-size="13">Take breaks</text>
    <text x="320" y="260" font-size="13">Lower brightness</text>
    <text x="320" y="280" font-size="13">Keep out of the sun</text>
    <text x="320" y="300" font-size="12" fill="#566475">Causes 2, 4, 8</text>
    <text x="524" y="240" font-size="13">Check battery usage</text>
    <text x="524" y="260" font-size="13">for a rogue app</text>
    <text x="524" y="280" font-size="13">Updated? Restart it</text>
    <text x="524" y="300" font-size="12" fill="#566475">Causes 5, 6</text>
    <text x="320" y="361" font-weight="700" fill="#d9442b">Screen or back bulging, burning smell or smoke?</text>
    <text x="320" y="381" font-size="13">Stop using and charging it. Get it to a repair shop.</text>
  </g>
</svg>
