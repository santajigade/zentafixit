<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">MERV ratings explained</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="54" width="592" height="64" rx="8"/>
    <rect x="24" y="128" width="592" height="64" rx="8"/>
    <rect x="24" y="202" width="592" height="64" rx="8"/>
  </g>
  <rect x="24" y="276" width="592" height="64" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5">
    <rect x="36" y="66" width="120" height="40" rx="6"/>
    <rect x="36" y="140" width="120" height="40" rx="6"/>
    <rect x="36" y="214" width="120" height="40" rx="6"/>
    <rect x="36" y="288" width="120" height="40" rx="6"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="96" y="91">MERV 1 to 4</text>
    <text x="96" y="165">MERV 5 to 8</text>
    <text x="96" y="239">MERV 9 to 12</text>
    <text x="96" y="313">MERV 13 to 16</text>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="174" y="82" font-weight="700">Basic fiberglass</text>
    <text x="174" y="102" font-size="13" fill="#566475">Large dust and lint, mainly protects equipment</text>
    <text x="174" y="156" font-weight="700">Standard pleated</text>
    <text x="174" y="176" font-size="13" fill="#566475">Household dust, pollen, mold spores</text>
    <text x="174" y="230" font-weight="700">Better pleated</text>
    <text x="174" y="250" font-size="13" fill="#566475">Finer dust and more pet dander</text>
    <text x="174" y="304" font-weight="700">High efficiency</text>
    <text x="174" y="324" font-size="13" fill="#566475">Smaller particles, some smoke</text>
  </g>
  <g font-size="12" font-weight="700" fill="#1f8a5b">
    <text x="470" y="156">Common home range</text>
    <text x="470" y="230">Common home range</text>
  </g>
  <text x="450" y="304" font-size="12" font-weight="700" fill="#d9442b">May restrict airflow</text>
  <text x="450" y="320" font-size="12" fill="#566475">Check your manual</text>
  <text x="24" y="368" font-size="13" fill="#566475">Higher MERV traps finer particles but adds resistance to airflow.</text>
  <text x="24" y="386" font-size="13" fill="#566475">Some retailers use their own scales, which are not the same as MERV.</text>
</svg>
