<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="360" fill="#f3f6fa"/>
  <defs><marker id="shf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Space heater cost in four steps</text>
  <text x="24" y="54" font-size="13" fill="#566475">The same formula works for any plug-in appliance</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="70" width="130" height="72" rx="8"/>
    <rect x="178" y="70" width="130" height="72" rx="8"/>
    <rect x="332" y="70" width="130" height="72" rx="8"/>
    <rect x="486" y="70" width="130" height="72" rx="8"/>
    <rect x="24" y="196" width="130" height="80" rx="8"/>
    <rect x="178" y="196" width="130" height="80" rx="8"/>
    <rect x="332" y="196" width="130" height="80" rx="8"/>
  </g>
  <rect x="486" y="196" width="130" height="80" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#shf)">
    <path d="M156 106h20"/><path d="M310 106h20"/><path d="M464 106h20"/>
    <path d="M156 236h20"/><path d="M310 236h20"/><path d="M464 236h20"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="89" y="102" font-weight="700">Watts</text><text x="89" y="122" font-size="12" fill="#566475">on the label</text>
    <text x="243" y="102" font-weight="700">÷ 1,000</text><text x="243" y="122" font-size="12" fill="#566475">gives kilowatts</text>
    <text x="397" y="102" font-weight="700">× hours</text><text x="397" y="122" font-size="12" fill="#566475">gives kWh</text>
    <text x="551" y="102" font-weight="700">× your rate</text><text x="551" y="122" font-size="12" fill="#566475">gives cost</text>
  </g>
  <text x="24" y="182" font-size="14" font-weight="700" fill="#0f2240">Example: 1,500 W heater, 5 hours, $0.16 per kWh</text>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="89" y="232" font-size="17" font-weight="700" fill="#1d5fae">1,500 W</text><text x="89" y="256" font-size="12" fill="#566475">high setting</text>
    <text x="243" y="232" font-size="17" font-weight="700" fill="#1d5fae">1.5 kW</text><text x="243" y="256" font-size="12" fill="#566475">1,500 ÷ 1,000</text>
    <text x="397" y="232" font-size="17" font-weight="700" fill="#1d5fae">7.5 kWh</text><text x="397" y="256" font-size="12" fill="#566475">1.5 × 5 hours</text>
    <text x="551" y="232" font-size="17" font-weight="700" fill="#0f2240">$1.20</text><text x="551" y="256" font-size="12" fill="#566475">7.5 × $0.16</text>
  </g>
  <text x="24" y="314" font-size="13" fill="#566475">$0.16 per kWh is an example rate only. Use the price per kWh on your bill.</text>
  <text x="24" y="334" font-size="13" fill="#566475">Multiply the daily cost by 30 for a rough monthly figure ($36.00 here).</text>
</svg>
