<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="wwdp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a washer drain can clog</text>
  <!-- washer body -->
  <rect x="40" y="70" width="220" height="280" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M40 110h220" stroke="#0f2240" stroke-width="2"/>
  <circle cx="150" cy="210" r="70" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="150" cy="210" r="54" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <!-- filter panel -->
  <rect x="190" y="312" width="56" height="28" rx="5" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <circle cx="218" cy="326" r="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- standpipe -->
  <rect x="330" y="120" width="26" height="230" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M282 350h120" stroke="#0f2240" stroke-width="2"/>
  <!-- hose -->
  <path d="M260 300c30 0 40-20 40-60v-110c0-20 20-24 38-10" fill="none" stroke="#1d5fae" stroke-width="5" stroke-linecap="round"/>
  <path d="M343 140v150" fill="none" stroke="#1d5fae" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#wwdp)"/>
  <!-- numbered markers -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="190" cy="250" r="12" fill="#d9442b"/><text x="190" y="255">1</text>
    <circle cx="218" cy="294" r="12" fill="#d9442b"/><text x="218" y="299">2</text>
    <circle cx="300" cy="200" r="12" fill="#d9442b"/><text x="300" y="205">3</text>
    <circle cx="372" cy="250" r="12" fill="#d9442b"/><text x="372" y="255">4</text>
  </g>
  <!-- labels -->
  <g font-size="14" fill="#14202c">
    <text x="410" y="86" font-weight="700">1. Tub</text>
    <text x="410" y="104" font-size="13" fill="#566475">Lid lock must engage first</text>
    <text x="410" y="146" font-weight="700">2. Filter and pump</text>
    <text x="410" y="164" font-size="13" fill="#566475">Lint, coins, socks</text>
    <text x="410" y="206" font-weight="700">3. Drain hose</text>
    <text x="410" y="224" font-size="13" fill="#566475">Kinks, lint, ice</text>
    <text x="410" y="266" font-weight="700">4. Standpipe or sink</text>
    <text x="410" y="284" font-size="13" fill="#566475">Lint clog in house drain</text>
  </g>
  <text x="40" y="380" font-size="12" fill="#566475">Front loader shown. Filter panel is at the bottom front on most models.</text>
</svg>
