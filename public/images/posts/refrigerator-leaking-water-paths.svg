<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="rlwp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where fridge water travels</text>
  <!-- floor and wall -->
  <path d="M20 398H620" stroke="#d5dee8" stroke-width="2"/>
  <path d="M420 350V398" stroke="#d5dee8" stroke-width="6"/>
  <!-- cabinet -->
  <rect x="160" y="56" width="220" height="330" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M160 170H380" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#d5dee8" stroke-width="2"><path d="M172 222H360M172 272H360"/></g>
  <!-- doors and gasket -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="138" y="56" width="20" height="112" rx="4"/><rect x="138" y="172" width="20" height="214" rx="4"/></g>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1"><rect x="157" y="60" width="6" height="104"/><rect x="157" y="176" width="6" height="206"/></g>
  <!-- crisper drawer -->
  <rect x="170" y="322" width="116" height="52" rx="6" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/>
  <!-- machine compartment -->
  <rect x="292" y="316" width="86" height="68" fill="#f3f6fa" stroke="#d5dee8" stroke-width="2"/>
  <circle cx="330" cy="340" r="14" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <rect x="300" y="362" width="74" height="14" rx="3" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <!-- evaporator coil and drain trough -->
  <path d="M352 76h18v10h-18v10h18v10h-18v10h18v10h-18v10h18" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <path d="M346 148h30l-8 12h-14z" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <!-- drain tube (defrost water) -->
  <path d="M368 162V358" fill="none" stroke="#1d5fae" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#rlwp)"/>
  <!-- ice maker -->
  <rect x="176" y="74" width="100" height="26" rx="5" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <!-- supply water line -->
  <path d="M414 376H388V368M388 354V64H226V72" fill="none" stroke="#1d5fae" stroke-width="2.5"/>
  <rect x="382" y="354" width="12" height="14" rx="2" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="414" y="370" width="12" height="12" rx="2" fill="#0f2240"/>
  <!-- leveling legs -->
  <g fill="#0f2240"><rect x="166" y="386" width="12" height="11"/><rect x="356" y="386" width="12" height="11"/></g>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1" fill="none">
    <path d="M392 80H434M372 112H434M378 154H434M372 250H434M396 360L434 330M428 376H434"/>
    <path d="M132 176H156"/>
    <path d="M172 398V410M337 376V410"/>
  </g>
  <!-- labels -->
  <g font-size="13" fill="#14202c">
    <text x="440" y="84">(3) Water line</text>
    <text x="440" y="116">Evaporator coil</text>
    <text x="440" y="158">(1) Defrost drain hole</text>
    <text x="440" y="254">Drain tube</text>
    <text x="440" y="334">(7) Water inlet valve</text>
    <text x="440" y="380">(3) Shutoff valve</text>
    <text x="128" y="180" text-anchor="end">(6) Door gasket</text>
    <text x="172" y="426" text-anchor="middle">(5) Leveling leg</text>
    <text x="337" y="426" text-anchor="middle">(2) Drain pan</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="226" y="91" fill="#14202c">(7) Ice maker</text>
    <text x="228" y="352" fill="#14202c">Crisper drawer</text>
    <text x="250" y="150" fill="#566475">Freezer</text>
    <text x="250" y="204" fill="#566475">Fresh food</text>
  </g>
  <!-- legend -->
  <g fill="none" stroke="#1d5fae" stroke-width="2.5"><path d="M440 412h24"/><path d="M530 412h24" stroke-dasharray="6 5"/></g>
  <g font-size="12" fill="#566475"><text x="470" y="416">Supply</text><text x="560" y="416">Defrost</text></g>
</svg>
