<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Plug-in outlet vs hardwired charger</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="52" width="284" height="320" rx="8"/>
    <rect x="332" y="52" width="284" height="320" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="166" y="78">Plug-in (NEMA 14-50)</text>
    <text x="474" y="78">Hardwired</text>
  </g>
  <!-- left illustration: panel, wire, outlet, plug, charger -->
  <g stroke="#0f2240" stroke-width="2">
    <rect x="44" y="100" width="40" height="60" rx="4" fill="#dfe9f7"/>
    <rect x="132" y="108" width="40" height="44" rx="6" fill="#fff"/>
    <rect x="220" y="96" width="60" height="72" rx="8" fill="#fff"/>
    <rect x="352" y="100" width="40" height="60" rx="4" fill="#dfe9f7"/>
    <rect x="528" y="96" width="60" height="72" rx="8" fill="#fff"/>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M84 130H132" stroke="#14202c"/>
    <path d="M172 130h18" stroke="#d9442b"/>
    <path d="M190 130h30" stroke="#14202c"/>
    <path d="M392 130H528" stroke="#14202c"/>
  </g>
  <rect x="178" y="122" width="16" height="16" rx="3" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <g stroke="#0f2240" stroke-width="2.5" stroke-linecap="round"><path d="M145 120l4 8M159 120l-4 8M152 136v6"/></g>
  <circle cx="250" cy="120" r="6" fill="#1d5fae"/><circle cx="558" cy="120" r="6" fill="#1d5fae"/>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="64" y="178">panel</text><text x="152" y="178">outlet</text><text x="250" y="186">charger</text>
    <text x="372" y="178">panel</text><text x="460" y="122">wired direct</text><text x="558" y="186">charger</text>
  </g>
  <line x1="44" y1="200" x2="288" y2="200" stroke="#d5dee8" stroke-width="2"/>
  <line x1="352" y1="200" x2="596" y2="200" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="14" fill="#14202c">
    <text x="44" y="228">50 A breaker</text>
    <text x="44" y="256" font-weight="700">Up to 40 A charging</text>
    <text x="44" y="284">Take the charger with you</text>
    <text x="44" y="312">Plug and outlet can wear</text>
    <text x="44" y="340">Often needs a GFCI breaker</text>
    <text x="352" y="228">Often a 60 A breaker</text>
    <text x="352" y="256" font-weight="700">Up to 48 A charging</text>
    <text x="352" y="284">No plug or outlet to wear</text>
    <text x="352" y="312">Better for outdoor installs</text>
    <text x="352" y="340">Stays with the house</text>
  </g>
  <rect x="24" y="386" width="592" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="411" font-size="13" fill="#14202c" text-anchor="middle">Either way: charging is limited to 80% of the breaker rating.</text>
</svg>
