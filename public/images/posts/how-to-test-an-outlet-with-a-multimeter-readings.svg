<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Three readings on a US 120 V outlet</text>
  <text x="24" y="54" font-size="13" fill="#566475">Outlet shown with the ground hole at the bottom</text>
  <rect x="245" y="70" width="150" height="220" rx="16" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="262" y="96" width="116" height="168" rx="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="7" stroke-linecap="round"><path d="M296 134v40"/><path d="M344 140v28"/></g>
  <path d="M310 212h20v10a10 10 0 0 1-20 0z" fill="#0f2240"/>
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M290 154H200"/><path d="M350 154H436"/><path d="M310 222H230"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="150" font-weight="700">Neutral</text><text x="24" y="168" font-size="13" fill="#566475">tall slot, white wire</text>
    <text x="444" y="150" font-weight="700">Hot</text><text x="444" y="168" font-size="13" fill="#566475">short slot, black wire</text>
    <text x="24" y="218" font-weight="700">Ground</text><text x="24" y="236" font-size="13" fill="#566475">round hole, green</text><text x="24" y="252" font-size="13" fill="#566475">or bare wire</text>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="314" width="180" height="84" rx="8"/><rect x="230" y="314" width="180" height="84" rx="8"/></g>
  <rect x="436" y="314" width="180" height="84" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="114" y="342" font-weight="700">Hot to neutral</text><text x="114" y="368" font-size="17" font-weight="700" fill="#1d5fae">about 120 V</text><text x="114" y="388" font-size="12" fill="#566475">short to tall slot</text>
    <text x="320" y="342" font-weight="700">Hot to ground</text><text x="320" y="368" font-size="17" font-weight="700" fill="#1d5fae">about 120 V</text><text x="320" y="388" font-size="12" fill="#566475">short slot to ground</text>
    <text x="526" y="342" font-weight="700">Neutral to ground</text><text x="526" y="368" font-size="17" font-weight="700" fill="#1f8a5b">near 0 V</text><text x="526" y="388" font-size="12" fill="#566475">tall slot to ground</text>
  </g>
</svg>
