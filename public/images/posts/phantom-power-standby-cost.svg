<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Yearly cost of always-on standby</text>
  <text x="24" y="54" font-size="13" fill="#566475">Example rate: 15 cents per kWh, 8,760 hours a year</text>
  <path d="M60 310H600" stroke="#d5dee8" stroke-width="2"/>
  <g fill="#1d5fae">
    <rect x="90" y="289" width="80" height="21" rx="3"/>
    <rect x="220" y="271" width="80" height="39" rx="3"/>
    <rect x="350" y="210" width="80" height="100" rx="3"/>
  </g>
  <rect x="480" y="110" width="80" height="200" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="130" y="279">about $7</text>
    <text x="260" y="261">about $13</text>
    <text x="390" y="200">about $33</text>
    <text x="520" y="100">about $66</text>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="130" y="330">5 W</text><text x="260" y="330">10 W</text><text x="390" y="330">25 W</text><text x="520" y="330">50 W</text>
  </g>
  <rect x="24" y="346" width="592" height="40" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="320" y="371" font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">Cost = watts × hours ÷ 1,000 × rate per kWh</text>
</svg>
