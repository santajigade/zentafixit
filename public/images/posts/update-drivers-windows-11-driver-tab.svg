<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Device Properties: the Driver tab</text>
  <rect x="60" y="54" width="520" height="344" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M60 92h520" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="13" fill="#566475"><text x="80" y="78">General</text><text x="250" y="78">Details</text><text x="326" y="78">Events</text></g>
  <rect x="150" y="60" width="80" height="32" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="190" y="81" font-size="13" font-weight="700" fill="#1d5fae" text-anchor="middle">Driver</text>
  <g font-size="13" fill="#14202c">
    <text x="84" y="124">Driver Provider:</text><text x="84" y="148">Driver Date:</text><text x="84" y="172">Driver Version:</text>
  </g>
  <g fill="#d5dee8"><rect x="214" y="113" width="140" height="14" rx="4"/><rect x="214" y="137" width="100" height="14" rx="4"/><rect x="214" y="161" width="120" height="14" rx="4"/></g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="84" y="198" width="180" height="32" rx="8"/>
    <rect x="84" y="236" width="180" height="32" rx="8"/>
    <rect x="84" y="312" width="180" height="32" rx="8"/>
    <rect x="84" y="350" width="180" height="32" rx="8"/>
  </g>
  <rect x="84" y="274" width="180" height="32" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="174" y="219">Driver Details</text>
    <text x="174" y="257">Update Driver</text>
    <text x="174" y="295" font-weight="700">Roll Back Driver</text>
    <text x="174" y="333">Disable Device</text>
    <text x="174" y="371">Uninstall Device</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="284" y="219">See the driver files</text>
    <text x="284" y="257">Look for a newer driver</text>
    <text x="284" y="295" fill="#14202c" font-weight="700">Go back to the previous driver</text>
    <text x="284" y="333">Turn the device off for now</text>
    <text x="284" y="371">Remove it, reinstalls on restart</text>
  </g>
</svg>
