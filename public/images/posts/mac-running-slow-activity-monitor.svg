<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Reading Activity Monitor</text>
  <!-- window -->
  <rect x="24" y="52" width="592" height="236" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M24 92H616" stroke="#d5dee8" stroke-width="2"/>
  <g fill="#d5dee8"><circle cx="44" cy="72" r="6"/><circle cx="62" cy="72" r="6"/><circle cx="80" cy="72" r="6"/></g>
  <g stroke-width="2"><rect x="120" y="60" width="70" height="24" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a"/><rect x="198" y="60" width="86" height="24" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a"/><rect x="292" y="60" width="74" height="24" rx="6" fill="#fff" stroke="#d5dee8"/><rect x="374" y="60" width="62" height="24" rx="6" fill="#fff" stroke="#d5dee8"/><rect x="444" y="60" width="90" height="24" rx="6" fill="#fff" stroke="#d5dee8"/></g>
  <g font-size="13" fill="#14202c" text-anchor="middle"><text x="155" y="77" font-weight="700">CPU</text><text x="241" y="77" font-weight="700">Memory</text><text x="329" y="77">Energy</text><text x="405" y="77">Disk</text><text x="489" y="77">Network</text></g>
  <!-- process list -->
  <g font-size="13" fill="#14202c">
    <text x="44" y="116" font-weight="700">Process name</text><text x="440" y="116" font-weight="700">% CPU, sorted</text>
    <text x="44" y="142">Busy app or browser tab</text><text x="440" y="142" fill="#d9442b" font-weight="700">high for minutes</text>
    <text x="44" y="166">mds_stores (Spotlight)</text><text x="440" y="166" fill="#566475">busy after updates</text>
    <text x="44" y="190">Other apps</text><text x="440" y="190" fill="#566475">low</text>
  </g>
  <g stroke="#d5dee8" stroke-width="1"><path d="M40 124H600"/><path d="M40 150H600"/><path d="M40 174H600"/></g>
  <!-- memory pressure -->
  <text x="44" y="222" font-size="13" font-weight="700" fill="#14202c">Memory Pressure (Memory tab)</text>
  <rect x="44" y="234" width="180" height="36" rx="4" fill="#1f8a5b"/>
  <rect x="224" y="234" width="120" height="36" fill="#ffd23f"/>
  <rect x="344" y="234" width="80" height="36" rx="4" fill="#d9442b"/>
  <g font-size="13" font-weight="700" text-anchor="middle"><text x="134" y="257" fill="#fff">Green</text><text x="284" y="257" fill="#14202c">Yellow</text><text x="384" y="257" fill="#fff">Red</text></g>
  <!-- notes -->
  <g font-size="14" fill="#14202c">
    <text x="24" y="320" font-weight="700" fill="#1f8a5b">Green:</text><text x="84" y="320">memory is fine. Look at CPU, storage and login items.</text>
    <text x="24" y="346" font-weight="700" fill="#0f2240">Yellow:</text><text x="90" y="346">memory is tight. Close tabs and apps you don't need.</text>
    <text x="24" y="372" font-weight="700" fill="#d9442b">Red:</text><text x="66" y="372">the Mac is swapping to the drive and will feel slow.</text>
  </g>
  <rect x="24" y="390" width="592" height="36" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="40" y="413" font-size="13" fill="#14202c">Only force quit apps you recognize. Many processes are part of macOS.</text>
</svg>
