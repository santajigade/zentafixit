<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="imflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">No ice: where to start</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="54" width="340" height="44" rx="8"/>
    <rect x="150" y="124" width="340" height="44" rx="8"/>
    <path d="M320 192l160 38-160 38-160-38z"/>
    <rect x="20" y="300" width="190" height="44" rx="8"/>
    <rect x="225" y="300" width="190" height="44" rx="8"/>
    <rect x="430" y="300" width="190" height="44" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="20" y="360" width="190" height="68" rx="8"/><rect x="225" y="360" width="190" height="68" rx="8"/><rect x="430" y="360" width="190" height="68" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#imflow)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M160 230H115v68"/><path d="M320 268v30"/><path d="M480 230h45v68"/><path d="M115 344v14"/><path d="M320 344v14"/><path d="M525 344v14"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Ice maker on, freezer at 0 °F</text>
    <text x="320" y="151">2. Wait a few hours, then look</text>
    <text x="320" y="235" font-weight="700">What do you see?</text>
    <text x="115" y="327">No water at the door</text>
    <text x="320" y="327">Water works, no ice</text>
    <text x="525" y="327">Ice stuck in mold</text>
    <text x="115" y="384" font-weight="700">Causes 3 to 5</text>
    <text x="320" y="384" font-weight="700">Causes 6 and 7</text>
    <text x="525" y="384" font-weight="700">Cause 8</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="115" y="402">supply valve, line,</text><text x="115" y="416">filter, water pressure</text>
    <text x="320" y="402">frozen fill tube,</text><text x="320" y="416">jammed ice in the bin</text>
    <text x="525" y="402">ice maker module</text><text x="525" y="416">or inlet valve</text>
  </g>
</svg>
