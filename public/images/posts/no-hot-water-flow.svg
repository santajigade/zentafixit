<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What to check first, by heater type</text>
  <!-- headers -->
  <g fill="#0f2240"><rect x="20" y="52" width="180" height="36" rx="8"/><rect x="230" y="52" width="180" height="36" rx="8"/><rect x="440" y="52" width="180" height="36" rx="8"/></g>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><text x="110" y="75">Electric tank</text><text x="320" y="75">Gas tank</text><text x="530" y="75">Tankless</text></g>
  <!-- electric icon -->
  <rect x="88" y="112" width="44" height="80" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M110 112V100h20" fill="none" stroke="#0f2240" stroke-width="2"/>
  <path d="M114 132l-10 18h8l-6 16 14-22h-8l6-12z" fill="#ffd23f" stroke="#c9a10a" stroke-width="1"/>
  <!-- gas icon -->
  <rect x="298" y="112" width="44" height="80" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M320 112V98" stroke="#0f2240" stroke-width="5"/>
  <path d="M320 156c8 10 10 16 10 21a10 10 0 0 1-20 0c0-5 2-11 10-21z" fill="#d9442b"/>
  <!-- tankless icon -->
  <rect x="504" y="112" width="52" height="64" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="516" y="124" width="28" height="14" rx="3" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <g stroke="#0f2240" stroke-width="3"><path d="M518 176v18M530 176v18M542 176v18"/></g>
  <!-- check lists -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="20" y="210" width="180" height="140" rx="8"/><rect x="230" y="210" width="180" height="140" rx="8"/><rect x="440" y="210" width="180" height="140" rx="8"/></g>
  <g font-size="13" fill="#14202c">
    <text x="34" y="238">1. Breaker (240 V)</text><text x="34" y="264">2. Red reset button</text><text x="34" y="290">3. Heating elements</text>
    <text x="34" y="330" fill="#d9442b" font-weight="700">Breaker off first</text>
    <text x="244" y="238">1. Gas valve and knob</text><text x="244" y="264">2. Pilot or igniter</text><text x="244" y="290">3. Thermocouple</text>
    <text x="244" y="330" fill="#d9442b" font-weight="700">Smell gas? Leave.</text>
    <text x="454" y="238">1. Error code</text><text x="454" y="264">2. Power and gas</text><text x="454" y="290">3. Flow, inlet filter</text>
    <text x="454" y="330" fill="#566475">Descale if it's due</text>
  </g>
  <rect x="20" y="364" width="600" height="40" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="389" font-size="14" fill="#14202c" text-anchor="middle">All types: check sediment and the temperature setting</text>
</svg>
