<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="sps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why you can hear it but not see it</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="60" width="190" height="52" rx="8"/>
    <rect x="240" y="60" width="160" height="52" rx="8"/>
    <rect x="470" y="60" width="150" height="52" rx="8"/>
    <rect x="240" y="170" width="160" height="52" rx="8"/>
    <rect x="240" y="280" width="160" height="52" rx="8"/>
    <rect x="470" y="280" width="150" height="52" rx="8"/>
  </g>
  <rect x="470" y="170" width="150" height="52" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="20" y="170" width="190" height="52" rx="8"/>
    <rect x="20" y="272" width="190" height="68" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#sps)">
    <path d="M210 86h28"/>
    <path d="M400 86h68"/>
    <path d="M320 112v56"/>
    <path d="M400 196h68"/>
    <path d="M400 306h68"/>
    <path d="M545 280v-56"/>
  </g>
  <g fill="none" stroke="#d9442b" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M210 196h30"/><path d="M210 306h30"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="115" y="82" font-weight="700">Source or app</text><text x="115" y="100" font-size="12" fill="#566475">box, stick, console</text>
    <text x="320" y="82" font-weight="700">Main board</text><text x="320" y="100" font-size="12" fill="#566475">splits the signal</text>
    <text x="545" y="82" font-weight="700">Speakers</text><text x="545" y="100" font-size="12" fill="#566475">sound still works</text>
    <text x="320" y="192" font-weight="700">T-con board</text><text x="320" y="210" font-size="12" fill="#566475">drives the panel</text>
    <text x="545" y="192" font-weight="700">LCD panel</text><text x="545" y="210" font-size="12" fill="#566475">makes the picture</text>
    <text x="320" y="302" font-weight="700">Power board</text><text x="320" y="320" font-size="12" fill="#566475">feeds all boards</text>
    <text x="545" y="302" font-weight="700">Backlight LEDs</text><text x="545" y="320" font-size="12" fill="#566475">light the panel</text>
    <text x="567" y="256" font-size="12" fill="#566475" text-anchor="start">light</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="115" y="192">T-con fault: lines,</text><text x="115" y="210">half screen or black</text>
    <text x="115" y="294">Backlight or power</text><text x="115" y="312">board fault: faint</text><text x="115" y="330">image in flashlight</text>
  </g>
  <line x1="24" y1="360" x2="616" y2="360" stroke="#d5dee8" stroke-width="1.5"/>
  <g font-size="13" fill="#566475">
    <text x="24" y="384">OLED TVs have no backlight. Each pixel makes its own light,</text>
    <text x="24" y="403">so the flashlight test does not apply to them.</text>
  </g>
</svg>
