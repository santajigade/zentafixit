<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="300" fill="#f3f6fa"/>
  <defs><marker id="rws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Swap the filter in four steps</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="54" width="134" height="200" rx="8"/>
    <rect x="176" y="54" width="134" height="200" rx="8"/>
    <rect x="328" y="54" width="134" height="200" rx="8"/>
    <rect x="480" y="54" width="134" height="200" rx="8"/>
  </g>
  <!-- step 1: old filter with turn arrow -->
  <rect x="66" y="88" width="50" height="86" rx="10" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <path d="M56 110a36 36 0 0 1 70 0" fill="none" stroke="#d9442b" stroke-width="2.5" marker-end="url(#rws)"/>
  <!-- step 2: new filter and cap -->
  <rect x="218" y="96" width="50" height="78" rx="10" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="228" y="76" width="30" height="14" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- step 3: push and turn in -->
  <rect x="370" y="98" width="50" height="76" rx="10" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <path d="M395 92v-18" fill="none" stroke="#0f2240" stroke-width="2.5" marker-end="url(#rws)"/>
  <path d="M432 150a36 36 0 0 1-74 0" fill="none" stroke="#1f8a5b" stroke-width="2.5" marker-end="url(#rws)"/>
  <!-- step 4: glass under dispenser -->
  <rect x="520" y="80" width="54" height="30" rx="4" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <g fill="#1d5fae"><circle cx="547" cy="122" r="3"/><circle cx="547" cy="134" r="3"/></g>
  <path d="M525 144h44l-6 36h-32z" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g font-size="14" fill="#14202c" text-anchor="middle" font-weight="700">
    <text x="91" y="206">1. Remove</text>
    <text x="243" y="206">2. Uncap</text>
    <text x="395" y="206">3. Install</text>
    <text x="547" y="206">4. Flush</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="91" y="226">quarter turn or</text><text x="91" y="242">release button</text>
    <text x="243" y="226">check the shape</text><text x="243" y="242">matches the old one</text>
    <text x="395" y="226">push in, turn</text><text x="395" y="242">until it locks</text>
    <text x="547" y="226">run a few gallons,</text><text x="547" y="242">then reset light</text>
  </g>
  <text x="24" y="282" font-size="13" fill="#14202c">Keep a towel under the filter. A little water spills when the old one comes out.</text>
</svg>
