<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="dc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Extender, mesh or something else?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="140" y="54" width="330" height="44" rx="8"/>
    <rect x="140" y="130" width="330" height="44" rx="8"/>
    <rect x="140" y="206" width="330" height="44" rx="8"/>
  </g>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="500" y="54" width="116" height="44" rx="8"/>
    <rect x="500" y="122" width="116" height="60" rx="8"/>
    <rect x="500" y="198" width="116" height="60" rx="8"/>
  </g>
  <rect x="140" y="282" width="330" height="44" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#dc-a)">
    <path d="M305 98v30"/><path d="M305 174v30"/><path d="M305 250v30"/>
    <path d="M470 76h28"/><path d="M470 152h28"/><path d="M470 228h28"/>
  </g>
  <g font-size="12" fill="#566475">
    <text x="313" y="118">yes</text><text x="313" y="194">no</text><text x="313" y="270">no</text>
    <text x="474" y="70">no</text><text x="474" y="146">yes</text><text x="474" y="222">yes</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="305" y="81">1. Move the router first. Still weak?</text>
    <text x="305" y="157">2. Ethernet or coax near the weak spot?</text>
    <text x="305" y="233">3. Just one room or a small dead zone?</text>
    <text x="305" y="309" font-weight="700">Several weak rooms or floors: mesh</text>
    <text x="558" y="81">You're done</text>
    <text x="558" y="148">Access point</text><text x="558" y="166">or wired mesh</text>
    <text x="558" y="224" font-weight="700">Extender</text><text x="558" y="242" font-size="12">budget fix</text>
  </g>
  <rect x="24" y="342" width="592" height="44" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="320" y="369" font-size="12" fill="#14202c" text-anchor="middle"><tspan font-weight="700">ISP router?</tspan> Put one device in bridge or access point mode to avoid double NAT.</text>
</svg>
