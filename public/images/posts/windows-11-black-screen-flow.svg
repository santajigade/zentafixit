<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="w11f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Black screen: what can you see?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="54" width="340" height="44" rx="8"/>
    <rect x="150" y="124" width="340" height="44" rx="8"/>
    <path d="M320 192l140 38-140 38-140-38z"/>
    <rect x="20" y="300" width="190" height="44" rx="8"/>
    <rect x="225" y="300" width="190" height="44" rx="8"/>
    <rect x="430" y="300" width="190" height="44" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="20" y="360" width="190" height="68" rx="8"/><rect x="225" y="360" width="190" height="68" rx="8"/><rect x="430" y="360" width="190" height="68" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#w11f)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M180 230H115v68"/><path d="M320 268v30"/><path d="M460 230h65v68"/><path d="M115 344v14"/><path d="M320 344v14"/><path d="M525 344v14"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Power lights or fans on? Check cable</text>
    <text x="320" y="151">2. Press Win + Ctrl + Shift + B</text>
    <text x="320" y="235" font-weight="700">Still black. You see:</text>
    <text x="115" y="327">Only a cursor</text>
    <text x="320" y="327">Logo, then black</text>
    <text x="525" y="327">No logo at all</text>
    <text x="115" y="384" font-weight="700">Fix 4</text>
    <text x="320" y="384" font-weight="700">Fixes 5 to 7</text>
    <text x="525" y="384" font-weight="700">Hardware checks</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="115" y="402">restart Windows</text><text x="115" y="416">Explorer</text>
    <text x="320" y="402">Safe Mode, driver,</text><text x="320" y="416">update, Fast Startup</text>
    <text x="525" y="402">USB devices, beeps,</text><text x="525" y="416">screen or backlight</text>
  </g>
</svg>
