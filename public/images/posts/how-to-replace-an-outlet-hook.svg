<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <defs><marker id="hookArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Hook the wire clockwise under the screw</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="192" height="180" rx="8"/>
    <rect x="224" y="56" width="192" height="180" rx="8"/>
    <rect x="424" y="56" width="192" height="180" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="38" y="82" font-weight="700">1. Strip about 3/4 in</text><text x="38" y="100" font-size="12" fill="#566475">check the strip gauge</text>
    <text x="238" y="82" font-weight="700">2. Bend a hook</text><text x="238" y="100" font-size="12" fill="#566475">with needle-nose pliers</text>
    <text x="438" y="82" font-weight="700">3. Wrap it clockwise</text><text x="438" y="100" font-size="12" fill="#566475">around the screw</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M44 165H140" stroke="#14202c" stroke-width="10"/><path d="M140 165H196" stroke="#c9a10a" stroke-width="4"/>
    <path d="M244 160H330" stroke="#14202c" stroke-width="10"/><path d="M330 160H366a16 16 0 0 1 0 32H350" stroke="#c9a10a" stroke-width="4"/>
    <path d="M440 143H486" stroke="#14202c" stroke-width="10"/><path d="M486 143H520A22 22 0 1 1 498 165" stroke="#c9a10a" stroke-width="4"/>
  </g>
  <circle cx="520" cy="165" r="15" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <path d="M510 165H530" stroke="#0f2240" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M554 141A34 34 0 0 1 554 189" fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#hookArrow)"/>
  <g stroke-width="2">
    <rect x="24" y="252" width="288" height="76" rx="8" fill="#fff" stroke="#1f8a5b"/>
    <rect x="328" y="252" width="288" height="76" rx="8" fill="#fff" stroke="#d9442b"/>
  </g>
  <path d="M42 290l7 8 14-16" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M347 282l14 16M361 282l-14 16" fill="none" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <g font-size="13" fill="#14202c">
    <text x="76" y="284" font-weight="700">Right: clockwise</text><text x="76" y="304" fill="#566475">tightening pulls the wire in</text>
    <text x="378" y="284" font-weight="700">Wrong: counterclockwise</text><text x="378" y="304" fill="#566475">tightening pushes it out</text>
  </g>
  <text x="24" y="356" font-size="13" fill="#566475">One wire per screw. Join extra wires with a pigtail and a wire connector.</text>
</svg>
