  <g stroke="#1d5fae" stroke-width="2"><path d="M82 212h80M82 226h60M82 240h70"/></g>
  <rect x="198" y="210" width="52" height="22" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
