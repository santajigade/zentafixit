    <text x="24" y="346"><tspan font-weight="700">A</tspan>  Contacts: clean and straight</text>
    <text x="24" y="368"><tspan font-weight="700">B</tspan>  Label: voltage and platform</text>
    <text x="24" y="390"><tspan font-weight="700">C</tspan>  Latch: clicks fully home</text>
