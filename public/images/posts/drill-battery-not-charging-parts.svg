  <g fill="#d5dee8" stroke="#0f2240" stroke-width="1.5"><rect x="430" y="182" width="14" height="16" rx="2"/><rect x="463" y="182" width="14" height="16" rx="2"/><rect x="496" y="182" width="14" height="16" rx="2"/></g>
  <rect x="340" y="200" width="260" height="90" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="374" cy="236" r="9" fill="#1f8a5b" stroke="#0f2240" stroke-width="1.5"/>
  <g stroke="#566475" stroke-width="3" stroke-linecap="round"><path d="M480 226v40M494 226v40M508 226v40M522 226v40M536 226v40M550 226v40M564 226v40"/></g>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"><circle cx="252" cy="134" r="11"/><circle cx="125" cy="268" r="11"/><circle cx="224" cy="252" r="11"/><circle cx="374" cy="266" r="11"/><circle cx="522" cy="306" r="11"/><circle cx="582" cy="170" r="11"/></g>
