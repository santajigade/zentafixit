  <rect x="85" y="120" width="150" height="50" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#d5dee8" stroke="#0f2240" stroke-width="1.5"><rect x="118" y="128" width="16" height="30" rx="2"/><rect x="152" y="128" width="16" height="30" rx="2"/><rect x="186" y="128" width="16" height="30" rx="2"/></g>
  <rect x="50" y="170" width="220" height="110" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
