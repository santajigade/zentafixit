<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a thermostat gets its power</text>
  <rect x="24" y="60" width="430" height="290" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <text x="40" y="82" font-size="12" fill="#566475">Inside the furnace or air handler</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="40" y="100" width="120" height="50" rx="8"/>
    <rect x="182" y="100" width="120" height="50" rx="8"/>
    <rect x="324" y="100" width="120" height="50" rx="8"/>
    <rect x="324" y="186" width="120" height="50" rx="8"/>
    <rect x="182" y="186" width="120" height="50" rx="8"/>
    <rect x="40" y="186" width="120" height="50" rx="8"/>
    <rect x="490" y="160" width="126" height="120" rx="12"/>
  </g>
  <rect x="504" y="176" width="98" height="56" rx="6" fill="#0f2240"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pp)">
    <path d="M160 125h20"/><path d="M302 125h20"/><path d="M384 150v34"/><path d="M324 211h-20"/><path d="M182 211h-20"/>
  </g>
  <path d="M100 236v60h380V200h8" fill="none" stroke="#d9442b" stroke-width="2.5" marker-end="url(#pp)"/>
  <path d="M488 250h-24v66H60v-78" fill="none" stroke="#1d5fae" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="100" y="122">Breaker and</text><text x="100" y="139">service switch</text>
    <text x="242" y="122">Door switch</text><text x="242" y="139" font-size="12" fill="#566475">door closed?</text>
    <text x="384" y="122">Transformer</text><text x="384" y="139" font-size="12" fill="#566475">120 V to 24 V</text>
    <text x="384" y="208">Board fuse</text><text x="384" y="225" font-size="12" fill="#566475">blown?</text>
    <text x="242" y="208">Float switch</text><text x="242" y="225" font-size="12" fill="#566475">water in pan?</text>
    <text x="100" y="208">R terminal</text><text x="100" y="225" font-size="12" fill="#566475">24 V out</text>
    <text x="553" y="262">Thermostat</text>
  </g>
  <g font-size="12">
    <text x="200" y="288" fill="#d9442b">R wire (power)</text>
    <text x="200" y="336" fill="#1d5fae">C wire (common return)</text>
  </g>
  <text x="24" y="378" font-size="13" fill="#566475">Battery thermostats skip this path. Some float switches are wired</text>
  <text x="24" y="396" font-size="13" fill="#566475">differently, so check your system. Exact parts vary by model.</text>
</svg>
