  </g>
  <g text-anchor="middle" fill="#14202c">
    <text x="228" y="256" font-size="13" font-weight="700">Type 1</text><text x="228" y="274" font-size="12" fill="#566475">line side</text>
    <text x="385" y="256" font-size="13" font-weight="700">Type 2</text><text x="385" y="274" font-size="12" fill="#566475">in the panel</text>
    <text x="551" y="256" font-size="13" font-weight="700">Type 3</text><text x="551" y="274" font-size="12" fill="#566475">at the device</text>
