    <path d="M136 160h34"/><path d="M284 160h34"/><path d="M450 160h34"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="80" y="157">Utility</text><text x="80" y="175">power line</text>
    <text x="228" y="182">Meter</text>
    <text x="551" y="157">Plug-in strip</text><text x="551" y="175">at TV or PC</text>
  </g>
  <text x="385" y="216" font-size="14" fill="#14202c" text-anchor="middle">Main panel</text>
  <text x="60" y="96" font-size="12" fill="#d9442b">Surges come in</text>
