    <rect x="172" y="130" width="112" height="60" rx="8"/>
    <rect x="320" y="120" width="130" height="80" rx="8"/>
    <rect x="486" y="130" width="130" height="60" rx="8"/>
  </g>
  <circle cx="228" cy="153" r="11" fill="#dfe9f7" stroke="#0f2240" stroke-width="1.5"/>
  <g fill="#dfe9f7" stroke="#0f2240" stroke-width="1.5"><rect x="334" y="134" width="40" height="8" rx="2"/><rect x="334" y="148" width="40" height="8" rx="2"/><rect x="334" y="162" width="40" height="8" rx="2"/><rect x="396" y="134" width="40" height="8" rx="2"/><rect x="396" y="148" width="40" height="8" rx="2"/></g>
  <rect x="396" y="162" width="40" height="24" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
