  <text x="340" y="354" font-size="13" fill="#14202c">Surge energy goes to ground</text>
  <text x="24" y="398" font-size="12" fill="#566475">Many devices are listed Type 1 or Type 2 and can go in the panel. Your electrician picks the spot.</text>
