<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <defs><marker id="ccf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Start with a wired test</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="190" y="54" width="260" height="44" rx="8"/>
    <rect x="190" y="124" width="260" height="44" rx="8"/>
    <path d="M320 192l120 36-120 36-120-36z"/>
    <rect x="30" y="296" width="260" height="56" rx="8"/>
    <rect x="350" y="296" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="366" width="260" height="48" rx="8"/><rect x="350" y="366" width="260" height="48" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#ccf)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M200 228H160v66"/><path d="M440 228h40v66"/><path d="M160 352v12"/><path d="M480 352v12"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Charge it or fit new batteries</text>
    <text x="320" y="151">2. Plug in with a USB data cable</text>
    <text x="320" y="233" font-weight="700">PC detects it?</text>
    <text x="180" y="219" font-size="12" fill="#566475">yes</text><text x="462" y="219" font-size="12" fill="#566475">no</text>
    <text x="160" y="320">Controller is fine, the</text><text x="160" y="338">wireless pairing is not</text>
    <text x="480" y="320">Try another cable</text><text x="480" y="338">and another USB port</text>
    <text x="160" y="388" font-weight="700">Remove it, pair again</text><text x="160" y="404" font-size="12">causes 2 to 5</text>
    <text x="480" y="388" font-weight="700">Still nothing? Reset it</text><text x="480" y="404" font-size="12">causes 1, 6 and 8</text>
  </g>
</svg>
