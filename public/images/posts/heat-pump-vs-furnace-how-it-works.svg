<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="hpfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How each system makes heat</text>
  <path d="M320 56V388" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="165" y="72" fill="#1d5fae">Heat pump: moves heat</text>
    <text x="475" y="72" fill="#d9442b">Gas furnace: burns fuel</text>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="40" y="88" width="250" height="44" rx="8"/>
    <rect x="40" y="162" width="250" height="44" rx="8"/>
    <rect x="40" y="236" width="250" height="44" rx="8"/>
    <rect x="350" y="88" width="250" height="44" rx="8"/>
    <rect x="350" y="162" width="250" height="44" rx="8"/>
    <rect x="350" y="236" width="250" height="44" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="40" y="310" width="250" height="44" rx="8"/>
    <rect x="350" y="310" width="250" height="44" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#hpfa)">
    <path d="M165 132v28"/><path d="M165 206v28"/><path d="M165 280v28"/>
    <path d="M475 132v28"/><path d="M475 206v28"/><path d="M475 280v28"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="165" y="115">Outdoor coil absorbs heat</text>
    <text x="165" y="189">Compressor concentrates it</text>
    <text x="165" y="263">Indoor coil releases heat</text>
    <text x="165" y="337" font-weight="700">Warm air goes to rooms</text>
    <text x="475" y="115">Gas burner makes a flame</text>
    <text x="475" y="189">Heat exchanger gets hot</text>
    <text x="475" y="263">Blower pushes air past it</text>
    <text x="475" y="337" font-weight="700">Hot air goes to rooms</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="165" y="378">Runs on electricity. No flame.</text>
    <text x="475" y="378">Exhaust gases vent outside.</text>
  </g>
</svg>
