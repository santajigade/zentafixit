<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="w11r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Getting to the Windows recovery screen</text>
  <rect x="20" y="50" width="600" height="44" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="320" y="77" font-size="14" fill="#14202c" text-anchor="middle">Turn on, hold power at the logo to turn off. Repeat 2 or 3 times.</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="124" width="180" height="44" rx="8"/><rect x="230" y="124" width="180" height="44" rx="8"/><rect x="440" y="124" width="180" height="44" rx="8"/>
    <rect x="230" y="216" width="180" height="84" rx="8"/><rect x="440" y="216" width="180" height="84" rx="8"/>
  </g>
  <rect x="20" y="216" width="180" height="84" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#w11r)">
    <path d="M110 94v28"/><path d="M200 146h28"/><path d="M410 146h28"/>
    <path d="M530 168v12H110v34"/><path d="M320 180v34"/><path d="M530 180v34"/>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="110" y="151">Advanced options</text>
    <text x="320" y="151">Troubleshoot</text>
    <text x="530" y="151">Advanced options</text>
    <text x="110" y="242">Startup Settings</text>
    <text x="320" y="242">Uninstall Updates</text>
    <text x="530" y="242">System Restore</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="110" y="264">Restart, then press</text><text x="110" y="280">4 for Safe Mode</text>
    <text x="320" y="264">latest quality or</text><text x="320" y="280">feature update</text>
    <text x="530" y="264">go back to an</text><text x="530" y="280">earlier restore point</text>
  </g>
  <text x="24" y="340" font-size="13" fill="#566475">The first screen says Preparing Automatic Repair, then offers</text>
  <text x="24" y="358" font-size="13" fill="#566475">Advanced options. None of these options delete your personal files.</text>
  <text x="24" y="376" font-size="13" fill="#566475">Menu names can differ slightly between Windows versions.</text>
</svg>
