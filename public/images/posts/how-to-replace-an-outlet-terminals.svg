<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Which wire goes on which screw</text>
  <text x="24" y="54" font-size="13" fill="#566475">Standard outlet, side terminals (simplified)</text>
  <rect x="250" y="76" width="140" height="270" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="254" y="172" width="10" height="46" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"><rect x="298" y="186" width="14" height="22" rx="3"/><rect x="328" y="186" width="14" height="22" rx="3"/></g>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M40 130H252" stroke="#14202c"/><path d="M40 260H252" stroke="#14202c"/>
    <path d="M388 130H600M388 260H600" stroke="#566475" stroke-width="8"/><path d="M388 130H600M388 260H600" stroke="#fff" stroke-width="5"/>
    <path d="M320 338V420" stroke="#1f8a5b"/>
  </g>
  <g stroke="#0f2240" stroke-width="2">
    <circle cx="262" cy="130" r="10" fill="#ffd23f"/><circle cx="262" cy="260" r="10" fill="#ffd23f"/>
    <circle cx="378" cy="130" r="10" fill="#fff"/><circle cx="378" cy="260" r="10" fill="#fff"/>
    <circle cx="320" cy="328" r="9" fill="#1f8a5b"/>
  </g>
  <g stroke="#566475" stroke-width="1.5"><path d="M224 195H252"/><path d="M436 197H346"/></g>
  <g font-size="13" fill="#14202c">
    <text x="40" y="118" font-weight="700">Hot in (black)</text><text x="40" y="152" fill="#566475">to a brass screw</text>
    <text x="40" y="190" font-weight="700">Connecting tab</text><text x="40" y="208" fill="#566475">broken on split outlets</text>
    <text x="40" y="248" font-weight="700">Hot out (black)</text><text x="40" y="282" fill="#566475">to next outlet, if any</text>
    <text x="600" y="118" font-weight="700" text-anchor="end">Neutral in (white)</text><text x="600" y="152" fill="#566475" text-anchor="end">to a silver screw</text>
    <text x="600" y="190" font-weight="700" text-anchor="end">Push-in holes</text><text x="600" y="208" fill="#566475" text-anchor="end">avoid, use screws</text>
    <text x="600" y="248" font-weight="700" text-anchor="end">Neutral out (white)</text><text x="600" y="282" fill="#566475" text-anchor="end">to next outlet, if any</text>
    <text x="336" y="372" font-weight="700">Green screw: ground</text><text x="336" y="390" fill="#566475">bare copper or green wire</text>
  </g>
  <line x1="24" y1="404" x2="300" y2="404" stroke="#d5dee8"/>
  <g font-size="13" fill="#14202c">
    <text x="24" y="422" font-weight="700">Photo first. One wire per screw.</text>
  </g>
</svg>
