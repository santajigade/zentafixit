<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <defs><marker id="iso" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How Optimize iPhone Storage works</text>
  <!-- phone -->
  <rect x="60" y="70" width="150" height="260" rx="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5">
    <rect x="80" y="100" width="50" height="50" rx="4"/><rect x="140" y="100" width="50" height="50" rx="4"/>
    <rect x="80" y="160" width="50" height="50" rx="4"/><rect x="140" y="160" width="50" height="50" rx="4"/>
    <rect x="80" y="220" width="50" height="50" rx="4"/><rect x="140" y="220" width="50" height="50" rx="4"/>
  </g>
  <!-- cloud -->
  <path d="M420 190a40 40 0 0 1 12-78a56 56 0 0 1 104 8a36 36 0 0 1 10 70z" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="448" y="138" width="36" height="36" rx="4"/><rect x="492" y="138" width="36" height="36" rx="4"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#iso)">
    <path d="M220 140C290 110 340 110 400 130"/>
    <path d="M400 200C340 230 290 230 220 210"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="310" y="104">Originals upload to iCloud</text>
    <text x="300" y="248">Original downloads when</text><text x="300" y="264">you open a photo</text>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="60" y="352" font-weight="700">iPhone: smaller versions</text>
    <text x="400" y="230" font-weight="700">iCloud: full originals</text>
    <text x="400" y="248" font-size="12" fill="#566475">needs enough iCloud space</text>
  </g>
  <rect x="380" y="290" width="236" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="498" y="314" font-size="13" fill="#14202c" text-anchor="middle">Settings &gt; Photos &gt;</text>
  <text x="498" y="332" font-size="13" fill="#14202c" text-anchor="middle">Optimize iPhone Storage</text>
</svg>
