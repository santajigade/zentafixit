<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="sbt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Three ways a smart bulb connects</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="58" width="186" height="240" rx="8"/>
    <rect x="227" y="58" width="186" height="240" rx="8"/>
    <rect x="430" y="58" width="186" height="240" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f2240" text-anchor="middle">
    <text x="117" y="84">Wi-Fi bulb</text>
    <text x="320" y="84">Zigbee or Thread</text>
    <text x="523" y="84">Bluetooth bulb</text>
  </g>
  <!-- boxes for devices -->
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="2">
    <rect x="62" y="104" width="110" height="36" rx="8"/>
    <rect x="265" y="104" width="110" height="36" rx="8"/>
    <rect x="265" y="166" width="110" height="36" rx="8"/>
    <rect x="468" y="104" width="110" height="36" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="62" y="228" width="110" height="36" rx="8"/>
    <rect x="265" y="228" width="110" height="36" rx="8"/>
    <rect x="468" y="228" width="110" height="36" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#sbt)">
    <path d="M117 226v-84"/><path d="M320 226v-22"/><path d="M320 164v-22"/><path d="M523 226v-84"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="117" y="127">Router</text>
    <text x="320" y="127">Router</text>
    <text x="320" y="189">Hub or bridge</text>
    <text x="523" y="127">Your phone</text>
    <text x="117" y="251">Bulb</text><text x="320" y="251">Bulb</text><text x="523" y="251">Bulb</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="117" y="182">2.4 GHz Wi-Fi</text>
    <text x="117" y="286">no hub needed</text>
    <text x="320" y="286">hub must be online</text>
    <text x="523" y="182">short range</text>
    <text x="523" y="286">stay nearby</text>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="24" y="332">Matter bulbs can use Wi-Fi or Thread, and Thread needs a border router</text>
    <text x="24" y="352">(a compatible hub or smart speaker). The box or app tells you which.</text>
    <text x="24" y="380" fill="#566475" font-size="12">Whichever type, the bulb needs constant power from the wall switch.</text>
  </g>
</svg>
