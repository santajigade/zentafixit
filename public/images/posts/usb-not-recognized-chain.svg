<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="300" fill="#f3f6fa"/>
  <defs><marker id="usbchain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Every link in the chain must work</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="26" y="60" width="100" height="50" rx="8"/>
    <rect x="148" y="60" width="100" height="50" rx="8"/>
    <rect x="270" y="60" width="100" height="50" rx="8" stroke-dasharray="6 4"/>
    <rect x="392" y="60" width="100" height="50" rx="8"/>
    <rect x="514" y="60" width="100" height="50" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#usbchain)">
    <path d="M127 85h19"/><path d="M249 85h19"/><path d="M371 85h19"/><path d="M493 85h19"/>
  </g>
  <g font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="76" y="90">Device</text><text x="198" y="90">Cable</text><text x="320" y="90">Hub</text><text x="442" y="90">Port</text><text x="564" y="90">Driver</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="76" y="136">needs enough</text><text x="76" y="152">power</text>
    <text x="198" y="136">must carry</text><text x="198" y="152">data, not</text><text x="198" y="168">charge-only</text>
    <text x="320" y="136">optional:</text><text x="320" y="152">powered,</text><text x="320" y="168">or skip it</text>
    <text x="442" y="136">rear port on</text><text x="442" y="152">a desktop</text><text x="442" y="168">is best</text>
    <text x="564" y="136">Windows</text><text x="564" y="152">or macOS</text><text x="564" y="168">sets it up</text>
  </g>
  <g font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">
    <text x="76" y="192">fix 3</text><text x="198" y="192">fix 2</text><text x="320" y="192">fix 2</text><text x="442" y="192">fix 1</text><text x="564" y="192">fixes 4 to 6</text>
  </g>
  <rect x="26" y="220" width="588" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="244" font-size="13" font-weight="700" fill="#14202c" text-anchor="middle">Test one link at a time</text>
  <text x="320" y="263" font-size="13" fill="#14202c" text-anchor="middle">Change only one thing, then plug the device in again.</text>
</svg>
