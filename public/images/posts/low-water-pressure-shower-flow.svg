<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="550" fill="#f3f6fa"/>
  <defs><marker id="shf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why is the shower weak?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="280" y="52" width="300" height="40" rx="8"/>
    <path d="M430 118l130 32-130 32-130-32z"/>
    <path d="M430 218l130 32-130 32-130-32z"/>
    <path d="M430 312l150 40-150 40-150-40z"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="124" width="230" height="52" rx="8"/>
    <rect x="24" y="224" width="230" height="52" rx="8"/>
    <rect x="24" y="430" width="280" height="76" rx="8"/>
    <rect x="330" y="430" width="286" height="76" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#shf)">
    <path d="M430 92v24"/><path d="M430 182v34"/><path d="M430 282v28"/>
    <path d="M300 150h-44"/><path d="M300 250h-44"/>
    <path d="M280 352H164v76"/><path d="M430 392v36"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="430" y="77">Run a sink in another room</text>
    <text x="430" y="155" font-weight="700">Weak there too?</text>
    <text x="430" y="255" font-weight="700">Only hot is weak?</text>
    <text x="430" y="347" font-weight="700">Strong flow with the</text>
    <text x="430" y="365" font-weight="700">showerhead off?</text>
    <text x="278" y="142" font-size="12" fill="#566475">yes</text>
    <text x="278" y="242" font-size="12" fill="#566475">yes</text>
    <text x="222" y="344" font-size="12" fill="#566475">yes</text>
    <text x="446" y="203" font-size="12" fill="#566475">no</text>
    <text x="446" y="300" font-size="12" fill="#566475">no</text>
    <text x="446" y="414" font-size="12" fill="#566475">no</text>
    <text x="139" y="146" font-weight="700">Whole-house issue</text>
    <text x="139" y="165" font-size="13">PRV, main valve or pipes (8)</text>
    <text x="139" y="246" font-weight="700">Hot side only</text>
    <text x="139" y="265" font-size="13">Water heater or valve (7)</text>
    <text x="164" y="454" font-weight="700">Showerhead problem</text>
    <text x="164" y="473" font-size="13">Clean the head, screen and</text>
    <text x="164" y="491" font-size="13">check the restrictor (1 to 3)</text>
    <text x="473" y="454" font-weight="700">Valve problem</text>
    <text x="473" y="473" font-size="13">Open the stops, then clean or</text>
    <text x="473" y="491" font-size="13">replace the cartridge (5, 6)</text>
  </g>
  <text x="24" y="532" font-size="12" fill="#566475">Handheld or tub and shower combo? Check the hose and diverter too (cause 4).</text>
</svg>
