<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="430" fill="#f3f6fa"/>
  <defs><marker id="plf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Which half of the link is failing?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="54" width="300" height="44" rx="8"/>
    <rect x="170" y="124" width="300" height="44" rx="8"/>
    <path d="M320 192l150 38-150 38-150-38z"/>
    <rect x="30" y="300" width="260" height="56" rx="8"/>
    <rect x="350" y="300" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="368" width="260" height="48" rx="8"/><rect x="350" y="368" width="260" height="48" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#plf)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M170 230H160v68"/><path d="M470 230h10v68"/><path d="M160 356v10"/><path d="M480 356v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Both adapters in wall outlets</text>
    <text x="320" y="151">2. Wait for the lights to settle</text>
    <text x="320" y="226" font-weight="700">Data link light</text><text x="320" y="243" font-weight="700">on at both ends?</text>
    <text x="146" y="222" font-size="12" fill="#566475">no</text><text x="496" y="222" font-size="12" fill="#566475">yes</text>
    <text x="160" y="324">The adapters can't</text><text x="160" y="342">see each other</text>
    <text x="480" y="324">Link is up, but data</text><text x="480" y="342">is missing or slow</text>
    <text x="160" y="390" font-weight="700">Check causes 1 to 5</text><text x="160" y="406" font-size="12">outlet, pairing, wiring, noise</text>
    <text x="480" y="390" font-weight="700">Check causes 6 to 8</text><text x="480" y="406" font-size="12">cable, firmware, speed limits</text>
