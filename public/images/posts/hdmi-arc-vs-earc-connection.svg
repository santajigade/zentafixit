<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="arcA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">One cable carries TV sound to the soundbar</text>
  <text x="24" y="54" font-size="13" fill="#566475">Use the ports labeled ARC or eARC on both ends</text>
  <rect x="40" y="70" width="440" height="170" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="56" y="86" width="250" height="138" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <text x="181" y="150" font-size="17" font-weight="700" fill="#0f2240" text-anchor="middle">TV</text>
  <text x="181" y="172" font-size="13" fill="#566475" text-anchor="middle">built-in apps play here</text>
  <text x="322" y="101" font-size="12" fill="#566475">TV ports</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="322" y="110" width="140" height="30" rx="6"/><rect x="322" y="148" width="140" height="30" rx="6"/></g>
  <rect x="322" y="186" width="140" height="30" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g font-size="13" fill="#14202c" text-anchor="middle"><text x="392" y="130">HDMI 1</text><text x="392" y="168">HDMI 2</text><text x="392" y="206" font-weight="700">HDMI 3 (eARC)</text></g>
  <rect x="512" y="110" width="100" height="30" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="562" y="130" font-size="13" fill="#14202c" text-anchor="middle">Streamer</text>
  <path d="M512 125H466" fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#arcA)"/>
  <text x="562" y="158" font-size="12" fill="#566475" text-anchor="middle">picture in</text>
  <rect x="140" y="300" width="340" height="54" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="310" y="323" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Soundbar or receiver</text>
  <text x="310" y="342" font-size="12" fill="#566475" text-anchor="middle">port: HDMI OUT (TV ARC or eARC)</text>
  <path d="M462 201h40v126h-20" fill="none" stroke="#1d5fae" stroke-width="2.5" marker-end="url(#arcA)"/>
  <text x="512" y="262" font-size="13" font-weight="700" fill="#1d5fae">Sound</text>
  <text x="512" y="280" font-size="13" fill="#14202c">comes back</text>
  <path d="M100 240v87h38" fill="none" stroke="#566475" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="110" y="278" font-size="12" fill="#566475">optical fallback</text>
  <text x="24" y="384" font-size="13" fill="#566475">Video goes into the TV. Sound comes back out on the same eARC cable.</text>
</svg>
