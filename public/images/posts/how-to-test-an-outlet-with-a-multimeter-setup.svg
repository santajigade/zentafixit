<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Set up the meter before you probe</text>
  <rect x="40" y="56" width="230" height="324" rx="18" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="66" y="80" width="178" height="58" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <text x="155" y="117" font-size="17" font-weight="700" fill="#0f2240" text-anchor="middle">V~</text>
  <circle cx="155" cy="222" r="50" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="155" cy="222" r="30" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/>
  <path d="M155 222L126 196" stroke="#0f2240" stroke-width="6" stroke-linecap="round"/>
  <g font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">
    <text x="94" y="174" fill="#1d5fae">V~</text><text x="155" y="164">OFF</text><text x="216" y="174">V=</text><text x="226" y="230">Ω</text><text x="84" y="230">A</text>
  </g>
  <g stroke="#0f2240" stroke-width="2"><circle cx="90" cy="320" r="14" fill="#fff"/><circle cx="155" cy="320" r="14" fill="#14202c"/><circle cx="220" cy="320" r="14" fill="#d9442b"/></g>
  <g font-size="12" font-weight="700" fill="#14202c" text-anchor="middle"><text x="90" y="300">A</text><text x="155" y="300">COM</text><text x="220" y="300">V</text></g>
  <g fill="none" stroke-width="5" stroke-linecap="round"><path d="M155 334v58" stroke="#14202c"/><path d="M220 334v58" stroke="#d9442b"/></g>
  <path d="M106 166L128 150H300" stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <path d="M80 310l20 20M100 310l-20 20" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <g font-size="14" fill="#14202c">
    <text x="310" y="132" font-weight="700">1. Dial on V~ (AC volts)</text><text x="310" y="152" font-size="13" fill="#566475">Manual range: pick one above 120 V,</text><text x="310" y="170" font-size="13" fill="#566475">such as 200 V or 600 V</text>
    <text x="310" y="226" font-weight="700">2. Black lead in COM</text>
    <text x="310" y="250" font-weight="700">3. Red lead in V</text><text x="310" y="270" font-size="13" fill="#566475">the jack marked V (often with Ω)</text>
    <text x="310" y="316" font-weight="700" fill="#d9442b">Never use the A or mA jack</text><text x="310" y="336" font-size="13" fill="#566475">for voltage. Probing an outlet there</text><text x="310" y="354" font-size="13" fill="#566475">can short the meter.</text>
  </g>
  <text x="310" y="76" font-size="13" fill="#566475">Use a meter and leads rated</text><text x="310" y="94" font-size="13" font-weight="700" fill="#14202c">CAT II 300 V or higher</text>
</svg>
