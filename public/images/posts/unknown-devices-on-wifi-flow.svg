<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="udflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Is that unknown device yours?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="170" y="54" width="300" height="44" rx="8"/>
    <path d="M320 116l140 34-140 34-140-34z"/>
    <rect x="30" y="220" width="270" height="56" rx="8"/>
    <rect x="340" y="220" width="270" height="56" rx="8"/>
    <rect x="340" y="306" width="270" height="56" rx="8"/>
  </g>
  <rect x="340" y="384" width="270" height="44" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#udflow)">
    <path d="M320 98v16"/><path d="M180 150H165V218"/><path d="M460 150H475V218"/><path d="M475 276v28"/><path d="M475 362v20"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Open the router's device list</text>
    <text x="320" y="155" font-weight="700">Name or maker matches?</text>
    <text x="160" y="140" font-size="12" fill="#566475">yes</text>
    <text x="482" y="140" font-size="12" fill="#566475">no</text>
    <text x="165" y="244">It's yours: rename it</text><text x="165" y="263">in the router list</text>
    <text x="475" y="244">Check your phones for a</text><text x="475" y="263">private Wi-Fi address</text>
    <text x="475" y="330">No match? Switch devices</text><text x="475" y="349">off one group at a time</text>
    <text x="475" y="411" font-weight="700">Still unknown? Block it</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="30" y="306">Often an unnamed gadget:</text>
    <text x="30" y="325">smart plugs, TV sticks,</text>
    <text x="30" y="344">printers, consoles, doorbells</text>
    <text x="30" y="390" fill="#14202c" font-weight="700">Then change the Wi-Fi</text>
    <text x="30" y="409" fill="#14202c" font-weight="700">password and turn off WPS</text>
  </g>
  <path d="M338 406H290" fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#udflow)"/>
</svg>
