<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <defs><marker id="acop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How the call for cooling reaches the AC</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="70" width="150" height="120" rx="8"/>
    <rect x="215" y="60" width="190" height="290" rx="8"/>
    <rect x="445" y="60" width="175" height="290" rx="8"/>
  </g>
  <rect x="45" y="105" width="100" height="56" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2">
    <rect x="230" y="100" width="160" height="44" rx="8"/><rect x="230" y="152" width="160" height="44" rx="8"/><rect x="230" y="204" width="160" height="44" rx="8"/>
    <rect x="460" y="100" width="145" height="44" rx="8"/><rect x="460" y="152" width="145" height="44" rx="8"/><rect x="460" y="256" width="145" height="44" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="230" y="256" width="160" height="44" rx="8"/><rect x="460" y="204" width="145" height="44" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#acop)"><path d="M170 130h43"/><path d="M405 130h38"/></g>
  <g font-size="12" fill="#566475" text-anchor="middle"><text x="192" y="120">24 V</text><text x="425" y="120">24 V</text></g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="95" y="92" font-weight="700">Thermostat</text>
    <text x="95" y="138">COOL</text>
    <text x="310" y="84" font-weight="700">Indoor unit</text>
    <text x="532" y="84" font-weight="700">Outdoor unit</text>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="310" y="127">Door safety switch</text>
    <text x="310" y="179">Board fuse</text>
    <text x="310" y="231">24 V transformer</text>
    <text x="310" y="283" font-weight="700">Float switch</text>
    <text x="532" y="127">Disconnect box</text>
    <text x="532" y="179">Contactor</text>
    <text x="532" y="231" font-weight="700">Capacitor</text>
    <text x="532" y="283">Compressor, fan</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="310" y="336">Own breaker or switch</text>
    <text x="532" y="336">Own 240 V breaker</text>
    <text x="95" y="212">Batteries or</text><text x="95" y="228">24 V from indoor unit</text>
  </g>
  <text x="24" y="384" font-size="13" fill="#566475">Highlighted parts are common failures. Any open switch in the chain</text>
  <text x="24" y="402" font-size="13" fill="#566475">stops the whole system, so check each one in order.</text>
