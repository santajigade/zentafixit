<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside an electric water heater</text>
  <!-- pipes -->
  <path d="M255 52v38" stroke="#1d5fae" stroke-width="6"/>
  <path d="M355 52v38" stroke="#d9442b" stroke-width="6"/>
  <!-- tank -->
  <rect x="220" y="90" width="170" height="310" rx="20" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M255 96v264" stroke="#1d5fae" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- junction box and cable -->
  <rect x="292" y="74" width="28" height="16" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M306 74v-14h14" fill="none" stroke="#0f2240" stroke-width="3"/>
  <!-- T and P valve with discharge pipe -->
  <rect x="390" y="112" width="22" height="16" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M412 120h8v262" fill="none" stroke="#0f2240" stroke-width="3"/>
  <!-- upper panel -->
  <rect x="275" y="150" width="70" height="84" rx="6" fill="none" stroke="#0f2240" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="285" y="160" width="50" height="40" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <circle cx="310" cy="174" r="7" fill="#d9442b"/>
  <path d="M300 216H238M300 224H238" stroke="#0f2240" stroke-width="3" stroke-linecap="round"/>
  <path d="M238 216a4 4 0 0 0 0 8" fill="none" stroke="#0f2240" stroke-width="3"/>
  <!-- lower panel -->
  <rect x="275" y="290" width="70" height="70" rx="6" fill="none" stroke="#0f2240" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="285" y="298" width="50" height="24" rx="4" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M300 338H238M300 346H238" stroke="#0f2240" stroke-width="3" stroke-linecap="round"/>
  <path d="M238 338a4 4 0 0 0 0 8" fill="none" stroke="#0f2240" stroke-width="3"/>
  <!-- sediment -->
  <path d="M226 384c30-8 60 4 90-2s50-4 68 2v8H226z" fill="#566475" fill-opacity=".35"/>
  <!-- drain valve -->
  <rect x="300" y="400" width="22" height="16" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- highlight reset -->
  <circle cx="310" cy="174" r="13" fill="none" stroke="#c9a10a" stroke-width="2"/>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M206 70H251"/><path d="M206 174H296"/><path d="M206 230L238 222"/><path d="M206 310H285"/><path d="M206 360L238 344"/><path d="M206 408H300"/>
    <path d="M359 70H432"/><path d="M320 66L432 100"/><path d="M412 128L432 136"/><path d="M345 200H432"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="66" font-weight="700">Cold water inlet</text><text x="24" y="84" font-size="13" fill="#566475">Dip tube carries it down</text>
    <text x="24" y="170" font-weight="700">Upper thermostat</text><text x="24" y="188" font-size="13" fill="#d9442b">Red reset button (ECO)</text>
    <text x="24" y="234" font-weight="700">Upper element</text>
    <text x="24" y="314" font-weight="700">Lower thermostat</text>
    <text x="24" y="364" font-weight="700">Lower element</text>
    <text x="24" y="398" font-weight="700">Sediment, drain valve</text><text x="24" y="416" font-size="13" fill="#566475">Flush to clear it</text>
    <text x="440" y="74" font-weight="700">Hot water outlet</text>
    <text x="440" y="104" font-weight="700">240 V power cable</text>
    <text x="440" y="140" font-weight="700">T&amp;P relief valve</text><text x="440" y="158" font-size="13" fill="#566475">Never cap or plug it</text>
    <text x="440" y="204" font-weight="700">Access panels</text><text x="440" y="222" font-size="13" fill="#d9442b">Breaker off first</text>
  </g>
  <text x="24" y="446" font-size="12" fill="#566475">Most electric tanks have two elements, each with its own thermostat.</text>
</svg>
