<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Level 1 vs Level 2 at a glance</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="50" width="284" height="350" rx="8"/><rect x="332" y="50" width="284" height="350" rx="8"/></g>
  <path d="M26 92V58a6 6 0 0 1 6-6h268a6 6 0 0 1 6 6v34z" fill="#dfe9f7"/>
  <path d="M334 92V58a6 6 0 0 1 6-6h268a6 6 0 0 1 6 6v34z" fill="#0f2240"/>
  <text x="166" y="78" font-size="17" font-weight="700" fill="#0f2240" text-anchor="middle">Level 1 (120 V)</text>
  <text x="474" y="78" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Level 2 (240 V)</text>
  <!-- Level 1: outlet, plug and cord brick -->
  <rect x="80" y="108" width="60" height="78" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="5" stroke-linecap="round"><path d="M99 128v22"/><path d="M121 132v14"/></g>
  <path d="M104 166h12v6a6 6 0 0 1-12 0z" fill="#0f2240"/>
  <path d="M140 150h22c14 0 14 18 28 18h12" fill="none" stroke="#0f2240" stroke-width="3"/>
  <rect x="202" y="152" width="44" height="30" rx="6" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <path d="M246 167h20" stroke="#0f2240" stroke-width="3"/>
  <!-- Level 2: wall unit with holstered handle -->
  <rect x="430" y="104" width="72" height="88" rx="12" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="452" y="120" width="28" height="8" rx="4" fill="#1f8a5b"/>
  <rect x="452" y="146" width="28" height="30" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M502 170c22 0 26 20 46 20h20" fill="none" stroke="#0f2240" stroke-width="4"/>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="166" y="222">Regular household outlet</text>
    <text x="166" y="250">About 12 A, about 1.4 kW</text>
    <text x="166" y="278" font-weight="700" font-size="14" fill="#1d5fae">About 3 to 5 miles per hour</text>
    <text x="166" y="306">Uses the portable cord</text>
    <text x="474" y="222">240 V outlet or hardwired unit</text>
    <text x="474" y="250">About 16 to 48 A, 3.8 to 11.5 kW</text>
    <text x="474" y="278" font-weight="700" font-size="14" fill="#1d5fae">About 12 to 35+ miles per hour</text>
    <text x="474" y="306">Needs an electrician to install</text>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="38" y="322" width="256" height="62" rx="8"/><rect x="346" y="322" width="256" height="62" rx="8"/></g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="166" y="347" font-weight="700">Good for</text><text x="166" y="368">short daily drives, PHEVs</text>
    <text x="474" y="347" font-weight="700">Good for</text><text x="474" y="368">longer drives, big batteries</text>
  </g>
</svg>
