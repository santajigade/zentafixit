<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a dishwasher drain can clog</text>
  <!-- countertop -->
  <rect x="30" y="82" width="370" height="12" fill="#0f2240"/>
  <!-- dishwasher -->
  <rect x="40" y="100" width="170" height="280" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="55" y="115" width="140" height="225" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <path d="M60 318c20-6 40 6 65 0s45-6 65 0v18H60z" fill="#1d5fae" fill-opacity=".35"/>
  <rect x="105" y="322" width="40" height="14" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <circle cx="125" cy="360" r="11" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- sink and disposal -->
  <path d="M250 94v54h110V94" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M305 148v12" stroke="#0f2240" stroke-width="2"/>
  <rect x="275" y="160" width="60" height="80" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M305 240v30c0 20 30 20 30 0v-10h40" fill="none" stroke="#0f2240" stroke-width="2"/>
  <!-- air gap -->
  <rect x="372" y="62" width="16" height="20" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- hose -->
  <path d="M136 360H230V130c0-40 150-70 146-48" fill="none" stroke="#1d5fae" stroke-width="4" stroke-linecap="round"/>
  <path d="M384 94v110h-49" fill="none" stroke="#1d5fae" stroke-width="4" stroke-linecap="round"/>
  <!-- markers -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="125" cy="298" r="12" fill="#d9442b"/><text x="125" y="303">1</text>
    <circle cx="90" cy="360" r="12" fill="#d9442b"/><text x="90" y="365">2</text>
    <circle cx="230" cy="260" r="12" fill="#d9442b"/><text x="230" y="265">3</text>
    <circle cx="350" cy="64" r="12" fill="#d9442b"/><text x="350" y="69">4</text>
    <circle cx="305" cy="200" r="12" fill="#d9442b"/><text x="305" y="205">5</text>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="420" y="86" font-weight="700">1. Filter</text>
    <text x="420" y="104" font-size="13" fill="#566475">Food and glass collect</text>
    <text x="420" y="146" font-weight="700">2. Drain pump</text>
    <text x="420" y="164" font-size="13" fill="#566475">Hums if it is jammed</text>
    <text x="420" y="206" font-weight="700">3. Drain hose</text>
    <text x="420" y="224" font-size="13" fill="#566475">Kinks under the sink</text>
    <text x="420" y="266" font-weight="700">4. Air gap</text>
    <text x="420" y="284" font-size="13" fill="#566475">Spurts water if clogged</text>
    <text x="420" y="326" font-weight="700">5. Disposal or drain</text>
    <text x="420" y="344" font-size="13" fill="#566475">Knockout plug, food clog</text>
  </g>
  <text x="40" y="404" font-size="12" fill="#566475">No air gap? The hose should loop up high under the counter instead.</text>
</svg>
