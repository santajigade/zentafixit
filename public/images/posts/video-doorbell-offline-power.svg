<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="360" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a wired video doorbell gets its power</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="80" width="140" height="80" rx="8"/>
    <rect x="200" y="80" width="140" height="80" rx="8"/>
    <rect x="376" y="80" width="110" height="80" rx="8"/>
    <rect x="516" y="80" width="100" height="80" rx="8"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="94" y="112" font-weight="700">House wiring</text><text x="94" y="134" font-size="12" fill="#566475">120 V AC</text>
    <text x="270" y="112" font-weight="700">Transformer</text><text x="270" y="134" font-size="12" fill="#566475">steps down to</text><text x="270" y="150" font-size="12" fill="#566475">low voltage AC</text>
    <text x="431" y="112" font-weight="700">Chime</text><text x="431" y="134" font-size="12" fill="#566475">indoors</text>
    <text x="566" y="112" font-weight="700">Doorbell</text><text x="566" y="134" font-size="12" fill="#566475">at the door</text>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M164 110H200" stroke="#d9442b"/><path d="M164 130H200" stroke="#d9442b"/>
    <path d="M340 110H376" stroke="#1d5fae"/><path d="M340 130H376" stroke="#1d5fae"/>
    <path d="M486 110H516" stroke="#1d5fae"/><path d="M486 130H516" stroke="#1d5fae"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="182" y="186" fill="#d9442b">120 V side</text>
    <text x="440" y="186" fill="#1d5fae">low-voltage side</text>
  </g>
  <path d="M200 196H600" stroke="#1d5fae" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M30 196H164" stroke="#d9442b" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="24" y="214" width="592" height="130" rx="8"/></g>
  <g font-size="13" fill="#14202c">
    <text x="44" y="240" font-weight="700">Check the transformer label</text>
    <text x="44" y="262">Output voltage (V AC) and VA rating must meet the doorbell's spec.</text>
    <text x="44" y="282">Too weak? The doorbell may reboot when the chime rings.</text>
    <text x="44" y="302">Some chimes need a power kit or adapter: check your manual.</text>
    <text x="44" y="328" font-weight="700" fill="#d9442b">Breaker off before touching any wires.</text>
  </g>
</svg>
