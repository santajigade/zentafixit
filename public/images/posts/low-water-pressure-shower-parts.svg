<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="590" fill="#f3f6fa"/>
  <defs><marker id="shp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566475"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a shower gets clogged</text>
  <text x="24" y="60" font-size="13" fill="#566475">Showerhead, taken apart</text>
  <!-- shower arm -->
  <rect x="24" y="132" width="126" height="16" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="1.5"><path d="M132 132v16M138 132v16M144 132v16"/></g>
  <!-- inlet screen -->
  <rect x="188" y="116" width="12" height="48" rx="3" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g stroke="#1d5fae" stroke-width="1"><path d="M188 128h12M188 140h12M188 152h12"/></g>
  <!-- flow restrictor -->
  <rect x="238" y="118" width="14" height="44" rx="3" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="245" cy="140" r="4" fill="#0f2240"/>
  <!-- head body -->
  <path d="M296 124L420 82V198L296 156z" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- face plate -->
  <rect x="440" y="76" width="20" height="128" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><circle cx="463" cy="92" r="3"/><circle cx="463" cy="124" r="3"/><circle cx="463" cy="156" r="3"/><circle cx="463" cy="188" r="3"/></g>
  <g fill="#d9442b"><circle cx="463" cy="108" r="3.5"/><circle cx="463" cy="140" r="3.5"/><circle cx="463" cy="172" r="3.5"/></g>
  <g fill="#1d5fae"><path d="M482 120c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12z"/><path d="M500 152c3 5 5 7 5 10a5 5 0 0 1-10 0c0-3 2-5 5-10z" opacity=".7"/></g>
  <!-- number markers, head -->
  <g stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4" fill="none"><path d="M194 104v10"/><path d="M245 104v12"/><path d="M528 98L470 108"/></g>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"><circle cx="194" cy="92" r="11"/><circle cx="245" cy="92" r="11"/><circle cx="540" cy="96" r="11"/></g>
  <g font-size="13" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="194" y="97">2</text><text x="245" y="97">3</text><text x="540" y="101">1</text></g>
  <g font-size="12" fill="#566475" text-anchor="middle"><text x="87" y="172">Shower arm</text><text x="358" y="222">Head body</text></g>
  <path d="M24 244H616" stroke="#d5dee8" stroke-width="2"/>
  <text x="24" y="270" font-size="13" fill="#566475">Shower valve, behind the handle</text>
  <!-- supply pipes -->
  <rect x="60" y="300" width="140" height="14" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <rect x="60" y="350" width="140" height="14" fill="#fff" stroke="#1d5fae" stroke-width="2"/>
  <text x="60" y="294" font-size="12" fill="#566475">Hot in</text>
  <text x="60" y="384" font-size="12" fill="#566475">Cold in</text>
  <!-- riser and spout -->
  <rect x="243" y="276" width="14" height="14" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="243" y="374" width="14" height="22" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="236" y="396" width="96" height="20" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="300" y="384" width="12" height="12" rx="2" fill="#ffd23f" stroke="#0f2240" stroke-width="1.5"/>
  <text x="264" y="283" font-size="12" fill="#566475">to showerhead</text>
  <text x="236" y="436" font-size="12" fill="#566475">Tub spout</text>
  <!-- valve body -->
  <rect x="200" y="290" width="100" height="84" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="206" y="301" width="12" height="12" rx="2" fill="#ffd23f" stroke="#0f2240" stroke-width="1.5"/>
  <rect x="206" y="351" width="12" height="12" rx="2" fill="#ffd23f" stroke="#0f2240" stroke-width="1.5"/>
  <circle cx="270" cy="332" r="16" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <!-- cartridge pulled out -->
  <g stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4" fill="none"><path d="M290 332h46"/></g>
  <rect x="340" y="314" width="130" height="36" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="360" y="322" width="70" height="20" rx="3" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="470" y="322" width="34" height="20" rx="2" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="1.5"><path d="M478 322v20M486 322v20M494 322v20"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.5"><path d="M344 318v28M348 318v28"/></g>
  <!-- number markers, valve -->
  <g stroke="#566475" stroke-width="1.5" stroke-dasharray="4 4" fill="none"><path d="M168 332H204"/><path d="M212 332V316M212 332V348"/><path d="M405 296v16"/><path d="M350 392L314 390"/></g>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"><circle cx="156" cy="332" r="11"/><circle cx="405" cy="284" r="11"/><circle cx="362" cy="392" r="11"/></g>
  <g font-size="13" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="156" y="337">5</text><text x="405" y="289">6</text><text x="362" y="397">4</text></g>
  <text x="405" y="372" font-size="12" fill="#566475" text-anchor="middle">Cartridge (spool inside)</text>
  <!-- legend -->
  <path d="M24 452H616" stroke="#d5dee8" stroke-width="2"/>
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"><circle cx="35" cy="474" r="9"/><circle cx="35" cy="496" r="9"/><circle cx="35" cy="518" r="9"/><circle cx="335" cy="474" r="9"/><circle cx="335" cy="496" r="9"/><circle cx="335" cy="518" r="9"/></g>
  <g font-size="12" font-weight="700" fill="#0f2240" text-anchor="middle"><text x="35" y="478">1</text><text x="35" y="500">2</text><text x="35" y="522">3</text><text x="335" y="478">4</text><text x="335" y="500">5</text><text x="335" y="522">6</text></g>
  <g font-size="13" fill="#14202c">
    <text x="52" y="479"><tspan font-weight="700">Nozzles:</tspan> scale blocks holes</text>
    <text x="52" y="501"><tspan font-weight="700">Inlet screen:</tspan> traps grit</text>
    <text x="52" y="523"><tspan font-weight="700">Restrictor:</tspan> limits flow</text>
    <text x="352" y="479"><tspan font-weight="700">Diverter:</tspan> must seal fully</text>
    <text x="352" y="501"><tspan font-weight="700">Stops:</tspan> must be fully open</text>
    <text x="352" y="523"><tspan font-weight="700">Cartridge:</tspan> debris or wear</text>
  </g>
  <text x="24" y="560" font-size="12" fill="#566475">Red dots: clogged nozzles. Not all valves have stops or a diverter.</text>
</svg>
