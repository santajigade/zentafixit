<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="earreset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Resetting earbuds: the usual sequence</text>
  <!-- generic case -->
  <rect x="50" y="110" width="140" height="120" rx="40" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M52 150h136" fill="none" stroke="#0f2240" stroke-width="2"/>
  <circle cx="120" cy="178" r="7" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/>
  <circle cx="120" cy="208" r="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <circle cx="56" cy="262" r="6" fill="#ffd23f" stroke="#c9a10a" stroke-width="1.5"/><text x="70" y="267">status light</text>
    <circle cx="56" cy="288" r="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="70" y="293">case button</text>
  </g>
  <g font-size="12" fill="#566475"><text x="40" y="322">The button may be on</text><text x="40" y="338">the back or inside</text><text x="40" y="354">the lid. See your manual.</text></g>
  <!-- steps -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="240" y="56" width="370" height="52" rx="8"/>
    <rect x="240" y="120" width="370" height="52" rx="8"/>
    <rect x="240" y="184" width="370" height="52" rx="8"/>
    <rect x="240" y="248" width="370" height="52" rx="8"/>
  </g>
  <rect x="240" y="312" width="370" height="52" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#earreset-arrow)">
    <path d="M200 170h36"/>
  </g>
  <g fill="#14202c">
    <text x="256" y="78" font-size="14" font-weight="700">1. Buds in the case, close the lid</text>
    <text x="256" y="97" font-size="12" fill="#566475">Wait about 30 seconds</text>
    <text x="256" y="142" font-size="14" font-weight="700">2. Forget them on your phone</text>
    <text x="256" y="161" font-size="12" fill="#566475">Bluetooth settings, then Forget</text>
    <text x="256" y="206" font-size="14" font-weight="700">3. Open the lid, hold the button</text>
    <text x="256" y="225" font-size="12" fill="#566475">AirPods: about 15 seconds. Others: see manual</text>
    <text x="256" y="270" font-size="14" font-weight="700">4. Watch the status light</text>
    <text x="256" y="289" font-size="12" fill="#566475">AirPods: flashes amber, then white</text>
    <text x="256" y="334" font-size="14" font-weight="700">5. Pair again from the phone</text>
    <text x="256" y="353" font-size="12" fill="#566475">Lid open, earbuds right next to the phone</text>
  </g>
</svg>
