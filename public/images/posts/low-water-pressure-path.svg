<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="lwpp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where to look, and where to test</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="100" height="48" rx="8"/>
    <rect x="144" y="56" width="100" height="48" rx="8"/>
    <rect x="264" y="56" width="100" height="48" rx="8"/>
    <rect x="384" y="56" width="100" height="48" rx="8"/>
    <rect x="504" y="56" width="100" height="48" rx="8"/>
  </g>
  <g fill="none" stroke="#1d5fae" stroke-width="2" marker-end="url(#lwpp-arrow)">
    <path d="M124 80h18"/><path d="M244 80h18"/><path d="M364 80h18"/><path d="M484 80h18"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="74" y="85" font-weight="700">Street main</text>
    <text x="194" y="85" font-weight="700">Water meter</text>
    <text x="314" y="85" font-weight="700">Main shutoff</text>
    <text x="434" y="77" font-weight="700">Pressure</text><text x="434" y="93" font-weight="700">regulator</text>
    <text x="554" y="85" font-weight="700">Fixtures</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="74" y="122">utility side</text>
    <text x="194" y="122">leak dial</text>
    <text x="314" y="122">fully open?</text>
    <text x="434" y="122">adjustable</text>
    <text x="554" y="122">aerators</text>
  </g>
  <!-- branch to hose faucet -->
  <path d="M494 80V200H440" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <rect x="396" y="186" width="46" height="28" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="410" y="170" width="18" height="16" rx="3" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <rect x="402" y="214" width="20" height="16" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <circle cx="412" cy="264" r="32" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="406" y="228" width="12" height="6" fill="#0f2240"/>
  <path d="M412 264L392 252" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="412" cy="264" r="4" fill="#0f2240"/>
  <path d="M396 286a24 24 0 0 0 32 0" fill="none" stroke="#d5dee8" stroke-width="3"/>
  <g font-size="13" fill="#14202c">
    <text x="24" y="190" font-weight="700">Test here</text>
    <text x="24" y="210">Screw a gauge onto an outdoor</text>
    <text x="24" y="228">hose faucet or washer spigot.</text>
    <text x="24" y="246">Turn all other water off, then</text>
    <text x="24" y="264">open that faucet fully.</text>
  </g>
  <text x="460" y="268" font-size="12" fill="#566475">gauge reads psi</text>
  <!-- scale -->
  <text x="24" y="336" font-size="14" font-weight="700" fill="#0f2240">Typical ranges (general guidance)</text>
  <rect x="40" y="350" width="224" height="28" fill="#d9442b" fill-opacity=".25"/>
  <rect x="264" y="350" width="112" height="28" fill="#1f8a5b" fill-opacity=".35"/>
  <rect x="376" y="350" width="112" height="28" fill="#dfe9f7"/>
  <rect x="488" y="350" width="112" height="28" fill="#d9442b" fill-opacity=".25"/>
  <rect x="40" y="350" width="560" height="28" fill="none" stroke="#0f2240" stroke-width="2"/>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="152" y="369">Low</text><text x="320" y="369" font-weight="700">Typical</text><text x="432" y="369">Higher</text><text x="544" y="369">Too high</text>
  </g>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="40" y="396">0</text><text x="264" y="396">40</text><text x="376" y="396">60</text><text x="488" y="396">80</text><text x="604" y="396" text-anchor="end">100 psi</text>
  </g>
  <text x="24" y="424" font-size="12" fill="#566475">Your utility or a plumber can tell you what is normal where you live.</text>
</svg>
