<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <defs><marker id="sflf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">App or driver? Use the Task Manager test</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="54" width="340" height="44" rx="8"/>
    <path d="M320 122l150 38-150 38-150-38z"/>
    <rect x="30" y="230" width="260" height="56" rx="8"/>
    <rect x="350" y="230" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="302" width="260" height="56" rx="8"/><rect x="350" y="302" width="260" height="56" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#sflf)">
    <path d="M320 98v22"/><path d="M170 160H160v68"/><path d="M470 160h10v68"/><path d="M160 286v14"/><path d="M480 286v14"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">Open Task Manager: Ctrl + Shift + Esc</text>
    <text x="320" y="156" font-weight="700">Does Task Manager</text><text x="320" y="173" font-weight="700">flicker too?</text>
    <text x="144" y="152" font-size="12" fill="#566475">yes</text><text x="496" y="152" font-size="12" fill="#566475">no</text>
    <text x="160" y="254">Driver, setting or hardware:</text><text x="160" y="272">the whole screen is affected</text>
    <text x="480" y="254">Likely an app:</text><text x="480" y="272">only that app draws badly</text>
    <text x="160" y="326" font-weight="700">Check fixes 1 to 3, 5 to 8</text><text x="160" y="344" font-size="12">cable, refresh, driver, brightness</text>
    <text x="480" y="326" font-weight="700">Check fix 4</text><text x="480" y="344" font-size="12">update, close or remove the app</text>
  </g>
</svg>
