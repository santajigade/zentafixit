<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs>
    <marker id="fsc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fae"/></marker>
    <marker id="fsh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9442b"/></marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Flushing a tankless unit: typical setup</text>
  <!-- unit -->
  <rect x="220" y="52" width="200" height="110" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="320" y="102" font-size="14" font-weight="700" fill="#14202c" text-anchor="middle">Tankless unit</text>
  <text x="320" y="122" font-size="12" fill="#566475" text-anchor="middle">power and gas off</text>
  <!-- pipes -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M280 162V210H24" stroke="#1d5fae"/>
    <path d="M360 162V210H616" stroke="#d9442b"/>
    <path d="M280 210V250" stroke="#1d5fae"/>
    <path d="M360 210V250" stroke="#d9442b"/>
  </g>
  <!-- house isolation valves (closed) -->
  <g fill="#0f2240"><path d="M158 200v20l24-20v20z"/><path d="M458 200v20l24-20v20z"/></g>
  <!-- service port valves (open) -->
  <g fill="#1f8a5b"><path d="M270 228h20l-20 16h20z"/><path d="M350 228h20l-20 16h20z"/></g>
  <!-- bucket -->
  <path d="M245 330h150l-12 80h-126z" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="290" y="368" width="34" height="28" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- hoses -->
  <path d="M307 368V320Q307 290 280 290V254" fill="none" stroke="#1d5fae" stroke-width="2.5" marker-end="url(#fsc)"/>
  <path d="M360 254V346" fill="none" stroke="#d9442b" stroke-width="2.5" marker-end="url(#fsh)"/>
  <!-- labels -->
  <g font-size="13" fill="#14202c">
    <text x="170" y="192" text-anchor="middle">Cold valve closed</text>
    <text x="470" y="192" text-anchor="middle">Hot valve closed</text>
    <text x="24" y="234">From house</text>
    <text x="610" y="234" text-anchor="end">To house</text>
    <text x="262" y="246" text-anchor="end">Service port</text>
    <text x="378" y="246">Service port</text>
  </g>
  <g font-size="12" fill="#566475">
    <text x="268" y="300" text-anchor="end">Pump pushes it in</text>
    <text x="372" y="300">Returns to bucket</text>
    <text x="236" y="388" text-anchor="end">Pump in bucket</text>
    <text x="404" y="388">Vinegar or descaler</text>
  </g>
  <text x="24" y="430" font-size="13" fill="#566475">Follow your manual for the solution, run time and valve order.</text>
</svg>
