<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="onwf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Dead outlet: check in this order</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="54" width="340" height="44" rx="8"/>
    <rect x="24" y="116" width="340" height="44" rx="8"/>
    <rect x="24" y="178" width="340" height="44" rx="8"/>
    <rect x="24" y="240" width="340" height="44" rx="8"/>
  </g>
  <rect x="24" y="304" width="592" height="100" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#onwf)">
    <path d="M194 98v16"/><path d="M194 160v16"/><path d="M194 222v16"/><path d="M194 284v18"/>
    <path d="M364 138h24"/><path d="M364 200h24"/><path d="M364 262h24"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="40" y="81">1. Test with a lamp you know works</text>
    <text x="40" y="143">2. Press RESET on every GFCI nearby</text>
    <text x="40" y="205">3. Check the panel for a tripped breaker</text>
    <text x="40" y="267">4. Flip nearby wall switches, test again</text>
  </g>
  <g font-size="13" fill="#1f8a5b" font-weight="700">
    <text x="396" y="143">Power back? Cause 1</text>
    <text x="396" y="205">Power back? Cause 2</text>
    <text x="396" y="267">Power back? Cause 3</text>
  </g>
  <text x="396" y="81" font-size="12" fill="#566475">Lamp lights? Outlet is fine</text>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="320" y="328" font-weight="700" font-size="14">Still dead?</text>
    <text x="320" y="350">A loose connection at this outlet or one before it (cause 4),</text>
    <text x="320" y="370">or a worn or burnt outlet (causes 5, 6).</text>
    <text x="320" y="390" font-size="12" fill="#566475">Breaker off, then call an electrician unless you're experienced.</text>
  </g>
  <text x="24" y="428" font-size="12" fill="#d9442b" font-weight="700">Scorch marks or a burning smell? Skip the checks: breaker off, call a pro.</text>
</svg>
