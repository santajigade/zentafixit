  <rect x="172" y="256" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="184" y="282" font-size="14" font-weight="700" fill="#14202c">Basement</text>
  <rect x="184" y="296" width="50" height="24" rx="12" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="209" y="313" font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">GFCI</text>
  <text x="184" y="336" font-size="12" fill="#566475">Finished: AFCI too</text>
  <rect x="320" y="256" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="332" y="282" font-size="14" font-weight="700" fill="#14202c">Outdoors</text>
  <rect x="332" y="296" width="50" height="24" rx="12" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="357" y="313" font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">GFCI</text>
  <rect x="468" y="256" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="480" y="282" font-size="14" font-weight="700" fill="#14202c">Near any sink</text>
  <rect x="480" y="296" width="50" height="24" rx="12" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="505" y="313" font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">GFCI</text>
  <text x="480" y="336" font-size="12" fill="#566475">Within 6 ft</text>
  <rect x="24" y="360" width="50" height="24" rx="12" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="49" y="377" font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">GFCI</text>
  <text x="84" y="377" font-size="13" fill="#14202c">Shock protection</text>
  <rect x="230" y="360" width="50" height="24" rx="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/><text x="255" y="377" font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">AFCI</text>
  <text x="290" y="377" font-size="13" fill="#14202c">Arc-fault (fire) protection</text>
  <text x="24" y="408" font-size="12" fill="#566475">Based on recent NEC editions. Local adoption and amendments vary: check with your building department.</text>
</svg>
