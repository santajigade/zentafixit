  <rect x="94" y="196" width="50" height="24" rx="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/><text x="119" y="213" font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">AFCI</text>
  <rect x="172" y="156" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="184" y="182" font-size="14" font-weight="700" fill="#14202c">Laundry area</text>
  <rect x="184" y="196" width="50" height="24" rx="12" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/><text x="209" y="213" font-size="12" font-weight="700" fill="#1d5fae" text-anchor="middle">GFCI</text>
  <rect x="242" y="196" width="50" height="24" rx="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/><text x="267" y="213" font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">AFCI</text>
  <rect x="320" y="156" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <text x="332" y="182" font-size="14" font-weight="700" fill="#14202c">Hallway, closet</text>
  <rect x="332" y="196" width="50" height="24" rx="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/><text x="357" y="213" font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">AFCI</text>
  <rect x="468" y="156" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
