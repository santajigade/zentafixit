  <rect x="480" y="96" width="50" height="24" rx="12" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/><text x="505" y="113" font-size="12" font-weight="700" fill="#14202c" text-anchor="middle">AFCI</text>
  <rect x="24" y="156" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
