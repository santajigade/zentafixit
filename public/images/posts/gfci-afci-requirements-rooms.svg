<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="420" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Typical GFCI and AFCI locations, room by room</text>
    <rect x="24" y="56" width="140" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
