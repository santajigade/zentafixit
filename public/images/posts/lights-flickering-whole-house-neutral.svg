<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Good neutral vs loose neutral</text>
  <g fill="#fff" stroke="#d5dee8" stroke-width="2"><rect x="24" y="52" width="284" height="270" rx="8"/><rect x="332" y="52" width="284" height="270" rx="8"/></g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="166" y="78" fill="#1f8a5b">Good neutral</text>
    <text x="474" y="78" fill="#d9442b">Loose neutral</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#14202c">
    <text x="106" y="104" font-weight="700">Leg A</text><text x="106" y="120" font-size="13" fill="#566475">120 V</text>
    <text x="226" y="104" font-weight="700">Leg B</text><text x="226" y="120" font-size="13" fill="#566475">120 V</text>
    <text x="414" y="104" font-weight="700">Leg A</text><text x="414" y="120" font-size="13" fill="#d9442b">Over 120 V</text>
    <text x="534" y="104" font-weight="700">Leg B</text><text x="534" y="120" font-size="13" fill="#1d5fae">Under 120 V</text>
  </g>
  <!-- bulbs -->
  <g stroke-width="2">
    <circle cx="106" cy="166" r="26" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a"/>
    <circle cx="226" cy="166" r="26" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a"/>
    <circle cx="414" cy="166" r="26" fill="#ffd23f" stroke="#c9a10a"/>
    <circle cx="534" cy="166" r="26" fill="#d5dee8" stroke="#566475"/>
  </g>
  <g stroke="#c9a10a" stroke-width="3" stroke-linecap="round"><path d="M376 166h-8M452 166h8M387 139l-6-6M441 139l6-6M387 193l-6 6M441 193l6 6"/></g>
  <g fill="#0f2240"><rect x="96" y="190" width="20" height="14" rx="2"/><rect x="216" y="190" width="20" height="14" rx="2"/><rect x="404" y="190" width="20" height="14" rx="2"/><rect x="524" y="190" width="20" height="14" rx="2"/></g>
  <!-- wires to neutral -->
  <g stroke="#566475" stroke-width="2" fill="none">
    <path d="M106 204v66M226 204v66M414 204v66M534 204v66"/>
  </g>
  <path d="M60 270H272" stroke="#1f8a5b" stroke-width="4"/>
  <path d="M368 270H462M486 270H580" stroke="#566475" stroke-width="4"/>
  <path d="M466 262l16 16M482 262l-16 16" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <g font-size="13" fill="#566475" text-anchor="middle">
    <text x="166" y="300">Neutral solid: both legs even</text>
    <text x="474" y="300">Neutral loose: legs drift apart</text>
  </g>
  <g font-size="13" fill="#566475">
    <text x="24" y="352">Which leg rises depends on what is switched on at the time.</text>
    <text x="24" y="372">Both legs share the neutral, so one loose spot affects the whole house.</text>
  </g>
</svg>
