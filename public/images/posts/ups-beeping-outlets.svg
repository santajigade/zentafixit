<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Battery outlets vs surge-only outlets</text>
  <rect x="24" y="52" width="592" height="140" rx="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="44" y="70" width="300" height="106" rx="8" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <rect x="364" y="70" width="232" height="106" rx="8" fill="#fff" stroke="#566475" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="194" y="90" fill="#1d5fae">Battery + surge</text>
    <text x="480" y="90" fill="#566475">Surge only</text>
  </g>
  <!-- outlets -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="60" y="102" width="56" height="62" rx="8"/><rect x="128" y="102" width="56" height="62" rx="8"/>
    <rect x="196" y="102" width="56" height="62" rx="8"/><rect x="264" y="102" width="56" height="62" rx="8"/>
    <rect x="380" y="102" width="56" height="62" rx="8"/><rect x="452" y="102" width="56" height="62" rx="8"/>
    <rect x="524" y="102" width="56" height="62" rx="8"/>
  </g>
  <g stroke="#0f2240" stroke-width="4" stroke-linecap="round">
    <path d="M80 118v14M96 118v10M148 118v14M164 118v10M216 118v14M232 118v10M284 118v14M300 118v10"/>
    <path d="M400 118v14M416 118v10M472 118v14M488 118v10M544 118v14M560 118v10"/>
  </g>
  <g fill="#0f2240">
    <circle cx="88" cy="148" r="5"/><circle cx="156" cy="148" r="5"/><circle cx="224" cy="148" r="5"/><circle cx="292" cy="148" r="5"/>
    <circle cx="408" cy="148" r="5"/><circle cx="480" cy="148" r="5"/><circle cx="552" cy="148" r="5"/>
  </g>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="210" width="296" height="124" rx="8"/>
    <rect x="340" y="210" width="276" height="124" rx="8"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="40" y="236" font-weight="700" fill="#1d5fae">Plug in here (must stay on)</text>
    <text x="40" y="262">Computer and monitor</text>
    <text x="40" y="284">Modem and router</text>
    <text x="40" y="306">External drive</text>
    <text x="356" y="236" font-weight="700" fill="#566475">Surge only (can go off)</text>
    <text x="356" y="262">Inkjet printer</text>
    <text x="356" y="284">Speakers</text>
    <text x="356" y="306">Desk lamp, chargers</text>
  </g>
  <rect x="24" y="348" width="592" height="38" rx="8" fill="#fff" stroke="#d9442b" stroke-width="2"/>
  <text x="320" y="372" font-size="13" fill="#d9442b" font-weight="700" text-anchor="middle">Never on battery outlets: laser printer, space heater, hair dryer</text>
</svg>
