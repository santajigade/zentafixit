<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Inside a toilet tank</text>
  <rect x="150" y="60" width="290" height="320" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="152" y="128" width="286" height="250" rx="8" fill="#dfe9f7"/>
  <path d="M152 128H438" stroke="#1d5fae" stroke-width="2"/>
  <!-- supply -->
  <path d="M194 380V422" stroke="#0f2240" stroke-width="6"/>
  <!-- fill valve -->
  <rect x="186" y="110" width="16" height="268" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="178" y="98" width="32" height="16" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="176" y="128" width="36" height="34" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#0f2240" stroke-width="2"/>
  <!-- refill tube -->
  <path d="M210 104C250 84 285 84 307 102" fill="none" stroke="#1d5fae" stroke-width="3"/>
  <!-- overflow tube -->
  <rect x="300" y="100" width="20" height="240" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- flush valve seat and drain -->
  <rect x="290" y="340" width="110" height="12" rx="2" fill="#d5dee8" stroke="#0f2240" stroke-width="2"/>
  <rect x="326" y="352" width="50" height="40" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="322" y="327" width="58" height="14" rx="6" fill="#566475" stroke="#0f2240" stroke-width="2"/>
  <path d="M320 334h4" stroke="#0f2240" stroke-width="3"/>
  <!-- handle, arm, chain -->
  <rect x="126" y="74" width="28" height="12" rx="4" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M154 80H372" stroke="#0f2240" stroke-width="4" stroke-linecap="round"/>
  <path d="M370 82V326" stroke="#0f2240" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- 1 inch bracket -->
  <path d="M328 100h12M334 100v28M328 128h12" fill="none" stroke="#d9442b" stroke-width="2"/>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M80 80H124"/><path d="M140 146H174"/><path d="M128 246H186"/><path d="M130 406H190"/>
    <path d="M258 86V68H452"/><path d="M344 114H452"/><path d="M372 196H452"/><path d="M320 254H452"/><path d="M380 320H452"/><path d="M400 362H452"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="24" y="85" font-weight="700">Handle</text>
    <text x="24" y="142" font-weight="700">Float cup</text><text x="24" y="158" font-size="12" fill="#566475">sets water level</text>
    <text x="24" y="242" font-weight="700">Fill valve</text><text x="24" y="258" font-size="12" fill="#566475">refills the tank</text>
    <text x="24" y="402" font-weight="700">Water supply</text><text x="24" y="418" font-size="12" fill="#566475">shut-off valve</text>
    <text x="458" y="72" font-weight="700">Refill tube</text>
    <text x="458" y="110" font-weight="700">Water line</text><text x="458" y="126" font-size="12" fill="#566475">about 1 inch below</text><text x="458" y="141" font-size="12" fill="#566475">top of overflow tube</text>
    <text x="458" y="192" font-weight="700">Chain</text><text x="458" y="208" font-size="12" fill="#566475">about 1/2 inch slack</text>
    <text x="458" y="250" font-weight="700">Overflow tube</text><text x="458" y="266" font-size="12" fill="#566475">extra water to bowl</text>
    <text x="458" y="316" font-weight="700">Flapper</text><text x="458" y="332" font-size="12" fill="#566475">seals the drain</text>
    <text x="458" y="366" font-weight="700">Flush valve seat</text><text x="458" y="382" font-size="12" fill="#566475">must be smooth</text>
    <text x="351" y="410" font-size="12" fill="#566475" text-anchor="middle">to bowl</text>
  </g>
</svg>
