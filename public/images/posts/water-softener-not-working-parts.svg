<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="460" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Parts of a two-tank water softener</text>
  <!-- pipes to house -->
  <g stroke="#566475" stroke-width="8" stroke-linecap="round"><path d="M24 104H135"/><path d="M24 126H135"/></g>
  <rect x="58" y="94" width="34" height="44" rx="6" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <!-- resin tank and control head -->
  <rect x="150" y="146" width="80" height="254" rx="30" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#dfe9f7" stroke="#1d5fae" stroke-width="1"><circle cx="170" cy="300" r="5"/><circle cx="186" cy="312" r="5"/><circle cx="202" cy="298" r="5"/><circle cx="214" cy="318" r="5"/><circle cx="174" cy="330" r="5"/><circle cx="194" cy="342" r="5"/><circle cx="210" cy="354" r="5"/><circle cx="170" cy="362" r="5"/><circle cx="190" cy="374" r="5"/><circle cx="208" cy="382" r="5"/><circle cx="182" cy="290" r="5"/><circle cx="200" cy="326" r="5"/></g>
  <rect x="135" y="86" width="110" height="60" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="150" y="96" width="80" height="20" rx="4" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <!-- brine line -->
  <path d="M245 116H401V180" fill="none" stroke="#1d5fae" stroke-width="4"/>
  <!-- brine tank -->
  <rect x="290" y="180" width="130" height="220" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="292" y="330" width="126" height="68" fill="#dfe9f7"/>
  <rect x="292" y="206" width="104" height="30" fill="#d5dee8"/>
  <rect x="292" y="236" width="104" height="22" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="2"/>
  <rect x="395" y="186" width="14" height="208" rx="4" fill="#fff" stroke="#1d5fae" stroke-width="2"/>
  <path d="M292 330H418" stroke="#1d5fae" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- leaders -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4"><path d="M410 116H438"/><path d="M418 247H438"/><path d="M418 330H438"/></g>
  <g font-size="14" fill="#14202c">
    <text x="190" y="136" font-size="13" font-weight="700" text-anchor="middle">Control head</text>
    <text x="190" y="110" font-size="11" fill="#1d5fae" text-anchor="middle">12:00</text>
    <text x="190" y="220" text-anchor="middle" font-weight="700">Resin</text><text x="190" y="238" text-anchor="middle" font-weight="700">tank</text>
    <text x="190" y="268" font-size="12" fill="#566475" text-anchor="middle">beads</text>
    <text x="24" y="168" font-weight="700">Bypass valve</text>
    <text x="24" y="186" font-size="13" fill="#566475">Set to service,</text><text x="24" y="202" font-size="13" fill="#566475">not bypass</text>
    <text x="444" y="112" font-weight="700">Brine line</text>
    <text x="444" y="130" font-size="12" fill="#566475">Carries brine to resin</text>
    <text x="444" y="236" font-weight="700" fill="#d9442b">Salt bridge</text>
    <text x="444" y="254" font-size="12" fill="#566475">Hard crust with an</text><text x="444" y="270" font-size="12" fill="#566475">empty gap below it</text>
    <text x="444" y="326" font-weight="700">Water line</text>
    <text x="444" y="344" font-size="12" fill="#566475">Loose salt should sit</text><text x="444" y="360" font-size="12" fill="#566475">a few inches above it</text>
    <text x="355" y="302" font-size="12" fill="#566475" text-anchor="middle">empty gap</text>
    <text x="355" y="375" font-size="12" fill="#1d5fae" text-anchor="middle">brine</text>
  </g>
  <rect x="24" y="414" width="592" height="34" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="40" y="436" font-size="13" fill="#14202c">Push a broom handle down through the salt to find a hidden bridge.</text>
</svg>
