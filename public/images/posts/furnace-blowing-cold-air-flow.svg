<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="fbca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Furnace blowing cold air: where to look</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="50" width="340" height="44" rx="8"/>
    <path d="M320 114l140 36-140 36-140-36z"/>
    <rect x="24" y="124" width="128" height="52" rx="8"/>
    <path d="M320 206l150 36-150 36-150-36z"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="24" y="300" width="184" height="84" rx="8"/><rect x="228" y="300" width="184" height="84" rx="8"/><rect x="432" y="300" width="184" height="84" rx="8"/>
  </g>
  <rect x="24" y="396" width="592" height="32" rx="8" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#fbca)">
    <path d="M320 94v18"/><path d="M180 150h-26"/><path d="M320 186v18"/>
    <path d="M170 242h-54v56"/><path d="M320 278v20"/><path d="M470 242h54v56"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="77" font-size="13">1. Thermostat on HEAT, 3 to 5°F above room</text>
    <text x="320" y="155" font-weight="700">Was the fan set to ON?</text>
    <text x="167" y="142" font-size="12" fill="#566475">yes</text><text x="338" y="200" font-size="12" fill="#566475">no</text>
    <text x="88" y="146" font-size="13">Switch it to</text><text x="88" y="164" font-size="13">AUTO (1)</text>
    <text x="320" y="247" font-weight="700">When is the air cold?</text>
    <text x="116" y="326" font-weight="700">First minute only</text>
    <text x="116" y="346" font-size="13">Normal start, turns</text>
    <text x="116" y="366" font-size="13">warm soon (2)</text>
    <text x="320" y="326" font-weight="700">Warm, then cold</text>
    <text x="320" y="346" font-size="13">Clogged filter, high</text>
    <text x="320" y="366" font-size="13">limit trips (3)</text>
    <text x="524" y="326" font-weight="700">Never warm</text>
    <text x="524" y="346" font-size="13">Flame sensor, pilot,</text>
    <text x="524" y="366" font-size="13">gas, drain (4 to 7)</text>
    <text x="320" y="417" font-size="13">Warm at the furnace but cold in one room? Check the ducts (8).</text>
  </g>
</svg>
