<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Good and poor spots for a mesh node</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2"><rect x="24" y="52" width="284" height="260" rx="8"/><rect x="332" y="52" width="284" height="260" rx="8"/></g>
  <rect x="25" y="53" width="282" height="38" rx="7" fill="#1f8a5b"/>
  <rect x="333" y="53" width="282" height="38" rx="7" fill="#d9442b"/>
  <g font-size="14" font-weight="700" fill="#fff"><text x="44" y="78">Good spots</text><text x="352" y="78">Poor spots</text></g>
  <g fill="#1f8a5b"><circle cx="50" cy="118" r="6"/><circle cx="50" cy="152" r="6"/><circle cx="50" cy="186" r="6"/><circle cx="50" cy="220" r="6"/><circle cx="50" cy="254" r="6"/></g>
  <g stroke="#d9442b" stroke-width="2.5" stroke-linecap="round">
    <path d="M353 113l10 10M363 113l-10 10"/><path d="M353 147l10 10M363 147l-10 10"/><path d="M353 181l10 10M363 181l-10 10"/>
    <path d="M353 215l10 10M363 215l-10 10"/><path d="M353 249l10 10M363 249l-10 10"/><path d="M353 283l10 10M363 283l-10 10"/>
  </g>
  <g font-size="13" fill="#14202c">
    <text x="66" y="123">In the open, on a shelf</text>
    <text x="66" y="157">Waist height or higher</text>
    <text x="66" y="191">Halfway to the weak spot</text>
    <text x="66" y="225">Central, near the modem</text>
    <text x="66" y="259">Wired to Ethernet if you can</text>
    <text x="374" y="123">Inside a cabinet or closet</text>
    <text x="374" y="157">Behind a TV</text>
    <text x="374" y="191">Next to metal or appliances</text>
    <text x="374" y="225">Near a fish tank or microwave</text>
    <text x="374" y="259">On the floor</text>
    <text x="374" y="293">In the dead zone itself</text>
  </g>
  <rect x="24" y="328" width="592" height="56" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <text x="320" y="361" font-size="13" fill="#14202c" text-anchor="middle"><tspan font-weight="700">Tip:</tspan> move a node a few feet, then rerun the app's placement test.</text>
</svg>
