<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="450" fill="#f3f6fa"/>
  <defs><marker id="pgf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Why won't it start? Check in this order</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="52" width="340" height="40" rx="8"/>
    <rect x="120" y="110" width="400" height="40" rx="8"/>
    <rect x="150" y="168" width="340" height="40" rx="8"/>
    <path d="M320 226l110 36-110 36-110-36z"/>
    <rect x="25" y="330" width="180" height="44" rx="8"/>
    <rect x="230" y="330" width="180" height="44" rx="8"/>
    <rect x="435" y="330" width="180" height="44" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="25" y="388" width="180" height="50" rx="8"/><rect x="230" y="388" width="180" height="50" rx="8"/><rect x="435" y="388" width="180" height="50" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#pgf-arrow)">
    <path d="M320 92v16"/><path d="M320 150v16"/><path d="M320 208v16"/>
    <path d="M210 262H115v66"/><path d="M320 298v30"/><path d="M430 262H525v66"/>
    <path d="M115 374v12"/><path d="M320 374v12"/><path d="M525 374v12"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="77">1. Unplug all cords and loads</text>
    <text x="320" y="135">2. Fuel, valve, switch, oil, level ground</text>
    <text x="320" y="193">3. Choke on, pull the cord</text>
    <text x="320" y="267" font-weight="700">What happens?</text>
    <text x="115" y="357">No firing at all</text>
    <text x="320" y="357">Sputters, then dies</text>
    <text x="525" y="357">Starter just clicks</text>
    <text x="115" y="409" font-size="13" font-weight="700">Spark plug, oil, fuel</text><text x="115" y="427" font-size="12" fill="#566475">causes 1, 3, 4, 6</text>
    <text x="320" y="409" font-size="13" font-weight="700">Choke or stale fuel</text><text x="320" y="427" font-size="12" fill="#566475">causes 2, 5</text>
    <text x="525" y="409" font-size="13" font-weight="700">Battery: use the cord</text><text x="525" y="427" font-size="12" fill="#566475">cause 7</text>
  </g>
</svg>
