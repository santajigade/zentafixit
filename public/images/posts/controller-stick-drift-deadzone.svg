<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">How a deadzone hides small drift</text>
  <!-- left: small deadzone -->
  <circle cx="170" cy="190" r="110" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M60 190h220M170 80v220" stroke="#d5dee8" stroke-width="1.5"/>
  <circle cx="170" cy="190" r="16" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <circle cx="196" cy="174" r="7" fill="#d9442b"/>
  <!-- right: larger deadzone -->
  <circle cx="470" cy="190" r="110" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M360 190h220M470 80v220" stroke="#d5dee8" stroke-width="1.5"/>
  <circle cx="470" cy="190" r="40" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <circle cx="496" cy="174" r="7" fill="#1f8a5b"/>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="170" y="328" font-weight="700">Small deadzone</text>
    <text x="170" y="346" font-size="12" fill="#566475">resting point sits outside it,</text>
    <text x="170" y="362" font-size="12" fill="#566475">so the game sees movement</text>
    <text x="470" y="328" font-weight="700">Slightly larger deadzone</text>
    <text x="470" y="346" font-size="12" fill="#566475">resting point is inside it,</text>
    <text x="470" y="362" font-size="12" fill="#566475">so the game ignores it</text>
  </g>
  <g font-size="12">
    <circle cx="40" cy="386" r="6" fill="#d9442b"/><text x="52" y="390" fill="#14202c">Stick's real resting point (drifting)</text>
    <circle cx="340" cy="386" r="6" fill="#1f8a5b"/><text x="352" y="390" fill="#14202c">Same point, now ignored</text>
  </g>
</svg>
