<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="380" fill="#f3f6fa"/>
  <defs><marker id="hrro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Power cycle order: modem first</text>
  <!-- icons -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="52" y="84" width="72" height="40" rx="6"/>
    <rect x="207" y="74" width="40" height="56" rx="6"/>
    <rect x="356" y="96" width="84" height="30" rx="6"/>
    <rect x="522" y="76" width="62" height="50" rx="6"/>
  </g>
  <g stroke="#0f2240" stroke-width="2" stroke-linecap="round" fill="none"><path d="M372 96l-10-26M424 96l10-26"/><path d="M542 116h22"/></g>
  <g fill="#1f8a5b"><circle cx="227" cy="92" r="4"/><circle cx="227" cy="106" r="4"/><circle cx="380" cy="111" r="4"/><circle cx="396" cy="111" r="4"/></g>
  <g fill="#566475"><circle cx="70" cy="104" r="3"/><circle cx="84" cy="104" r="3"/><circle cx="227" cy="120" r="3"/><circle cx="412" cy="111" r="3"/></g>
  <!-- step boxes -->
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="20" y="150" width="135" height="110" rx="8"/><rect x="175" y="150" width="135" height="110" rx="8"/><rect x="330" y="150" width="135" height="110" rx="8"/><rect x="485" y="150" width="135" height="110" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#hrro)"><path d="M155 205h18"/><path d="M310 205h18"/><path d="M465 205h18"/></g>
  <g fill="#0f2240"><circle cx="87" cy="174" r="13"/><circle cx="242" cy="174" r="13"/><circle cx="397" cy="174" r="13"/><circle cx="552" cy="174" r="13"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text x="87" y="179">1</text><text x="242" y="179">2</text><text x="397" y="179">3</text><text x="552" y="179">4</text></g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="87" y="210" font-weight="700">Unplug both</text><text x="87" y="228">modem and router</text>
    <text x="242" y="210" font-weight="700">Plug in modem</text><text x="242" y="228">wait for steady</text><text x="242" y="246">online light</text>
    <text x="397" y="210" font-weight="700">Plug in router</text><text x="397" y="228">wait for the</text><text x="397" y="246">Wi-Fi light</text>
    <text x="552" y="210" font-weight="700">Reconnect</text><text x="552" y="228">and test a</text><text x="552" y="246">website</text>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="20" y="276" width="135" height="32" rx="8"/><rect x="175" y="276" width="135" height="32" rx="8"/><rect x="330" y="276" width="135" height="32" rx="8"/><rect x="485" y="276" width="135" height="32" rx="8"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle"><text x="87" y="297">about 30 sec</text><text x="242" y="297">1 to 2 min</text><text x="397" y="297">1 to 2 min</text><text x="552" y="297">a few seconds</text></g>
  <text x="24" y="342" font-size="13" fill="#566475">One box from your ISP (a gateway)? Unplug just that one and wait</text>
  <text x="24" y="360" font-size="13" fill="#566475">for all its lights to settle before testing.</text>
</svg>
