<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="400" fill="#f3f6fa"/>
  <defs><marker id="phmeas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Measure standby power in 3 steps</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="24" y="56" width="180" height="76" rx="8"/>
    <rect x="230" y="56" width="180" height="76" rx="8"/>
    <rect x="436" y="56" width="180" height="76" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#phmeas)"><path d="M204 94h24"/><path d="M410 94h24"/></g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="114" y="84" font-weight="700" font-size="14">1. Plug in</text><text x="114" y="104">device into the meter,</text><text x="114" y="121">meter into the wall</text>
    <text x="320" y="84" font-weight="700" font-size="14">2. Switch it off</text><text x="320" y="104">the normal way, with</text><text x="320" y="121">the remote or button</text>
    <text x="526" y="84" font-weight="700" font-size="14">3. Read the watts</text><text x="526" y="104">wait a minute for the</text><text x="526" y="121">reading to settle</text>
  </g>
  <!-- wall outlet -->
  <rect x="96" y="156" width="64" height="88" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="4" stroke-linecap="round"><path d="M118 180v16M138 180v12"/></g>
  <circle cx="128" cy="218" r="6" fill="#0f2240"/>
  <!-- watt meter -->
  <rect x="200" y="160" width="110" height="84" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="214" y="172" width="82" height="30" rx="4" fill="#dfe9f7" stroke="#1d5fae" stroke-width="1.5"/>
  <text x="255" y="193" font-size="14" font-weight="700" fill="#1d5fae" text-anchor="middle">W</text>
  <g fill="#0f2240"><circle cx="232" cy="222" r="5"/><circle cx="255" cy="222" r="5"/><circle cx="278" cy="222" r="5"/></g>
  <path d="M160 200h40" stroke="#0f2240" stroke-width="3"/>
  <!-- device -->
  <path d="M310 202c40 0 50 0 90 0" fill="none" stroke="#0f2240" stroke-width="3"/>
  <rect x="400" y="160" width="140" height="80" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <rect x="410" y="170" width="120" height="58" rx="3" fill="#14202c"/>
  <circle cx="522" cy="234" r="3.5" fill="#d9442b"/>
  <g font-size="12" fill="#566475" text-anchor="middle">
    <text x="128" y="262">wall outlet</text><text x="255" y="262">watt meter</text><text x="470" y="262">device, switched off</text>
  </g>
  <g stroke-width="2">
    <rect x="24" y="282" width="180" height="80" rx="8" fill="#fff" stroke="#1f8a5b"/>
    <rect x="230" y="282" width="180" height="80" rx="8" fill="#dfe9f7" stroke="#1d5fae"/>
    <rect x="436" y="282" width="180" height="80" rx="8" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#14202c" text-anchor="middle">
    <text x="114" y="312" font-size="15" font-weight="700" fill="#1f8a5b">Under 1 W</text><text x="114" y="336">fine to leave</text>
    <text x="320" y="312" font-size="15" font-weight="700" fill="#1d5fae">1 to 5 W</text><text x="320" y="336">try a settings change</text>
    <text x="526" y="312" font-size="15" font-weight="700" fill="#14202c">Over 5 W</text><text x="526" y="336">smart strip, timer</text><text x="526" y="353">or switch off</text>
  </g>
  <text x="24" y="386" font-size="12" fill="#566475">Rule of thumb only. Weigh it against how often you use the device.</text>
</svg>
