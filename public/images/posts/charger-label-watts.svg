<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="300" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Read your charger's wattage from its label</text>
  <rect x="24" y="56" width="300" height="200" rx="18" fill="#2a2f36"/>
  <rect x="44" y="76" width="260" height="160" rx="8" fill="none" stroke="#6b7480"/>
  <g font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#d7dde4">
    <text x="58" y="104">AC ADAPTER</text>
    <text x="58" y="132">INPUT: 100-240V~ 1.5A 50/60Hz</text>
    <text x="58" y="164" fill="#ffd23f" font-weight="700">OUTPUT: 20V DC 3.25A</text>
    <text x="58" y="196">MADE IN CHINA</text>
  </g>
  <rect x="52" y="146" width="250" height="26" rx="4" fill="none" stroke="#ffd23f" stroke-width="2"/>
  <path d="M302 159H384" stroke="#c9a10a" stroke-width="2" stroke-dasharray="5 5"/>
  <g font-size="15" fill="#14202c">
    <text x="392" y="112" font-weight="700">Watts = Volts × Amps</text>
    <text x="392" y="150">20 V × 3.25 A</text>
    <text x="392" y="186" font-size="26" font-weight="800" fill="#0f2240">= 65 W</text>
    <text x="392" y="222" font-size="13" fill="#566475">Use a replacement or USB-C</text>
    <text x="392" y="240" font-size="13" fill="#566475">charger of at least this wattage.</text>
  </g>
</svg>
