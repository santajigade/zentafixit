<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a freezer makes its cold</text>
  <!-- cabinet -->
  <rect x="230" y="56" width="180" height="354" rx="10" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="244" y="70" width="152" height="104" rx="6" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="244" y="188" width="152" height="162" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#d5dee8" stroke-width="2"><path d="M246 240h114M246 292h114"/></g>
  <!-- freezer back panel and parts behind it -->
  <path d="M362 72v100" stroke="#566475" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g fill="#fff" stroke="#0f2240" stroke-width="1.5"><rect x="256" y="130" width="40" height="34" rx="3"/><rect x="302" y="140" width="44" height="24" rx="3"/></g>
  <path d="M368 98h20v10h-20v10h20v10h-20v10h20v10h-20" fill="none" stroke="#1d5fae" stroke-width="2"/>
  <circle cx="378" cy="83" r="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M378 76v14M371 83h14" stroke="#0f2240" stroke-width="1.5"/>
  <path d="M368 163h22" stroke="#d9442b" stroke-width="3" stroke-linecap="round"/>
  <!-- temperature control -->
  <rect x="262" y="196" width="40" height="14" rx="3" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <!-- door gasket -->
  <g fill="#ffd23f" stroke="#c9a10a" stroke-width="1"><rect x="227" y="64" width="6" height="112" rx="2"/><rect x="227" y="186" width="6" height="166" rx="2"/></g>
  <!-- machine compartment -->
  <rect x="244" y="362" width="152" height="40" rx="4" fill="#f3f6fa" stroke="#0f2240" stroke-width="2"/>
  <path d="M252 372h10v20h10v-20h10v20h10v-20h8" fill="none" stroke="#0f2240" stroke-width="1.8"/>
  <circle cx="322" cy="382" r="12" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <path d="M322 372v20M312 382h20" stroke="#0f2240" stroke-width="1.5"/>
  <rect x="344" y="368" width="44" height="30" rx="13" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <g fill="#0f2240"><rect x="240" y="410" width="14" height="6" rx="2"/><rect x="386" y="410" width="14" height="6" rx="2"/></g>
  <!-- leader lines -->
  <g stroke="#566475" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M226 116H132"/><path d="M262 203H194"/><path d="M252 378H160"/>
    <path d="M387 83H432"/><path d="M390 124H432"/><path d="M390 163L432 176"/><path d="M332 372L432 298"/><path d="M388 383H432"/>
  </g>
  <g font-size="14" fill="#14202c">
    <text x="24" y="120" font-weight="700">Door gasket</text><text x="24" y="138" font-size="13" fill="#566475">Seals the cold in</text>
    <text x="24" y="190" font-weight="700">Temperature</text><text x="24" y="207" font-weight="700">control</text><text x="24" y="225" font-size="13" fill="#566475">Freezer: 0°F</text><text x="24" y="242" font-size="13" fill="#566475">Fridge: 40°F or below</text>
    <text x="24" y="374" font-weight="700">Condenser coils</text><text x="24" y="392" font-size="13" fill="#566475">Shed heat, keep clean</text>
    <text x="440" y="80" font-weight="700">Evaporator fan</text><text x="440" y="98" font-size="13" fill="#566475">Moves freezer air</text>
    <text x="440" y="128" font-weight="700">Evaporator coil</text><text x="440" y="146" font-size="13" fill="#566475">Behind the back panel</text>
    <text x="440" y="180" font-weight="700">Defrost heater</text><text x="440" y="198" font-size="13" fill="#566475">Melts frost on a cycle</text>
    <text x="440" y="296" font-weight="700">Condenser fan</text><text x="440" y="314" font-size="13" fill="#566475">Cools the coils</text>
    <text x="440" y="378" font-weight="700">Compressor</text><text x="440" y="396" font-size="13" fill="#566475">Pumps refrigerant</text>
  </g>
  <text x="24" y="432" font-size="12" fill="#566475">Top-freezer shown. Other layouts use the same parts.</text>
</svg>
