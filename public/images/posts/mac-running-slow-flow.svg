<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="440" fill="#f3f6fa"/>
  <defs><marker id="msf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Is your Mac short on memory?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="150" y="54" width="340" height="44" rx="8"/>
    <rect x="150" y="124" width="340" height="44" rx="8"/>
    <path d="M320 192l150 38-150 38-150-38z"/>
    <rect x="30" y="300" width="260" height="56" rx="8"/>
    <rect x="350" y="300" width="260" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"><rect x="30" y="368" width="260" height="56" rx="8"/><rect x="350" y="368" width="260" height="56" rx="8"/></g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#msf)">
    <path d="M320 98v24"/><path d="M320 168v22"/><path d="M170 230H160v68"/><path d="M470 230h10v68"/><path d="M160 356v10"/><path d="M480 356v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="81">1. Restart from the Apple menu</text>
    <text x="320" y="151">2. Activity Monitor, Memory tab</text>
    <text x="320" y="226" font-weight="700">Memory Pressure</text><text x="320" y="243" font-weight="700">yellow or red?</text>
    <text x="146" y="222" font-size="12" fill="#566475">no</text><text x="496" y="222" font-size="12" fill="#566475">yes</text>
    <text x="160" y="324">Memory is fine: look for</text><text x="160" y="342">a CPU hog or a full drive</text>
    <text x="480" y="324">Apps want more memory</text><text x="480" y="342">than your Mac has</text>
    <text x="160" y="392" font-weight="700">Check causes 2, 3, 4, 6</text><text x="160" y="410" font-size="12">CPU, storage, login items, indexing</text>
    <text x="480" y="392" font-weight="700">Check causes 5, 8, 9</text><text x="480" y="410" font-size="12">browser tabs, RAM limits, age</text>
  </g>
</svg>
