<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="470" fill="#f3f6fa"/>
  <defs><marker id="dwcf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2240"/></marker></defs>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">What is left on the dishes?</text>
  <g fill="#fff" stroke="#0f2240" stroke-width="2">
    <rect x="120" y="52" width="400" height="40" rx="8"/>
    <rect x="120" y="112" width="400" height="40" rx="8"/>
    <path d="M320 172l150 28-150 28-150-28z"/>
    <rect x="20" y="254" width="190" height="56" rx="8"/>
    <rect x="225" y="254" width="190" height="56" rx="8"/>
    <rect x="430" y="254" width="190" height="56" rx="8"/>
    <rect x="20" y="330" width="190" height="56" rx="8"/>
    <rect x="225" y="330" width="190" height="56" rx="8"/>
    <rect x="430" y="330" width="190" height="56" rx="8"/>
  </g>
  <g fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5">
    <rect x="20" y="398" width="190" height="52" rx="8"/>
    <rect x="225" y="398" width="190" height="52" rx="8"/>
    <rect x="430" y="398" width="190" height="52" rx="8"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="1.8" marker-end="url(#dwcf)">
    <path d="M320 92v18"/><path d="M320 152v18"/>
    <path d="M170 200H115v52"/><path d="M320 228v24"/><path d="M470 200h55v52"/>
    <path d="M115 310v18"/><path d="M320 310v18"/><path d="M525 310v18"/>
    <path d="M115 386v10"/><path d="M320 386v10"/><path d="M525 386v10"/>
  </g>
  <g font-size="14" fill="#14202c" text-anchor="middle">
    <text x="320" y="77">1. Run the kitchen tap hot (about 120°F)</text>
    <text x="320" y="137">2. Run a Normal or Heavy cycle, then look</text>
    <text x="320" y="205" font-weight="700">What do you see?</text>
    <text x="115" y="278" font-weight="700">Food bits or grit</text><text x="115" y="297" font-size="13" fill="#566475">on plates and cups</text>
    <text x="320" y="278" font-weight="700">White cloudy film</text><text x="320" y="297" font-size="13" fill="#566475">mostly on glasses</text>
    <text x="525" y="278" font-weight="700">Detergent residue</text><text x="525" y="297" font-size="13" fill="#566475">pod or powder stuck</text>
    <g font-size="13">
      <text x="115" y="354">Clean the filter and</text><text x="115" y="372">spray arms, reload</text>
      <text x="320" y="354">Soak a glass in white</text><text x="320" y="372">vinegar for 5 minutes</text>
      <text x="525" y="354">Check water heat,</text><text x="525" y="372">fill and dispenser</text>
    </g>
    <text x="115" y="429" font-weight="700">Causes 1, 2, 3</text>
    <g font-size="12"><text x="320" y="419">Wipes off: causes 5, 6</text><text x="320" y="437">Stays: etching, cause 4</text></g>
    <text x="525" y="429" font-weight="700">Causes 4, 7, 8, 9</text>
  </g>
</svg>
