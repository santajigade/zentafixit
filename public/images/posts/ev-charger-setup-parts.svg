<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Open Sans, Arial, sans-serif">
  <rect width="640" height="390" fill="#f3f6fa"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f2240">Where a home Level 2 setup can fail</text>
  <!-- panel -->
  <rect x="40" y="64" width="100" height="170" rx="8" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g fill="#d5dee8" stroke="#566475" stroke-width="1"><rect x="58" y="80" width="28" height="14" rx="3"/><rect x="94" y="80" width="28" height="14" rx="3"/><rect x="58" y="102" width="28" height="14" rx="3"/><rect x="94" y="102" width="28" height="14" rx="3"/><rect x="58" y="188" width="28" height="14" rx="3"/><rect x="94" y="188" width="28" height="14" rx="3"/><rect x="58" y="210" width="28" height="14" rx="3"/><rect x="94" y="210" width="28" height="14" rx="3"/></g>
  <rect x="58" y="128" width="64" height="46" rx="4" fill="#ffd23f" fill-opacity=".45" stroke="#c9a10a" stroke-width="1.5"/>
  <path d="M76 140v22M104 140v22M76 151h28" stroke="#0f2240" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- wire to outlet -->
  <path d="M140 151h40" stroke="#0f2240" stroke-width="3" fill="none"/>
  <rect x="180" y="124" width="44" height="56" rx="6" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="3" stroke-linecap="round"><path d="M193 140v8M211 140v8M196 162h12"/></g>
  <path d="M224 151h36" stroke="#0f2240" stroke-width="5" fill="none"/>
  <!-- charger -->
  <rect x="260" y="64" width="120" height="170" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <circle cx="320" cy="90" r="8" fill="#1f8a5b"/>
  <rect x="282" y="112" width="76" height="40" rx="6" fill="#dfe9f7" stroke="#1d5fae" stroke-width="2"/>
  <!-- cable and handle -->
  <path d="M320 234c0 50 110 40 120-50" fill="none" stroke="#0f2240" stroke-width="6" stroke-linecap="round"/>
  <rect x="436" y="146" width="96" height="40" rx="14" fill="#fff" stroke="#0f2240" stroke-width="2.5"/>
  <rect x="486" y="138" width="24" height="10" rx="3" fill="#ffd23f" stroke="#0f2240" stroke-width="2"/>
  <!-- car -->
  <rect x="548" y="64" width="68" height="170" rx="12" fill="#dfe9f7" stroke="#0f2240" stroke-width="2"/>
  <rect x="532" y="154" width="30" height="24" rx="5" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <!-- callouts -->
  <g fill="#0f2240"><circle cx="90" cy="250" r="11"/><circle cx="202" cy="106" r="11"/><circle cx="352" cy="90" r="11"/><circle cx="392" cy="252" r="11"/><circle cx="498" cy="120" r="11"/><circle cx="582" cy="100" r="11"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text x="90" y="255">1</text><text x="202" y="111">2</text><text x="352" y="95">3</text><text x="392" y="257">4</text><text x="498" y="125">5</text><text x="582" y="105">6</text></g>
  <path d="M24 278H616" stroke="#d5dee8" stroke-width="2"/>
  <g font-size="13" fill="#14202c">
    <text x="40" y="306"><tspan font-weight="700">1 Breaker:</tspan> 240 V double-pole</text>
    <text x="40" y="334"><tspan font-weight="700">2 Outlet</tspan> or hardwired circuit</text>
    <text x="40" y="362"><tspan font-weight="700">3 Status light:</tspan> ready or fault</text>
    <text x="340" y="306"><tspan font-weight="700">4 Cable:</tspan> look for cuts, kinks</text>
    <text x="340" y="334"><tspan font-weight="700">5 Latch:</tspan> must click into place</text>
    <text x="340" y="362"><tspan font-weight="700">6 Car:</tspan> schedule and charge limit</text>
  </g>
</svg>
