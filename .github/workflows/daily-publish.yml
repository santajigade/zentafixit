# Rebuilds the site every day so posts with a reached pubDate go live.
# Setup: in Cloudflare Pages → Settings → Builds → Deploy hooks, create a hook for "main",
# then add it to GitHub → Settings → Secrets → Actions as CF_DEPLOY_HOOK.
name: Daily publish
on:
  schedule:
    - cron: '30 13 * * *' # 13:30 UTC = 8:30 AM US Eastern (standard time)
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then echo "CF_DEPLOY_HOOK not set"; exit 1; fi
          curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
