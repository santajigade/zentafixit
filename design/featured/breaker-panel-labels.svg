    <rect x="390" y="320" width="40" height="18" rx="4"/><rect x="390" y="374" width="40" height="18" rx="4"/>
    <rect x="390" y="428" width="40" height="18" rx="4"/><rect x="390" y="482" width="40" height="18" rx="4"/>
    <rect x="530" y="212" width="40" height="18" rx="4"/><rect x="530" y="266" width="40" height="18" rx="4"/>
    <rect x="530" y="320" width="40" height="18" rx="4"/><rect x="530" y="374" width="40" height="18" rx="4"/>
    <rect x="530" y="428" width="40" height="18" rx="4"/><rect x="530" y="482" width="40" height="18" rx="4"/>
