<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- laptop -->
  <rect x="250" y="120" width="500" height="320" rx="20" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="280" y="150" width="440" height="260" rx="8" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <path d="M200 440h600l-40 50H240z" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="450" y="452" width="100" height="14" rx="6" fill="#0f2240"/>
  <!-- speaker icon on screen, muted -->
  <path d="M410 250h40l50-40v130l-50-40h-40z" fill="#0f2240"/>
  <g stroke="#d9442b" stroke-width="12" stroke-linecap="round"><path d="M540 245l60 60M600 245l-60 60"/></g>
  <!-- desktop speaker -->
  <rect x="880" y="190" width="160" height="300" rx="18" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <circle cx="960" cy="260" r="30" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <circle cx="960" cy="390" r="58" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <circle cx="960" cy="390" r="20" fill="#0f2240"/>
  <circle cx="960" cy="260" r="9" fill="#0f2240"/>
  <!-- silent sound waves -->
  <g fill="none" stroke="#ffd23f" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 16">
    <path d="M1070 340a70 70 0 0 1 0 100"/><path d="M1100 315a110 110 0 0 1 0 150"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M250 90h500M250 80v20M750 80v20"/><path d="M850 190v300M840 190h20M840 490h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
