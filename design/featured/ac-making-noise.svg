<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- condenser cabinet -->
  <rect x="330" y="170" width="420" height="380" rx="22" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <g stroke="#0f2240" stroke-width="3" stroke-opacity=".35"><path d="M360 250v270M380 250v270M400 250v270M420 250v270M440 250v270M460 250v270M480 250v270M500 250v270M520 250v270M540 250v270M560 250v270M580 250v270M600 250v270M620 250v270M640 250v270M660 250v270M680 250v270M700 250v270M720 250v270"/></g>
  <!-- top fan grille -->
  <ellipse cx="540" cy="170" rx="190" ry="40" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <ellipse cx="540" cy="170" rx="130" ry="26" fill="none" stroke="#0f2240" stroke-width="3"/>
  <g stroke="#0f2240" stroke-width="10" stroke-linecap="round"><path d="M540 170l-110 -14M540 170l110 14M540 170l-50 22M540 170l50 -22"/></g>
  <circle cx="540" cy="170" r="12" fill="#0f2240"/>
  <!-- base pad -->
  <rect x="300" y="550" width="480" height="24" rx="6" fill="#ffffff" stroke="#0f2240" stroke-width="3"/>
  <!-- refrigerant lines -->
  <g stroke="#9fc4f0" stroke-width="10" fill="none" stroke-linecap="round"><path d="M330 470H220v80"/><path d="M330 500H250v50"/></g>
  <!-- sound waves -->
  <g stroke="#ffd23f" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M820 120a90 90 0 0 1 0 110"/><path d="M870 90a140 140 0 0 1 0 170"/><path d="M920 60a190 190 0 0 1 0 230"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M330 600h420M330 590v20M750 590v20"/><path d="M790 250v300M780 250h20M780 550h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
