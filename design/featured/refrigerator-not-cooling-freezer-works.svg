<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- refrigerator body -->
  <rect x="460" y="50" width="280" height="530" rx="24" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="478" y="68" width="244" height="160" rx="14" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="478" y="244" width="244" height="318" rx="14" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="694" y="110" width="12" height="80" rx="6" fill="#0f2240"/>
  <rect x="694" y="270" width="12" height="120" rx="6" fill="#0f2240"/>
  <!-- snowflake in freezer -->
  <g stroke="#7aace8" stroke-width="7" stroke-linecap="round"><path d="M590 104v88M552 126l76 44M552 170l76-44"/></g>
  <!-- warm wave in fridge -->
  <g fill="none" stroke="#ffd23f" stroke-width="7" stroke-linecap="round">
    <path d="M540 470c-14-18 14-34 0-52s14-34 0-52"/><path d="M590 470c-14-18 14-34 0-52s14-34 0-52"/><path d="M640 470c-14-18 14-34 0-52s14-34 0-52"/>
  </g>
  <!-- feet -->
  <g fill="#9fc4f0"><rect x="490" y="580" width="36" height="14" rx="3"/><rect x="674" y="580" width="36" height="14" rx="3"/></g>
  <!-- airflow arrow from freezer to fridge -->
  <g fill="none" stroke="#7aace8" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"><path d="M800 140c70 0 70 220 0 220"/></g>
  <path d="M812 344l-26 16 26 16z" fill="#7aace8"/>
  <!-- thermometer -->
  <rect x="300" y="250" width="40" height="220" rx="20" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="313" y="300" width="14" height="170" rx="7" fill="#ffd23f"/>
  <circle cx="320" cy="488" r="36" fill="#ffd23f" stroke="#fff" stroke-width="5"/>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M460 24h280M460 14v20M740 14v20"/><path d="M410 50v530M400 50h20M400 580h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
