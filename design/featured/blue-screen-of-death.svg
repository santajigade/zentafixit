<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- laptop lid -->
  <rect x="330" y="110" width="540" height="350" rx="22" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="360" y="140" width="480" height="290" rx="8" fill="#1d5fae" stroke="#0f2240" stroke-width="4"/>
  <!-- abstract crash screen: plain bars and a square block, no text -->
  <g fill="#dfe9f7">
    <rect x="400" y="190" width="70" height="14" rx="7"/>
    <rect x="400" y="240" width="300" height="12" rx="6" opacity=".9"/>
    <rect x="400" y="266" width="250" height="12" rx="6" opacity=".9"/>
    <rect x="400" y="292" width="200" height="12" rx="6" opacity=".7"/>
    <rect x="400" y="345" width="56" height="56" rx="4" opacity=".85"/>
    <rect x="474" y="356" width="170" height="10" rx="5" opacity=".6"/>
    <rect x="474" y="380" width="130" height="10" rx="5" opacity=".6"/>
  </g>
  <circle cx="600" cy="125" r="5" fill="#0f2240"/>
  <!-- laptop base -->
  <path d="M290 470h620l-30 48H320z" fill="#f3f6fa" stroke="#0f2240" stroke-width="4" stroke-linejoin="round"/>
  <rect x="545" y="474" width="110" height="12" rx="6" fill="#0f2240" opacity=".25"/>
  <!-- warning accent -->
  <path d="M960 150l70 124H890z" fill="#ffd23f" stroke="#0f2240" stroke-width="4" stroke-linejoin="round"/>
  <rect x="954" y="186" width="12" height="50" rx="6" fill="#0f2240"/>
  <circle cx="960" cy="254" r="8" fill="#0f2240"/>
  <!-- restart arrow accent -->
  <g fill="none" stroke="#ffd23f" stroke-width="8" stroke-linecap="round"><path d="M240 330a62 62 0 1 1-18-44"/></g>
  <path d="M206 262l28 22-34 12z" fill="#ffd23f"/>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M330 80h540M330 70v20M870 70v20"/><path d="M940 110v350M930 110h20M930 460h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
