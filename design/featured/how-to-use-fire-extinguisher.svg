  <path d="M960 560c-70 0-96-56-64-112 10 32 30 40 38 22-14-46 14-94 46-118 0 54 52 72 52 136 0 42-32 72-72 72z" fill="#ffd23f"/>
  <path d="M968 560c-28 0-38-26-20-52 4 14 18 14 20 0 14 14 32 28 26 46-4 6-12 6-26 6z" fill="#0f2240" opacity=".35"/>
  <!-- sweep arc -->
