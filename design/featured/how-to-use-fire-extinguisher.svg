  <circle cx="415" cy="110" r="30" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <path d="M415 110l14-16" stroke="#0f2240" stroke-width="4" stroke-linecap="round"/>
  <path d="M396 96a24 24 0 0 1 38 0" fill="none" stroke="#ffd23f" stroke-width="6"/>
  <!-- pin ring -->
  <circle cx="300" cy="190" r="18" fill="none" stroke="#ffd23f" stroke-width="6"/>
