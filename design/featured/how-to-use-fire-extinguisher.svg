  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M280 200v370M270 200h20M270 570h20"/><path d="M330 600h170"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
