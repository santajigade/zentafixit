  <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round"><path d="M830 250l50-30M840 315h62M830 380l50 30"/></g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M440 30h320M440 20v20M760 20v20"/><path d="M390 90v470M380 90h20M380 560h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
