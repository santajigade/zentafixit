  <rect x="460" y="80" width="136" height="290" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="604" y="80" width="136" height="290" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- freezer drawer -->
  <rect x="460" y="384" width="280" height="118" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- handles -->
  <g stroke="#0f2240" stroke-width="9" stroke-linecap="round"><path d="M580 150v150M620 150v150M540 410h120"/></g>
