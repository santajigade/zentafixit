  </g>
  <!-- leak highlight -->
  <circle cx="600" cy="560" r="44" fill="none" stroke="#ffd23f" stroke-width="5" stroke-dasharray="10 9"/>
  <!-- bubble level accent -->
  <rect x="860" y="250" width="200" height="44" rx="22" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="920" y="258" width="80" height="28" rx="14" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
  <circle cx="952" cy="272" r="9" fill="#fff" stroke="#0f2240" stroke-width="2"/>
  <g stroke="#0f2240" stroke-width="3"><path d="M940 258v28M980 258v28"/></g>
