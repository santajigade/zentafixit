<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- phone -->
  <rect x="200" y="90" width="250" height="460" rx="40" fill="#16305a" stroke="#ffffff" stroke-width="6"/>
  <rect x="218" y="108" width="214" height="424" rx="26" fill="#f3f6fa"/>
  <circle cx="325" cy="128" r="8" fill="#0f2240"/>
  <!-- list rows on screen -->
  <g fill="#9fb7da"><rect x="246" y="190" width="158" height="26" rx="8"/><rect x="246" y="236" width="120" height="26" rx="8"/></g>
  <rect x="246" y="282" width="158" height="26" rx="8" fill="#ffd23f"/>
  <circle cx="325" cy="420" r="40" fill="none" stroke="#0f2240" stroke-width="8" stroke-dasharray="40 22"/>
  <!-- signal waves from phone -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <path d="M500 270a70 70 0 0 1 0 100"/>
    <path d="M540 240a120 120 0 0 1 0 160"/>
  </g>
  <!-- broken waves -->
  <g fill="none" stroke="#9fb7da" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 22">
    <path d="M640 230a120 120 0 0 0 0 180"/>
  </g>
  <g stroke="#ffd23f" stroke-width="12" stroke-linecap="round"><path d="M600 290l40 60M640 290l-40 60"/></g>
  <!-- earbuds case -->
  <rect x="760" y="300" width="250" height="170" rx="72" fill="#f3f6fa" stroke="#ffffff" stroke-width="6"/>
  <line x1="768" y1="360" x2="1002" y2="360" stroke="#0f2240" stroke-width="5"/>
  <circle cx="885" cy="420" r="9" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
  <!-- earbuds -->
  <g fill="#f3f6fa" stroke="#ffffff" stroke-width="5">
    <circle cx="830" cy="190" r="42"/><rect x="814" y="200" width="30" height="88" rx="15"/>
    <circle cx="950" cy="190" r="42"/><rect x="936" y="200" width="30" height="88" rx="15"/>
  </g>
  <g fill="#0f2240"><circle cx="830" cy="186" r="14"/><circle cx="950" cy="186" r="14"/></g>
  <!-- dimension -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M760 520h250M760 510v20M1010 510v20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
