  <path d="M840 400c70 0 80 120 150 120h20" fill="none" stroke="#f3f6fa" stroke-width="6" stroke-linecap="round"/>
  <rect x="1008" y="502" width="40" height="36" rx="6" fill="#f3f6fa" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#f3f6fa" stroke-width="6" stroke-linecap="round"><path d="M1048 512h16M1048 528h16"/></g>
