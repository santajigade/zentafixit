  <rect x="470" y="70" width="260" height="490" rx="20" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="500" y="100" width="200" height="430" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
