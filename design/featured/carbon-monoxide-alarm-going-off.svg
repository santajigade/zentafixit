<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- alarm body -->
  <rect x="300" y="130" width="330" height="370" rx="44" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="340" y="170" width="250" height="290" rx="30" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- speaker grille -->
  <g fill="#0f2240">
    <circle cx="415" cy="235" r="8"/><circle cx="465" cy="235" r="8"/><circle cx="515" cy="235" r="8"/>
    <circle cx="415" cy="280" r="8"/><circle cx="465" cy="280" r="8"/><circle cx="515" cy="280" r="8"/>
    <circle cx="415" cy="325" r="8"/><circle cx="465" cy="325" r="8"/><circle cx="515" cy="325" r="8"/>
  </g>
  <!-- display and lights -->
  <rect x="395" y="365" width="140" height="44" rx="8" fill="#f3f6fa" stroke="#0f2240" stroke-width="3"/>
  <circle cx="390" cy="435" r="9" fill="#d9442b"/>
  <circle cx="420" cy="435" r="9" fill="#1f8a5b"/>
  <rect x="490" y="425" width="60" height="20" rx="10" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
