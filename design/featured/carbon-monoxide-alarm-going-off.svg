  <circle cx="900" cy="350" r="7" fill="#0f2240"/>
  <g stroke="#7aace8" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M950 300h50M985 285l15 15l-15 15"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M300 100h330M300 90v20M630 90v20"/><path d="M200 130v370M190 130h20M190 500h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
