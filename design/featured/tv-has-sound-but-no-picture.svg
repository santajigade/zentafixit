<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- tv body -->
  <rect x="230" y="110" width="620" height="370" rx="18" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <!-- black screen -->
  <rect x="254" y="134" width="572" height="312" rx="6" fill="#0f2240" stroke="#0f2240" stroke-width="4"/>
  <path d="M290 160l120 0M290 160l0 60" stroke="#7aace8" stroke-opacity=".35" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- speaker grille on bottom bezel -->
  <g fill="#0f2240"><circle cx="500" cy="463" r="4"/><circle cx="520" cy="463" r="4"/><circle cx="540" cy="463" r="4"/><circle cx="560" cy="463" r="4"/><circle cx="580" cy="463" r="4"/></g>
  <circle cx="800" cy="463" r="6" fill="#d9442b"/>
  <!-- stand -->
  <path d="M520 480l-30 70h100l-30-70z" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <rect x="430" y="548" width="220" height="18" rx="8" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <!-- sound waves -->
  <g fill="none" stroke="#ffd23f" stroke-width="10" stroke-linecap="round">
    <path d="M900 240a90 90 0 0 1 0 120"/>
    <path d="M950 200a150 150 0 0 1 0 200"/>
    <path d="M1000 160a210 210 0 0 1 0 280" stroke-opacity=".6"/>
