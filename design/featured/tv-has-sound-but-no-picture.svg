  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M230 70h620M230 60v20M850 60v20"/><path d="M180 110v370M170 110h20M170 480h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
