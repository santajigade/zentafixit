  <!-- spin arrows (yellow accent) -->
  <g fill="none" stroke="#ffd23f" stroke-width="10" stroke-linecap="round">
    <path d="M760 250a230 230 0 0 1 0 200"/>
    <path d="M320 450a230 230 0 0 1 0-200"/>
