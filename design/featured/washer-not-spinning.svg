  <path d="M660 117l-14 0" stroke="#0f2240" stroke-width="4" stroke-linecap="round"/>
  <!-- door and drum -->
  <circle cx="540" cy="350" r="140" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <circle cx="540" cy="350" r="108" fill="#dfe9f7" stroke="#0f2240" stroke-width="4"/>
  <g fill="#0f2240" opacity=".35"><circle cx="540" cy="280" r="7"/><circle cx="600" cy="385" r="7"/><circle cx="480" cy="385" r="7"/></g>
  <!-- heavy clump of laundry on one side -->
  <path d="M446 380c-6-30 10-56 38-60c14-18 46-14 56 6c22 2 34 22 28 42c-4 22-28 36-58 36c-34 2-60-6-64-24z" fill="#ffffff" stroke="#0f2240" stroke-width="4" stroke-linejoin="round"/>
  <path d="M478 350c14-6 28 0 34 12M520 336c14 2 24 12 26 24" fill="none" stroke="#0f2240" stroke-width="3" stroke-linecap="round"/>
