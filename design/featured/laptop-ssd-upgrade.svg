  <g transform="rotate(-8 400 415)">
    <rect x="236" y="390" width="360" height="54" rx="5" fill="#ffffff" stroke="#0f2240" stroke-width="5"/>
    <rect x="236" y="393" width="22" height="48" fill="#ffd23f"/>
    <rect x="290" y="400" width="80" height="34" rx="4" fill="#0f2240"/>
    <rect x="390" y="400" width="80" height="34" rx="4" fill="#0f2240"/>
    <rect x="490" y="404" width="50" height="26" rx="4" fill="#9fb7da"/>
    <path d="M596 405a12 12 0 0 1 0 24" fill="none" stroke="#0f2240" stroke-width="4"/>
  </g>
  <!-- insert arrow -->
  <path d="M700 480H630" stroke="#ffd23f" stroke-width="10" stroke-linecap="round"/>
  <path d="M600 480l34-20v40z" fill="#ffd23f"/>
  <!-- 2.5-inch drive -->
  <rect x="860" y="200" width="200" height="270" rx="14" fill="#f3f6fa" stroke="#ffffff" stroke-width="5"/>
  <rect x="890" y="240" width="140" height="120" rx="8" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="890" y="440" width="90" height="16" fill="#0f2240"/><rect x="996" y="440" width="40" height="16" fill="#0f2240"/>
