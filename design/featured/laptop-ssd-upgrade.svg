  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M236 560h360M236 550v20M596 550v20"/><path d="M1100 200v270M1090 200h20M1090 470h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
