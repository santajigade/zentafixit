<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- laptop base, underside open -->
  <rect x="140" y="120" width="620" height="400" rx="24" fill="#f3f6fa" stroke="#ffffff" stroke-width="5"/>
  <rect x="180" y="160" width="250" height="150" rx="10" fill="#dfe9f7" stroke="#0f2240" stroke-width="4"/>
  <g stroke="#0f2240" stroke-width="3"><path d="M200 190h210M200 220h210M200 250h210M200 280h210"/></g>
  <circle cx="620" cy="235" r="62" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <g stroke="#0f2240" stroke-width="4"><path d="M620 173v124M558 235h124M576 191l88 88M664 191l-88 88"/></g>
  <!-- M.2 slot -->
  <rect x="180" y="380" width="40" height="70" rx="4" fill="#0f2240"/>
  <circle cx="610" cy="415" r="10" fill="#0f2240"/>
