<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- refrigerator body -->
  <rect x="440" y="60" width="320" height="480" rx="22" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <!-- freezer door (top) and fridge door -->
  <rect x="460" y="80" width="280" height="150" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="460" y="244" width="280" height="258" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- handles -->
  <g stroke="#0f2240" stroke-width="9" stroke-linecap="round"><path d="M490 120v70M490 284v110"/></g>
  <!-- grille and legs -->
  <rect x="470" y="512" width="260" height="18" rx="6" fill="#0f2240"/>
  <g fill="#0f2240"><rect x="470" y="540" width="26" height="14" rx="3"/><rect x="704" y="540" width="26" height="14" rx="3"/></g>
  <!-- sound waves right: freezer -->
  <g fill="none" stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
    <path d="M800 115a60 60 0 0 1 0 80"/>
    <path d="M840 90a100 100 0 0 1 0 130"/>
    <path d="M880 65a140 140 0 0 1 0 180"/>
  </g>
  <!-- sound waves right: bottom -->
  <g fill="none" stroke="#9fc4f0" stroke-width="5" stroke-linecap="round">
    <path d="M800 480a50 50 0 0 1 0 64"/>
    <path d="M836 458a90 90 0 0 1 0 108"/>
  </g>
  <!-- sound waves left -->
  <g fill="none" stroke="#9fc4f0" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M400 300a60 60 0 0 0 0 80"/>
    <path d="M360 275a100 100 0 0 0 0 130"/>
    <path d="M320 250a140 140 0 0 0 0 180" opacity=".6"/>
  </g>
  <!-- fan accent -->
  <circle cx="680" cy="155" r="36" fill="#ffd23f" stroke="#0f2240" stroke-width="4"/>
  <g stroke="#0f2240" stroke-width="6" stroke-linecap="round"><path d="M680 129v52M654 155h52"/></g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M440 36h320M440 26v20M760 26v20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
