<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- refrigerator body -->
  <rect x="330" y="80" width="400" height="500" rx="20" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <path d="M330 270h400" stroke="#0f2240" stroke-width="4"/>
  <!-- freezer interior (door open) -->
  <rect x="352" y="100" width="356" height="150" rx="10" fill="#d5dee8" stroke="#0f2240" stroke-width="4"/>
  <!-- ice maker mold -->
  <rect x="380" y="118" width="230" height="46" rx="8" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <g fill="#f3f6fa" stroke="#0f2240" stroke-width="3"><rect x="394" y="128" width="30" height="26" rx="5"/><rect x="434" y="128" width="30" height="26" rx="5"/><rect x="474" y="128" width="30" height="26" rx="5"/><rect x="514" y="128" width="30" height="26" rx="5"/><rect x="554" y="128" width="30" height="26" rx="5"/></g>
  <!-- shutoff arm accent -->
  <path d="M610 140l60 70" stroke="#ffd23f" stroke-width="9" stroke-linecap="round"/>
  <!-- ice bin -->
  <rect x="390" y="180" width="200" height="60" rx="8" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <g fill="#f3f6fa" stroke="#0f2240" stroke-width="3"><rect x="410" y="200" width="26" height="22" rx="4" transform="rotate(-12 423 211)"/><rect x="450" y="196" width="26" height="22" rx="4"/><rect x="490" y="200" width="26" height="22" rx="4" transform="rotate(10 503 211)"/><rect x="530" y="198" width="26" height="22" rx="4"/></g>
  <!-- open freezer door -->
  <path d="M730 92l130 40v150l-130 -12z" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <path d="M760 120v120M790 128v116" stroke="#0f2240" stroke-width="4"/>
  <!-- fresh food door handle -->
  <rect x="690" y="300" width="16" height="140" rx="8" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- water line to valve -->
  <path d="M330 520c-80 0-110 -40-150 -40s-50 60-90 60" fill="none" stroke="#9fc4f0" stroke-width="7" stroke-linecap="round"/>
  <rect x="62" y="520" width="40" height="40" rx="6" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <path d="M82 520v-26M66 494h32" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- water drop accent -->
  <path d="M920 300c-34 50-44 72-44 92a44 44 0 0 0 88 0c0-20-10-42-44-92z" fill="#ffd23f"/>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M330 50h400M330 40v20M730 40v20"/><path d="M290 80v500M280 80h20M280 580h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
