<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- dishwasher body -->
  <rect x="380" y="80" width="400" height="480" rx="22" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="380" y="80" width="400" height="70" rx="22" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- dark control panel buttons -->
  <g fill="#0f2240"><rect x="420" y="102" width="120" height="26" rx="6"/><circle cx="590" cy="115" r="10"/><circle cx="630" cy="115" r="10"/><circle cx="670" cy="115" r="10"/></g>
  <!-- door -->
  <rect x="410" y="170" width="340" height="300" rx="14" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <rect x="490" y="196" width="180" height="18" rx="9" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <!-- kick plate -->
  <rect x="380" y="490" width="400" height="70" rx="12" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <g stroke="#0f2240" stroke-width="4" stroke-linecap="round"><path d="M430 525h300"/></g>
  <!-- latch accent -->
  <rect x="555" y="160" width="50" height="20" rx="5" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
  <!-- power symbol accent -->
  <g fill="none" stroke="#ffd23f" stroke-width="12" stroke-linecap="round">
    <path d="M906 248a72 72 0 1 1-92 0"/>
    <path d="M860 214v86"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M380 50h400M380 40v20M780 40v20"/><path d="M330 80v480M320 80h20M320 560h20"/></g>
  <!-- outlet hint -->
  <g fill="none" stroke="#9fc4f0" stroke-width="3"><rect x="180" y="300" width="80" height="120" rx="12"/></g>
  <g stroke="#9fc4f0" stroke-width="6" stroke-linecap="round"><path d="M208 335v20M232 335v20M208 375v20M232 375v20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
