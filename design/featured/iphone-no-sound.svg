<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- generic phone body -->
  <rect x="360" y="70" width="260" height="500" rx="28" fill="#f3f6fa" stroke="#ffffff" stroke-width="5"/>
  <rect x="380" y="110" width="220" height="400" rx="10" fill="#0f2240" stroke="#0f2240" stroke-width="4"/>
  <rect x="455" y="86" width="70" height="10" rx="5" fill="#0f2240"/>
  <!-- side buttons -->
  <rect x="346" y="170" width="14" height="44" rx="6" fill="#ffd23f"/>
  <rect x="346" y="230" width="14" height="60" rx="6" fill="#f3f6fa" stroke="#ffffff" stroke-width="2"/>
  <rect x="346" y="300" width="14" height="60" rx="6" fill="#f3f6fa" stroke="#ffffff" stroke-width="2"/>
  <!-- bottom grille dots -->
  <g fill="#0f2240"><circle cx="420" cy="540" r="5"/><circle cx="440" cy="540" r="5"/><circle cx="460" cy="540" r="5"/><circle cx="520" cy="540" r="5"/><circle cx="540" cy="540" r="5"/><circle cx="560" cy="540" r="5"/></g>
  <!-- muted speaker icon on screen -->
  <path d="M440 280h30l40-34v148l-40-34h-30z" fill="#d5dee8" fill-opacity=".55"/>
  <g stroke="#ffd23f" stroke-width="10" stroke-linecap="round"><path d="M528 290l44 44M572 290l-44 44"/></g>
  <!-- faded sound waves outside the phone -->
  <g fill="none" stroke="#9fc4f0" stroke-width="8" stroke-linecap="round" stroke-opacity=".5">
    <path d="M680 260a90 90 0 0 1 0 120"/>
    <path d="M730 220a150 150 0 0 1 0 200" stroke-opacity=".35"/>
    <path d="M780 180a210 210 0 0 1 0 280" stroke-opacity=".2"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M360 45h260M360 35v20M620 35v20"/><path d="M300 70v500M290 70h20M290 570h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
