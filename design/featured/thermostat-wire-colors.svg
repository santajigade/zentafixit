  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M380 60h440M380 50v20M820 50v20"/><path d="M880 90v440M870 90h20M870 530h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
