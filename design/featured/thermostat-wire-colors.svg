<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- thermostat base plate -->
  <rect x="380" y="90" width="440" height="440" rx="60" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="440" y="150" width="320" height="320" rx="30" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <!-- wire opening -->
  <rect x="560" y="300" width="80" height="120" rx="20" fill="#0f2240"/>
  <!-- terminals -->
  <g fill="#fff" stroke="#0f2240" stroke-width="5">
    <circle cx="490" cy="200" r="16"/><circle cx="490" cy="260" r="16"/><circle cx="490" cy="320" r="16"/>
    <circle cx="710" cy="200" r="16"/><circle cx="710" cy="260" r="16"/>
  </g>
  <g stroke="#0f2240" stroke-width="4" stroke-linecap="round"><path d="M482 200h16M482 260h16M482 320h16M702 200h16M702 260h16"/></g>
  <!-- wires from opening to terminals -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M580 340c-40 0-60-20-74-20" stroke="#9fc4f0"/>
    <path d="M590 320c-50-10-60-60-84-60" stroke="#f3f6fa"/>
    <path d="M600 310c-40-60-70-110-94-110" stroke="#ffd23f"/>
    <path d="M610 310c40-60 60-110 84-110" stroke="#9fc4f0"/>
    <path d="M620 320c40-20 50-60 74-60" stroke="#f3f6fa"/>
  </g>
  <g fill="none" stroke="#0f2240" stroke-width="3"><path d="M580 340c-40 0-60-20-74-20M590 320c-50-10-60-60-84-60M610 310c40-60 60-110 84-110M620 320c40-20 50-60 74-60" stroke-opacity=".35"/></g>
  <!-- cable bundle into wall -->
  <path d="M600 420v160" stroke="#f3f6fa" stroke-width="34" stroke-linecap="round"/>
  <path d="M600 420v160" stroke="#0f2240" stroke-width="3" stroke-dasharray="10 10"/>
