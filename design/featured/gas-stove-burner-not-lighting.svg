  <circle cx="830" cy="480" r="30" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <path d="M830 456v24" stroke="#0f2240" stroke-width="7" stroke-linecap="round"/>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M300 60h600M300 50v20M900 50v20"/><path d="M250 90v440M240 90h20M240 530h20"/></g>
