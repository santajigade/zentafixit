  <g fill="#0f2240"><circle cx="730" cy="450" r="7"/><circle cx="760" cy="450" r="7"/><circle cx="790" cy="450" r="7"/></g>
  <path d="M820 475H880V420" fill="none" stroke="#f3f6fa" stroke-width="7" stroke-linecap="round"/>
