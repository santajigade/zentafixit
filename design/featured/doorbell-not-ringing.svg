<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- door frame and door -->
  <rect x="120" y="90" width="300" height="516" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="150" y="120" width="240" height="486" rx="4" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <rect x="190" y="170" width="160" height="150" rx="6" fill="none" stroke="#0f2240" stroke-width="4"/>
  <rect x="190" y="360" width="160" height="190" rx="6" fill="none" stroke="#0f2240" stroke-width="4"/>
  <circle cx="360" cy="370" r="12" fill="#0f2240"/>
  <!-- button plate -->
  <rect x="460" y="300" width="56" height="96" rx="12" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <circle cx="488" cy="348" r="18" fill="#ffd23f" stroke="#0f2240" stroke-width="4"/>
  <!-- wires -->
  <g fill="none" stroke="#9fc4f0" stroke-width="5"><path d="M516 348H640V250H760"/><path d="M640 300H700V470H760"/></g>
  <!-- chime -->
  <rect x="760" y="170" width="300" height="170" rx="16" fill="#fff" stroke="#0f2240" stroke-width="5"/>
  <rect x="800" y="200" width="220" height="22" rx="8" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <rect x="800" y="238" width="220" height="22" rx="8" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <circle cx="860" cy="300" r="16" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <circle cx="960" cy="300" r="16" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <!-- sound arcs -->
  <g fill="none" stroke="#ffd23f" stroke-width="6" stroke-linecap="round"><path d="M1090 200q30 55 0 110"/><path d="M1120 180q46 75 0 150"/></g>
  <!-- transformer -->
  <rect x="760" y="430" width="150" height="100" rx="10" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <g stroke="#0f2240" stroke-width="4"><path d="M790 460h90M790 480h90M790 500h90"/></g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M760 140h300M760 130v20M1060 130v20"/><path d="M90 120v486M80 120h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
