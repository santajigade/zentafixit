<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- antennas -->
  <g fill="#f3f6fa" stroke="#ffffff" stroke-width="4"><rect x="380" y="120" width="26" height="190" rx="13" transform="rotate(-12 393 310)"/><rect x="794" y="120" width="26" height="190" rx="13" transform="rotate(12 807 310)"/></g>
  <!-- router body -->
  <rect x="300" y="300" width="600" height="170" rx="30" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="340" y="420" width="520" height="22" rx="11" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <!-- status lights, all dark but one -->
  <g fill="#0f2240"><circle cx="400" cy="360" r="13"/><circle cx="470" cy="360" r="13"/><circle cx="540" cy="360" r="13"/><circle cx="610" cy="360" r="13"/></g>
  <circle cx="680" cy="360" r="13" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
  <!-- vents -->
  <g stroke="#0f2240" stroke-width="5" stroke-linecap="round"><path d="M750 345v30M775 345v30M800 345v30M825 345v30"/></g>
  <!-- feet -->
  <g fill="#f3f6fa" stroke="#ffffff" stroke-width="3"><rect x="350" y="468" width="60" height="16" rx="6"/><rect x="790" y="468" width="60" height="16" rx="6"/></g>
  <!-- unplugged power cord and adapter -->
  <path d="M900 400c80 0 90 90 150 90" fill="none" stroke="#f3f6fa" stroke-width="8" stroke-linecap="round"/>
  <rect x="1040" y="470" width="80" height="56" rx="10" fill="#f3f6fa" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#f3f6fa" stroke-width="8" stroke-linecap="round"><path d="M1120 485h18M1120 511h18"/></g>
  <!-- broken connection mark -->
  <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round"><path d="M1150 470l20-20M1155 498h28M1150 526l20 20"/></g>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M300 530h600M300 520v20M900 520v20"/><path d="M250 300v170M240 300h20M240 470h20"/></g>
  <!-- faint wifi arcs, crossed out -->
  <g fill="none" stroke="#7aace8" stroke-width="8" stroke-linecap="round" opacity=".55"><path d="M540 200a90 90 0 0 1 120 0"/><path d="M565 228a52 52 0 0 1 70 0"/></g>
  <circle cx="600" cy="258" r="9" fill="#7aace8" opacity=".55"/>
  <path d="M545 150l110 120" stroke="#ffd23f" stroke-width="7" stroke-linecap="round"/>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
