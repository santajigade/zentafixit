<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7aace8" stroke-opacity=".16"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aace8" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f2240"/><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="630" fill="url(#G)"/>
  <!-- open lid (tilted back) -->
  <rect x="250" y="150" width="340" height="110" rx="50" fill="#f3f6fa" stroke="#ffffff" stroke-width="4" transform="rotate(-14 250 260)"/>
  <!-- case base -->
  <rect x="240" y="290" width="360" height="230" rx="70" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <path d="M244 312h352" stroke="#0f2240" stroke-width="4" fill="none"/>
  <ellipse cx="350" cy="330" rx="66" ry="26" fill="#dfe9f7" stroke="#0f2240" stroke-width="4"/>
  <ellipse cx="490" cy="330" rx="66" ry="26" fill="#dfe9f7" stroke="#0f2240" stroke-width="4"/>
  <!-- round earbuds sitting in the wells -->
  <circle cx="350" cy="300" r="50" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <circle cx="350" cy="300" r="22" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <circle cx="490" cy="300" r="50" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <circle cx="490" cy="300" r="22" fill="#f3f6fa" stroke="#0f2240" stroke-width="4"/>
  <!-- status light -->
  <circle cx="420" cy="455" r="11" fill="#ffd23f" stroke="#0f2240" stroke-width="3"/>
  <!-- broken signal waves -->
  <g fill="none" stroke="#ffd23f" stroke-width="8" stroke-linecap="round">
    <path d="M650 270a70 70 0 0 1 0 100"/>
    <path d="M690 240a110 110 0 0 1 0 160" stroke-dasharray="40 26"/>
  </g>
  <g fill="none" stroke="#9fc4f0" stroke-width="7" stroke-linecap="round" opacity=".7">
    <path d="M730 210a150 150 0 0 1 0 220" stroke-dasharray="22 30"/>
  </g>
  <!-- phone -->
  <rect x="840" y="120" width="210" height="400" rx="32" fill="#f3f6fa" stroke="#ffffff" stroke-width="4"/>
  <rect x="862" y="160" width="166" height="310" rx="12" fill="#fff" stroke="#0f2240" stroke-width="4"/>
  <g fill="#dfe9f7" stroke="#0f2240" stroke-width="3"><rect x="884" y="200" width="122" height="34" rx="8"/><rect x="884" y="250" width="122" height="34" rx="8"/><rect x="884" y="300" width="122" height="34" rx="8"/></g>
  <circle cx="945" cy="495" r="10" fill="none" stroke="#0f2240" stroke-width="3"/>
  <!-- dimension lines -->
  <g stroke="#9fc4f0" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M240 560h360M240 550v20M600 550v20"/><path d="M190 290v230M180 290h20M180 520h20"/></g>
  <rect x="0" y="606" width="1200" height="24" fill="#ffd23f"/>
</svg>
